# .github/workflows/azure-static-web-apps.yml
#
# CI/CD til Azure Static Web Apps (SWA) — Blazor WASM-frontend (frontend-blazor/).
#
# Krav (GitHub Secrets):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  → Azure Portal → SWA → Manage deployment token
#
# Frontendens prod-config (API-URL, AzureAd) sættes i frontend-blazor/wwwroot/appsettings.json
# (checkes ind) — MSAL-værdier er ikke hemmelige, kun tenant/client-id.

name: Frontend — Azure Static Web Apps

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

jobs:
  build_and_deploy:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Byg og deploy (Blazor WASM)
    steps:
      - uses: actions/checkout@v4

      - name: Opsæt .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish frontend-blazor/BrobyggerPortal.Web.csproj -c Release -o publish

      - name: Deploy til Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:      ${{ secrets.GITHUB_TOKEN }}
          action:          upload
          app_location:    'publish/wwwroot'   # færdigbygget output
          output_location: ''
          skip_app_build:  true

  close_pull_request:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Luk PR-miljø
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
