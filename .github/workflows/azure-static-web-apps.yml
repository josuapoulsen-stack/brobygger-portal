# .github/workflows/azure-static-web-apps.yml
#
# CI/CD til Azure Static Web Apps (SWA)
#
# Krav (GitHub Secrets):
#   AZURE_STATIC_WEB_APPS_API_TOKEN  → kopiér fra Azure Portal → SWA → Manage → Deployment token
#
# Valgfrit (bruges til Vite-build i FASE 2):
#   VITE_CLIENT_ID
#   VITE_TENANT_ID
#   VITE_API_URL
#
# Aktuelt kører portalen som én HTML-fil (prototype-tilstand).
# Aktiver Vite-build-trinnene (mærket FASE 2) når src/-appen er klar.

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # ── Deploy (push til main eller åben PR) ──────────────────────────────────────
  build_and_deploy:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build og deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── PROTOTYPE-TILSTAND: kopiér HTML-fil direkte til dist/ ─────────────────
      # Slet dette trin og aktiver Vite-trinnene nedenfor, når FASE 2 er klar.
      - name: Klargør dist/ (prototype HTML)
        run: |
          mkdir -p dist
          cp "Brobygger portal.html" dist/index.html
          [ -f logo.png ] && cp logo.png dist/logo.png || true
          cp staticwebapp.config.json dist/staticwebapp.config.json

      # ── FASE 2: Vite-build ────────────────────────────────────────────────────
      # Udkommentér disse tre trin + slet prototype-trinnet ovenfor.
      #
      # - name: Opsæt Node.js 20
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      #
      # - name: Installér npm-afhængigheder
      #   run: npm ci
      #
      # - name: Byg Vite-projekt
      #   run: npm run build:vite
      #   env:
      #     VITE_CLIENT_ID:       ${{ secrets.VITE_CLIENT_ID }}
      #     VITE_TENANT_ID:       ${{ secrets.VITE_TENANT_ID }}
      #     VITE_API_URL:         ${{ secrets.VITE_API_URL }}
      #     VITE_ENVIRONMENT:     ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      #     VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # ── Deploy til Azure SWA ──────────────────────────────────────────────────
      - name: Deploy til Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                       ${{ secrets.GITHUB_TOKEN }}
          action:                           upload
          app_location:                     dist
          skip_app_build:                   true
          # FASE 2: skift til nedenstående når Vite-build er aktiv
          # app_location:   /
          # output_location: dist
          # skip_app_build: false

  # ── Luk PR-staging-miljø ved lukning af PR ────────────────────────────────────
  close_pull_request:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Luk PR-miljø

    steps:
      - name: Luk staging-environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
