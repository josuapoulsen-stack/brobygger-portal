<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brobygger — mennesker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --ink:#18222b; --soft:#5a6a76; --line:#e3e0d7; --accent:#2f6f6a; --bg:#f6f4ef; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:960px; margin:0 auto; padding:2rem 1.25rem; }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    .sub { color:var(--soft); margin:0 0 1.5rem; font-size:.9rem; }
    .status { font-size:.85rem; padding:.5rem .75rem; border-radius:8px; margin-bottom:1rem; }
    .status.ok { background:#e0ece3; color:#2c6a45; }
    .status.err { background:#f2ddd6; color:#a5432f; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    th,td { text-align:left; padding:.6rem .8rem; border-bottom:1px solid var(--line); font-size:.9rem; }
    th { background:#efece4; font-weight:600; }
    tr:last-child td { border-bottom:none; }
    .pill { font-size:.72rem; padding:.1rem .5rem; border-radius:999px; background:#e2ecea; color:var(--accent); }
    form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-top:1.25rem; }
    label { font-size:.78rem; color:var(--soft); display:block; margin-bottom:.2rem; }
    input,select { width:100%; padding:.45rem .55rem; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:.55rem 1rem; font:inherit; font-weight:600; cursor:pointer; }
    .full { grid-column:1/-1; display:flex; justify-content:flex-end; }
    .muted { color:var(--soft); font-size:.85rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const BASE = "http://localhost:5080";   // det lokale .NET-system
    let TOKEN = "";

    async function api(method, path, body) {
      const res = await fetch(BASE + path, {
        method,
        headers: {
          "Accept": "application/json",
          ...(body ? { "Content-Type": "application/json" } : {}),
          ...(TOKEN ? { "Authorization": "Bearer " + TOKEN } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.title) || ("Fejl " + res.status));
      return data;
    }

    async function devLogin() {
      const r = await fetch(BASE + "/v1/auth/dev-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roles: ["Admin"] }),
      });
      if (!r.ok) throw new Error("Kunne ikke logge ind (dev-token)");
      TOKEN = (await r.json()).access_token;
    }

    function App() {
      const [rows, setRows] = useState([]);
      const [status, setStatus] = useState({ msg: "Forbinder til systemet…", ok: true });
      const [form, setForm] = useState({ navn: "", alder: "", telefon: "", hq: "", status: "ny" });

      async function indlaes() {
        const data = await api("GET", "/v1/mennesker");
        setRows(data);
        setStatus({ msg: data.length + " mennesker hentet fra systemet.", ok: true });
      }

      useEffect(() => {
        (async () => {
          try { await devLogin(); await indlaes(); }
          catch (e) { setStatus({ msg: "Kunne ikke forbinde — kører backend på localhost:5080? (" + e.message + ")", ok: false }); }
        })();
      }, []);

      async function opret(e) {
        e.preventDefault();
        try {
          await api("POST", "/v1/mennesker", {
            navn: form.navn,
            alder: form.alder ? parseInt(form.alder, 10) : null,
            telefon: form.telefon || null,
            hq: form.hq || null,
            status: form.status,
          });
          setForm({ navn: "", alder: "", telefon: "", hq: "", status: "ny" });
          await indlaes();
        } catch (e) {
          setStatus({ msg: "Kunne ikke oprette: " + e.message, ok: false });
        }
      }

      const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

      return (
        <div className="wrap">
          <h1>Mennesker</h1>
          <p className="sub">Rigtig skærm, koblet på det nye system. Data kommer fra din lokale backend.</p>
          <div className={"status " + (status.ok ? "ok" : "err")}>{status.msg}</div>

          <table>
            <thead>
              <tr><th>Navn</th><th>Alder</th><th>Telefon</th><th>Hovedsæde</th><th>Status</th></tr>
            </thead>
            <tbody>
              {rows.map((m) => (
                <tr key={m.id}>
                  <td>{m.navn}</td>
                  <td>{m.alder ?? "—"}</td>
                  <td>{m.telefon ?? "—"}</td>
                  <td>{m.hq ?? "—"}</td>
                  <td><span className="pill">{m.status}</span></td>
                </tr>
              ))}
              {rows.length === 0 && <tr><td colSpan="5" className="muted">Ingen mennesker endnu.</td></tr>}
            </tbody>
          </table>

          <form onSubmit={opret}>
            <div><label>Navn *</label><input required value={form.navn} onChange={set("navn")} /></div>
            <div><label>Alder</label><input type="number" value={form.alder} onChange={set("alder")} /></div>
            <div><label>Telefon</label><input value={form.telefon} onChange={set("telefon")} /></div>
            <div><label>Hovedsæde</label><input value={form.hq} onChange={set("hq")} /></div>
            <div>
              <label>Status</label>
              <select value={form.status} onChange={set("status")}>
                <option value="ny">Ny</option>
                <option value="matched">Matched</option>
                <option value="aktiv">Aktiv</option>
                <option value="afsluttet">Afsluttet</option>
                <option value="venteliste">Venteliste</option>
              </select>
            </div>
            <div className="full"><button type="submit">Opret menneske</button></div>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
