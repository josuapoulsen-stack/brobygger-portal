<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brobygger — mennesker</title>
  <style>
    :root { --ink:#18222b; --soft:#5a6a76; --line:#e3e0d7; --accent:#2f6f6a; --bg:#f6f4ef; --card:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:960px; margin:0 auto; padding:2rem 1.25rem; }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    .sub { color:var(--soft); margin:0 0 1.5rem; font-size:.9rem; }
    .status { font-size:.85rem; padding:.5rem .75rem; border-radius:8px; margin-bottom:1rem; }
    .status.ok { background:#e0ece3; color:#2c6a45; }
    .status.err { background:#f2ddd6; color:#a5432f; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    th,td { text-align:left; padding:.6rem .8rem; border-bottom:1px solid var(--line); font-size:.9rem; }
    th { background:#efece4; font-weight:600; }
    tr:last-child td { border-bottom:none; }
    .pill { font-size:.72rem; padding:.1rem .5rem; border-radius:999px; background:#e2ecea; color:var(--accent); }
    form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-top:1.25rem; }
    label { font-size:.78rem; color:var(--soft); display:block; margin-bottom:.2rem; }
    input,select { width:100%; padding:.45rem .55rem; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:.55rem 1rem; font:inherit; font-weight:600; cursor:pointer; }
    .full { grid-column:1/-1; display:flex; justify-content:flex-end; }
    .muted { color:var(--soft); font-size:.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mennesker</h1>
    <p class="sub">Rigtig skærm, koblet på det nye system. Data kommer fra din lokale backend.</p>
    <div id="status" class="status ok">Forbinder til systemet…</div>

    <table>
      <thead>
        <tr><th>Navn</th><th>Alder</th><th>Telefon</th><th>Hovedsæde</th><th>Status</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="muted">Henter…</td></tr>
      </tbody>
    </table>

    <form id="opret-form">
      <div><label>Navn *</label><input id="f-navn" required /></div>
      <div><label>Alder</label><input id="f-alder" type="number" /></div>
      <div><label>Telefon</label><input id="f-telefon" /></div>
      <div><label>Hovedsæde</label><input id="f-hq" /></div>
      <div>
        <label>Status</label>
        <select id="f-status">
          <option value="ny">Ny</option>
          <option value="matched">Matched</option>
          <option value="aktiv">Aktiv</option>
          <option value="afsluttet">Afsluttet</option>
          <option value="venteliste">Venteliste</option>
        </select>
      </div>
      <div class="full"><button type="submit">Opret menneske</button></div>
    </form>
  </div>

  <script>
    // Ren JavaScript — ingen eksterne filer, så siden tegner sig uanset netværk.
    var BASE = "http://localhost:5080";   // det lokale .NET-system
    var TOKEN = "";

    var elStatus = document.getElementById("status");
    var elRows = document.getElementById("rows");

    function setStatus(msg, ok) {
      elStatus.textContent = msg;
      elStatus.className = "status " + (ok ? "ok" : "err");
    }

    function esc(s) {
      return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    async function api(method, path, body) {
      var res = await fetch(BASE + path, {
        method: method,
        headers: Object.assign(
          { "Accept": "application/json" },
          body ? { "Content-Type": "application/json" } : {},
          TOKEN ? { "Authorization": "Bearer " + TOKEN } : {}
        ),
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null;
      var data = await res.json().catch(function () { return null; });
      if (!res.ok) throw new Error((data && data.title) || ("Fejl " + res.status));
      return data;
    }

    async function devLogin() {
      var r = await fetch(BASE + "/v1/auth/dev-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roles: ["Admin"] }),
      });
      if (!r.ok) throw new Error("Kunne ikke logge ind (dev-token)");
      TOKEN = (await r.json()).access_token;
    }

    function render(rows) {
      if (!rows.length) {
        elRows.innerHTML = '<tr><td colspan="5" class="muted">Ingen mennesker endnu.</td></tr>';
        return;
      }
      elRows.innerHTML = rows.map(function (m) {
        return "<tr><td>" + esc(m.navn) + "</td><td>" + esc(m.alder == null ? "—" : m.alder) +
          "</td><td>" + esc(m.telefon || "—") + "</td><td>" + esc(m.hq || "—") +
          '</td><td><span class="pill">' + esc(m.status) + "</span></td></tr>";
      }).join("");
    }

    async function indlaes() {
      var data = await api("GET", "/v1/mennesker");
      render(data);
      setStatus(data.length + " mennesker hentet fra systemet.", true);
    }

    document.getElementById("opret-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var alder = document.getElementById("f-alder").value;
      try {
        await api("POST", "/v1/mennesker", {
          navn: document.getElementById("f-navn").value,
          alder: alder ? parseInt(alder, 10) : null,
          telefon: document.getElementById("f-telefon").value || null,
          hq: document.getElementById("f-hq").value || null,
          status: document.getElementById("f-status").value,
        });
        e.target.reset();
        await indlaes();
      } catch (err) {
        setStatus("Kunne ikke oprette: " + err.message, false);
      }
    });

    (async function () {
      try {
        await devLogin();
        await indlaes();
      } catch (err) {
        setStatus("Kunne ikke forbinde — kører backend på localhost:5080? (" + err.message + ")", false);
      }
    })();
  </script>
</body>
</html>
