<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brobygger Portal</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />

    <!-- PWA: installerbar som app på Android/iOS -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#D8581C" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <!-- iOS: “Føj til hjemmeskærm” -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Brobygger" />
</head>
<body>
    <div id="app">
        <div class="app-splash">
            <div class="mark">◆</div>
            <div style="text-align:center">
                <div class="bn">Brobygger Portal</div>
                <div class="bs">Social Sundhed</div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#f2ddd6;color:#a5432f;padding:.6rem 1rem;">
        En fejl opstod. <a href="" class="reload">Genindlæs</a>
    </div>
    <script>
        window.blazorPrint = () => window.print();
        window.copyText = (t) => navigator.clipboard && navigator.clipboard.writeText(t);
        window.sseConnect = (url, dotnetRef) => {
            try { if (window._es) window._es.close(); } catch (e) {}
            const es = new EventSource(url);
            es.onmessage = (e) => { try { dotnetRef.invokeMethodAsync('OnSse', e.data); } catch (x) {} };
            es.onerror = () => {};
            window._es = es;
        };
        window.downloadText = (filename, text) => {
            const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(a.href);
        };
    </script>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Registrér service worker → gør appen installerbar + offline-app-shell
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
