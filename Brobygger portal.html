        {aktiveBb.map((bb, ri) => (
          <div key={bb.id} style={{
            display: 'grid', gridTemplateColumns: '170px repeat(7, 1fr)',
            borderBottom: ri < aktiveBb.length - 1 ? `1px solid ${SoS.line}` : 'none',
          }}>
            {/* Name cell */}
            <div style={{ padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 8,
              background: SoS.surface }}>
              <div style={{ width: 26, height: 26, borderRadius: 0, background: bb.bg, flexShrink: 0,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontFamily: SoS.mono, fontSize: 9, fontWeight: 700, color: '#fff' }}>{bb.avatar}</div>
              <div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                  color: SoS.ink, whiteSpace: 'nowrap' }}>{bb.name.split(' ')[0]}</div>
                {bb.status === 'pause' && (
                  <div style={{ fontFamily: SoS.mono, fontSize: 8, color: SoS.amber,
                    textTransform: 'uppercase', letterSpacing: 0.5 }}>Pause</div>
                )}
                {bb.active > 0 && (
                  <div style={{ fontFamily: SoS.mono, fontSize: 8, color: SoS.inkMuted }}>
                    {bb.active} aktive
                  </div>
                )}
              </div>
            </div>

            {/* Day cells */}
            {days.map((d, di) => {
              const ds       = fmt(d);
              const dayAppts = appointments.filter(a => a.date === ds && a.brobyggerId === bb.id);
              const isT      = ds === TODAY;
              const isPause  = bb.pauseUntil && bb.pauseUntil >= ds && bb.pauseUntil >= TODAY;
              return (
                <div key={di} style={{
                  borderLeft: `1px solid ${SoS.line}`,
                  background: isPause ? SoS.amber + '06' : isT ? SoS.accent + '04' : 'transparent',
                  padding: '6px 5px', minHeight: 56,
                }}>
                  {isPause ? (
                    <div style={{ fontFamily: SoS.mono, fontSize: 8, color: SoS.amber,
                      textTransform: 'uppercase', textAlign: 'center', paddingTop: 6,
                      letterSpacing: 0.5 }}>pause</div>
                  ) : dayAppts.map(a => {
                    const m  = SoS_MENNESKER[a.menneskeId];
                    const ok = a.status === 'confirmed';
                    return (
                      <div key={a.id} onClick={() => setSelectedAppt(a)} style={{
                        background: ok ? SoS.green + '12' : SoS.amber + '18',
                        borderLeft: '2px solid ' + (ok ? SoS.green : SoS.amber),
                        padding: '3px 5px', marginBottom: 2, cursor: 'pointer',
                      }}>
                        <div style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 700,
                          color: SoS.ink }}>{a.start}</div>
                        {m && <div style={{ fontFamily: SoS.sans, fontSize: 9,
                          color: SoS.inkSoft, lineHeight: 1.2 }}>{m.firstName}</div>}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {/* Totals row */}
      <div style={{ background: SoS.surface, border: `1px solid ${SoS.line}`,
        display: 'grid', gridTemplateColumns: '170px repeat(7, 1fr)', marginBottom: 14 }}>
        <div style={{ padding: '8px 14px', fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
          color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.5 }}>
          I ALT
        </div>
        {days.map((d, i) => {
          const ds    = fmt(d);
          const total = appointments.filter(a => a.date === ds).length;
          const conf  = appointments.filter(a => a.date === ds && a.status === 'confirmed').length;
          const isT   = ds === TODAY;
          return (
            <div key={i} style={{ borderLeft: `1px solid ${SoS.line}`,
              padding: '8px 6px', textAlign: 'center',
              background: isT ? SoS.accent + '06' : 'transparent' }}>
              {total > 0 ? (<>
                <div style={{ fontFamily: SoS.mono, fontSize: 14, fontWeight: 700,
                  color: isT ? SoS.accent : SoS.ink }}>{total}</div>
                <div style={{ fontFamily: SoS.mono, fontSize: 8, color: SoS.green,
                  marginTop: 1 }}>{conf} ✓</div>
              </>) : (
                <div style={{ fontFamily: SoS.mono, fontSize: 12,
                  color: SoS.line }}>—</div>
              )}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>

          { color: SoS.green, label: 'BEKRÆFTET' },

          </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <div style={{ width: 12, height: 12, background: SoS.amber + '06',

          <span style={{ fontFamily: SoS.mono, fontSize: 9.5, color: SoS.inkMuted }}>BROBYGGER PÅ PAUSE</span>
        </div>

          onClick={() => setWeekOffset(0)}>I dag</button>
        <button style={B()} onClick={() => setWeekOffset(n => n + 1)}>&#8594;</button>

        </button>
        <div style={{ display: 'flex', background: SoS.surfaceAlt, borderRadius: 0, padding: 3, gap: 2,
          border: `1px solid ${SoS.line}` }}>

            { k: 'dag',      l: 'Dag'      },

            <button key={k} onClick={() => setView(k)} style={{
              padding: '5px 12px', borderRadius: 0, border: 'none', cursor: 'pointer',
              fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
              background: view === k ? SoS.surface : 'transparent',
              color: view === k ? SoS.ink : SoS.inkMuted,
              borderBottom: `2px solid ${view === k ? SoS.accent : 'transparent'}`,
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* Filtre */}
      <div style={{ display: 'flex', gap: 12, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center' }}>
        <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
          <span style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600, color: SoS.inkMuted,
            textTransform: 'uppercase', letterSpacing: 0.5, marginRight: 4 }}>Type</span>
          {['alle', 'sundhed', 'forening', 'social'].map(f => {
            const t   = SoS_TYPER[f];
            const sel = typeFilter === f;
            return (
              <button key={f} onClick={() => setTypeFilter(f)} style={{
                padding: '4px 10px', borderRadius: SoS.r.sm, cursor: 'pointer',
                background: sel ? (t ? t.color : SoS.ink) : SoS.surface,
                color: sel ? '#fff' : SoS.inkSoft,
                border: `1px solid ${sel ? (t ? t.color : SoS.ink) : SoS.line}`,
                fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 600 : 400,
              }}>{f === 'alle' ? 'Alle' : t.short}</button>
            );
          })}
        </div>
        <div style={{ width: 1, height: 20, background: SoS.line }}/>
        <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
          <span style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600, color: SoS.inkMuted,
            textTransform: 'uppercase', letterSpacing: 0.5, marginRight: 4 }}>Status</span>
          {[
            { id: 'alle',      label: 'Alle',      c: null        },
            { id: 'confirmed', label: 'Bekræftet', c: SoS.green   },
            { id: 'pending',   label: 'Afventer',  c: SoS.amber   },
          ].map(s => {
            const sel = statusFilter === s.id;
            return (
              <button key={s.id} onClick={() => setStatusFilter(s.id)} style={{
                padding: '4px 10px', borderRadius: SoS.r.sm, cursor: 'pointer',
                background: sel ? (s.c || SoS.ink) : SoS.surface,
                color: sel ? '#fff' : SoS.inkSoft,
                border: `1px solid ${sel ? (s.c || SoS.ink) : SoS.line}`,
                fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 600 : 400,
              }}>{s.label}</button>
            );
          })}
        </div>
      </div>

      {/* Brobygger-filter chips */}
      <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap', alignItems: 'center' }}>
        <span style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600, color: SoS.inkMuted,
          textTransform: 'uppercase', letterSpacing: 0.5, marginRight: 2 }}>Brobygger</span>
        <button style={B(bbFilter === 'alle' ? { background: SoS.ink, color: '#fff', borderColor: SoS.ink } : {})}
          onClick={() => setBbFilter('alle')}>Alle</button>
        {aktiveBb.map(b => (
          <button key={b.id}
            style={B(bbFilter === b.id ? { background: b.bg, color: '#fff', borderColor: b.bg } : {})}
            onClick={() => setBbFilter(b.id)}>{b.name.split(' ')[0]}</button>
        ))}
      </div>

      {/* Stats */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginBottom: 14 }}>
        {[
          { l: 'Aftaler denne uge', v: filteredWeekAppts.length, c: SoS.ink   },
          { l: 'Bekræftede',        v: nOK,                      c: SoS.green },
          { l: 'Afventer svar',     v: nPend,                    c: SoS.amber },
        ].map((s, i) => (
          <div key={i} style={{ background: SoS.surface, borderRadius: 0,
            border: `1px solid ${SoS.line}`, padding: '12px 14px' }}>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase',
              marginBottom: 4 }}>{s.l}</div>
            <div style={{ fontFamily: SoS.mono, fontSize: 28, fontWeight: 700, color: s.c }}>{s.v}</div>
          </div>
        ))}
      </div>

      {/* VAGTPLAN */}
      {view === 'vagtplan' && renderVagtplan()}

      {/* UGE VIEW */}
      {view === 'uge' && (
        <div style={{ background: SoS.surface, borderRadius: 0,
          border: `1px solid ${SoS.line}`, overflow: 'hidden' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)',
            borderBottom: `1px solid ${SoS.line}` }}>
            {days.map((day, i) => {
              const ds = fmt(day), isT = ds === TODAY, cnt = getAppts(ds).length;
              return (
                <button key={i} onClick={() => { setSelectedDay(ds); setView('dag'); }} style={{
                  padding: '10px 8px', textAlign: 'center', border: 'none', cursor: 'pointer', width: '100%',
                  borderRight: i < 6 ? `1px solid ${SoS.line}` : 'none',
                  background: isT ? SoS.accent + '10' : 'transparent',
                }}>
                  <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                    color: isT ? SoS.accent : SoS.inkMuted, letterSpacing: 0.6,
                    textTransform: 'uppercase' }}>{DNAMES[i]}</div>
                  <div style={{ width: 28, height: 28, borderRadius: SoS.r.sm,
                    background: isT ? SoS.accent : 'transparent', color: isT ? '#fff' : SoS.ink,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    margin: '4px auto 2px', fontFamily: SoS.sans, fontSize: 14, fontWeight: 600 }}>
                    {day.getDate()}
                  </div>
                  {cnt > 0 && (
                    <div style={{ fontFamily: SoS.mono, fontSize: 9,
                      color: isT ? SoS.accent : SoS.inkMuted }}>{cnt} afd.</div>
                  )}
                </button>
              );
            })}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)',
            minHeight: 240, alignItems: 'start' }}>
            {days.map((day, i) => {
              const ds = fmt(day), all = getAppts(ds), vis = all.slice(0, MAX);
              const more = all.length - MAX, isT = ds === TODAY;
              return (
                <div key={i} style={{ padding: '8px 6px', minHeight: 120,
                  borderRight: i < 6 ? `1px solid ${SoS.line}` : 'none',
                  background: isT ? SoS.accent + '06' : 'transparent' }}>
                  {all.length === 0 && (
                    <div style={{ textAlign: 'center', paddingTop: 20,
                      fontFamily: SoS.sans, fontSize: 12, color: SoS.line }}>&#8212;</div>
                  )}
                  {vis.map(a => {
                    const m  = SoS_MENNESKER[a.menneskeId];
                    const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
                    const ok = a.status === 'confirmed';
                    return (
                      <div key={a.id} onClick={() => setSelectedAppt(a)} style={{
                        background: ok ? SoS.green + '10' : SoS.amber + '18',
                        borderLeft: '3px solid ' + (ok ? SoS.green : SoS.amber),
                        borderRadius: 0, padding: '5px 7px', marginBottom: 4, cursor: 'pointer',
                      }}>
                        <div style={{ fontFamily: SoS.mono, fontSize: 10, fontWeight: 700,
                          color: SoS.inkSoft }}>{a.start}</div>
                        <div style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 600,
                          color: SoS.ink, lineHeight: 1.2 }}>{m ? m.firstName : ''}</div>
                        <div style={{ fontFamily: SoS.sans, fontSize: 10,
                          color: SoS.inkSoft, lineHeight: 1.2 }}>{a.activity}</div>
                        {bb && (
                          <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginTop: 3 }}>
                            <div style={{ width: 14, height: 14, borderRadius: 0, background: bb.bg,
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                              fontFamily: SoS.mono, fontSize: 7, fontWeight: 700, color: '#fff',
                              flexShrink: 0 }}>{bb.avatar[0]}</div>
                            <div style={{ fontFamily: SoS.sans, fontSize: 9,
                              color: SoS.inkMuted }}>{bb.name.split(' ')[0]}</div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {more > 0 && (
                    <button onClick={() => { setSelectedDay(ds); setView('dag'); }}
                      style={{ width: '100%', padding: '5px 4px', borderRadius: 0, border: 'none',
                        background: SoS.accent + '10', cursor: 'pointer',
                        fontFamily: SoS.sans, fontSize: 11, fontWeight: 700, color: SoS.accent }}>
                      +{more} mere &#8594;
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* DAG VIEW */}
      {view === 'dag' && (
        <div>
          <div style={{ display: 'flex', gap: 4, marginBottom: 14, background: SoS.surface,
            borderRadius: 0, padding: 8, border: `1px solid ${SoS.line}`, overflowX: 'auto' }}>
            {days.map((d, i) => {
              const ds = fmt(d), sel = ds === selDs, cnt = getAppts(ds).length, isT = ds === TODAY;
              return (
                <button key={i} onClick={() => setSelectedDay(ds)} style={{
                  flex: '0 0 auto', padding: '8px 14px', borderRadius: 0, border: 'none',
                  borderBottom: `2px solid ${sel ? SoS.accent : 'transparent'}`,
                  background: 'transparent', cursor: 'pointer', textAlign: 'center',
                }}>
                  <div style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 700,
                    color: sel ? SoS.ink : SoS.inkMuted }}>{DNAMES[i]}</div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 16, fontWeight: 700, marginTop: 2,
                    color: sel ? SoS.ink : (isT ? SoS.accent : SoS.ink) }}>{d.getDate()}</div>
                  {cnt > 0 && (
                    <div style={{ fontFamily: SoS.sans, fontSize: 10, marginTop: 2,
                      color: SoS.inkMuted }}>{cnt} afd.</div>
                  )}
                </button>
              );
            })}
          </div>
          {selAppts.length === 0
            ? <div style={{ textAlign: 'center', padding: '40px 0',
                fontFamily: SoS.sans, fontSize: 14, color: SoS.inkMuted }}>Ingen aftaler denne dag</div>
            : selAppts.map(renderRow)
          }
        </div>
      )}

      {/* LISTE VIEW */}
      {view === 'liste' && (
        <div>
          {listeGroups.length === 0
            ? <div style={{ textAlign: 'center', padding: '40px 0',
                fontFamily: SoS.sans, fontSize: 14, color: SoS.inkMuted }}>Ingen aftaler denne uge</div>
            : listeGroups.map((d) => {
                const ds = fmt(d), isT = ds === TODAY;
                const di = days.findIndex(x => fmt(x) === ds);
                const apts = getAppts(ds);
                return (
                  <div key={ds} style={{ marginBottom: 18 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                      <div style={{ width: 38, height: 38, borderRadius: 0, flexShrink: 0,
                        background: isT ? SoS.accent : SoS.surfaceAlt,
                        border: `1px solid ${SoS.line}`,
                        display: 'flex', flexDirection: 'column', alignItems: 'center',
                        justifyContent: 'center' }}>
                        <span style={{ fontFamily: SoS.mono, fontSize: 8, fontWeight: 700,
                          color: isT ? 'rgba(255,255,255,0.8)' : SoS.inkMuted,
                          textTransform: 'uppercase' }}>{DNAMES[di]}</span>
                        <span style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 700,
                          lineHeight: 1, color: isT ? '#fff' : SoS.ink }}>{d.getDate()}</span>
                      </div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink }}>
                        {apts.length} {apts.length === 1 ? 'aftale' : 'aftaler'}
                      </div>
                    </div>
                    {apts.map(renderRow)}
                  </div>
                );
              })
          }
        </div>
      )}

      {selectedAppt && (
        <StaffApptDetail appt={selectedAppt} onClose={() => setSelectedAppt(null)} mode="modal"/>
      )}
      {apptModal && (
        <DesktopApptModal
          initial={apptModal}
          onClose={() => setApptModal(null)}
          onSave={saveAppt}
          onDelete={deleteAppt}
        />
      )}
      {udfaldsModal && (
        <PostAftaleModal
          aftale={udfaldsModal}
          onClose={() => setUdfaldsModal(null)}
          onSave={(updated) => {
            const newList = appointments.map(a => a.id === updated.id ? updated : a);
            window.SoS_APPOINTMENTS_BUSY = newList;
            if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
            setAppts(newList);
          }}
        />
      )}
    </>
  );
};

const DesktopRapport = () => {
  const [showExport, setShowExport] = React.useState(false);
  const [downloading, setDownloading] = React.useState(null);
  const [rapTab, setRapTab] = React.useState('rapporter');
  const handleDownload = (name) => { setDownloading(name); setTimeout(() => setDownloading(null), 2000); };

  const RAP_TABS = [
    { id: 'rapporter',    label: 'Rapporter & eksport' },
    { id: 'statistik',    label: 'Statistik' },
    { id: 'definitioner', label: 'Definitioner' },
  ];

  return (
  <>
    {/* Fane-vælger */}
    <div style={{ display: 'flex', gap: 0, marginBottom: 16,
      background: SoS.surface, borderRadius: 0, padding: 0,
      borderBottom: `1px solid ${SoS.line}` }}>
      {RAP_TABS.map(t => {
        const sel = rapTab === t.id;
        return (
          <button key={t.id} onClick={() => setRapTab(t.id)} style={{
            flex: 1, padding: '8px 0', borderRadius: 0, border: 'none',
            background: 'transparent',
            borderBottom: `2px solid ${sel ? SoS.accent : 'transparent'}`,
            boxShadow: 'none',
            fontFamily: SoS.sans, fontSize: 13, fontWeight: sel ? 700 : 400,
            color: sel ? SoS.ink : SoS.inkSoft, cursor: 'pointer',
            transition: 'all 0.15s',
          }}>{t.label}</button>
        );
      })}
    </div>

    {/* ── RAPPORTER-FANE ── */}
    {rapTab === 'rapporter' && <>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)',
      gap: 10, marginBottom: 14 }}>
      {[
        { t: 'Velux Fonden', sub: 'Årsrapport 2025', s: 'Godkendt', c: SoS.sage },
        { t: 'Trygfonden', sub: 'Ansøgning Q2 2026', s: 'Udkast', c: SoS.sun },
        { t: 'Nordea-fonden', sub: 'Månedsopdatering', s: 'Klar', c: SoS.sky },
      ].map((r, i) => (
        <DSCard key={i}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
            <Icon name="note" size={18} color={r.c}/>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink }}>{r.t}</div>
              <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft }}>{r.sub}</div>
            </div>
            <Pill bg={r.c + '22'} color={r.c}>{r.s}</Pill>
          </div>
          <Button full variant="secondary" style={{ height: 36, fontSize: 13 }} onClick={() => setShowExport(true)}>Åbn</Button>
        </DSCard>
      ))}
    </div>

    <DSCard title="Hurtige eksporter">
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10 }}>
        {[
          { i: 'chart', l: 'Månedsrapport', d: 'PDF · April 2026' },
          { i: 'users', l: 'Alle brobyggere', d: 'CSV · 412 rækker' },
          { i: 'heart', l: 'Menneske-data', d: 'CSV · anonymiseret' },
          { i: 'sparkle', l: 'SROI komplet', d: 'PDF + bilag' },
        ].map((x, i) => (
          <button key={i}
            onClick={() => x.l === 'SROI komplet' ? setShowExport(true) : handleDownload(x.l)}
            style={{
              padding: 16, background: downloading === x.l ? SoS.green + '10' : SoS.surface,
              borderRadius: 0, border: `1px solid ${SoS.line}`,
              cursor: 'pointer', textAlign: 'left', fontFamily: SoS.sans,
              transition: 'background 0.2s',
            }}>
            <Icon name={downloading === x.l ? 'check' : x.i} size={22}
              color={downloading === x.l ? SoS.green : SoS.accent}/>
            <div style={{ fontSize: 13, fontWeight: 600, color: SoS.ink, marginTop: 10 }}>{x.l}</div>
            <div style={{ fontSize: 11, color: SoS.inkSoft, marginTop: 2 }}>
              {downloading === x.l ? 'Hentes...' : x.d}
            </div>
          </button>
        ))}
      </div>
    </DSCard>
    {showExport && <ExportReport onClose={() => setShowExport(false)}/>}
    </>}

    {/* ── STATISTIK-FANE ── */}
    {rapTab === 'statistik' && (() => {
      const appts    = window.SoS_APPOINTMENTS_BUSY || [];
      const mns      = Object.values(window.SoS_MENNESKER || {});
      const logged   = appts.filter(a => a.brobyggerLog);
      const done     = logged.filter(a => a.brobyggerLog.udfald === 'gennemfoert');
      const afbud    = logged.filter(a => a.brobyggerLog.udfald === 'afbud');
      const udeblev  = logged.filter(a => a.brobyggerLog.udfald === 'ikke-modt');
      const total    = logged.length || 1;
      const afsluttede = mns.filter(m => m.status === 'afsluttet');
      const medTrivsel = afsluttede.filter(m => m.afslutTrivsel != null);

      // Udfald pct
      const udfalds = [
        { l: 'Gennemfaert', v: done.length, pct: Math.round(done.length/total*100), c: SoS.green },
        { l: 'Afbud',       v: afbud.length, pct: Math.round(afbud.length/total*100), c: SoS.amber },
        { l: 'Udeblev',     v: udeblev.length, pct: Math.round(udeblev.length/total*100), c: SoS.rose },
      ];

      // Aktivitetskategorier
      const katCount = {};
      appts.forEach(a => {
        if (a.kategori) katCount[a.kategori] = (katCount[a.kategori] || 0) + 1;
      });
      const topKat = Object.entries(katCount)
        .sort((a,b) => b[1]-a[1]).slice(0,6);

      // Kilde-fordeling
      const kildeCount = {};
      mns.forEach(m => { const k = m.kilde || 'andet'; kildeCount[k] = (kildeCount[k] || 0) + 1; });
      const kildeTotal = mns.length || 1;
      const KILDE_LABEL = {
        kommune: 'Kommune', hospital: 'Hospital', paarørende: 'Pårørende',
        selv: 'Selvhenvendelse', org: 'Organisation', laege: 'Læge/klinik', andet: 'Andet'
      };

      // Årsagskoder
      const aarsagCount = {};
      afsluttede.forEach(m => { if (m.afslutAarsag) aarsagCount[m.afslutAarsag] = (aarsagCount[m.afslutAarsag] || 0) + 1; });
      const AARSAG_LABEL = {
        'maal-naaet': 'Mål nået', 'borger-onsket': 'Ønskede at stoppe',
        'borger-netvaerk': 'Fandt eget netværk', 'borger-fraflyttet': 'Fraflyttet',
        'ingen-fremmøde': 'Ingen fremmøde', 'kapacitet': 'Kapacitet', 'andet': 'Andet',
      };

      // Trivsel gns
      const trivselGns = medTrivsel.length
        ? (medTrivsel.reduce((s, m) => s + m.afslutTrivsel, 0) / medTrivsel.length).toFixed(1)
        : null;

      // Køn-fordeling
      const koenCount = {};
      mns.forEach(m => { const k = m.koen || 'uoplyst'; koenCount[k] = (koenCount[k] || 0) + 1; });
      const KOEN_LABEL = { mand: 'Mand', kvinde: 'Kvinde', 'non-binaer': 'Non-binær', 'vil-ikke-oplyse': 'Ønsker ikke', uoplyst: 'Ikke registreret' };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

          {/* Udfald + trivsel side om side */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <DSCard title="Udfald" subtitle={`${logged.length} registrerede aftaler`}>
              {udfalds.map(u => (
                <div key={u.l} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
                  <div style={{ width: 80, fontFamily: SoS.sans, fontSize: 12, color: SoS.ink }}>{u.l}</div>
                  <div style={{ flex: 1, height: 8, background: SoS.lineSoft, borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ width: `${u.pct}%`, height: '100%', background: u.c, borderRadius: 4 }}/>
                  </div>
                  <div style={{ width: 42, textAlign: 'right', fontFamily: SoS.mono, fontSize: 12, fontWeight: 700, color: u.c }}>
                    {u.pct}%
                  </div>
                  <div style={{ width: 24, textAlign: 'right', fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted }}>
                    ({u.v})
                  </div>
                </div>
              ))}
            </DSCard>

            <DSCard title="Trivsel ved afslutning" subtitle={medTrivsel.length > 0 ? `${medTrivsel.length} vurderinger` : 'Ingen data endnu'}>
              {trivselGns ? (
                <>
                  <div style={{ fontFamily: SoS.mono, fontSize: 36, fontWeight: 700,
                    color: parseFloat(trivselGns) >= 4 ? SoS.green : parseFloat(trivselGns) <= 2 ? SoS.rose : SoS.amber,
                    letterSpacing: -1, marginBottom: 6 }}>
                    {trivselGns} <span style={{ fontSize: 14, color: SoS.inkSoft, fontWeight: 400 }}>/ 5</span>
                  </div>
                  <div style={{ display: 'flex', gap: 4 }}>
                    {[1,2,3,4,5].map(n => {
                      const cnt = medTrivsel.filter(m => m.afslutTrivsel === n).length;
                      return (
                        <div key={n} style={{ flex: 1, textAlign: 'center' }}>
                          <div style={{ height: Math.max(cnt * 8, 4), background:
                            n <= 2 ? SoS.rose : n >= 4 ? SoS.green : SoS.amber,
                            borderRadius: '2px 2px 0 0', marginBottom: 4 }}/>
                          <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkMuted }}>{n}</div>
                        </div>
                      );
                    })}
                  </div>
                </>
              ) : (
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted,
                  textAlign: 'center', padding: '16px 0' }}>
                  Registreres ved afslutning af forløb
                </div>
              )}
            </DSCard>
          </div>

          {/* Aktivitetskategorier + kilde */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <DSCard title="Aktivitetskategorier" subtitle="Top 6">
              {topKat.length === 0 ? (
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted,
                  textAlign: 'center', padding: '16px 0' }}>Ingen kategorier registreret endnu</div>
              ) : topKat.map(([k, v], i) => {
                const maxKat = topKat[0][1] || 1;
                const AKTIVITET_LABEL = (window.AKTIVITET_KATEGORIER && window.AKTIVITET_KATEGORIER[k])
                  ? window.AKTIVITET_KATEGORIER[k].label : k;
                return (
                  <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                    <div style={{ width: 90, fontFamily: SoS.sans, fontSize: 11, color: SoS.ink,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {AKTIVITET_LABEL}
                    </div>
                    <div style={{ flex: 1, height: 6, background: SoS.lineSoft, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ width: `${(v/maxKat)*100}%`, height: '100%',
                        background: SoS.accent, borderRadius: 3 }}/>
                    </div>
                    <div style={{ width: 24, textAlign: 'right', fontFamily: SoS.mono, fontSize: 11,
                      fontWeight: 600, color: SoS.inkMuted }}>{v}</div>
                  </div>
                );
              })}
            </DSCard>

            <DSCard title="Henvisningskanal">
              {Object.entries(kildeCount).sort((a,b)=>b[1]-a[1]).map(([k,v]) => (
                <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                  <div style={{ width: 100, fontFamily: SoS.sans, fontSize: 11, color: SoS.ink }}>
                    {KILDE_LABEL[k] || k}
                  </div>
                  <div style={{ flex: 1, height: 6, background: SoS.lineSoft, borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${(v/kildeTotal)*100}%`, height: '100%',
                      background: SoS.sky, borderRadius: 3 }}/>
                  </div>
                  <div style={{ width: 32, textAlign: 'right', fontFamily: SoS.mono, fontSize: 11,
                    fontWeight: 600, color: SoS.inkMuted }}>
                    {Math.round(v/kildeTotal*100)}%
                  </div>
                </div>
              ))}
            </DSCard>
          </div>

          {/* Årsagskoder + køn */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            <DSCard title="Afslutningsårsager" subtitle={`${afsluttede.length} afsluttede forløb`}>
              {afsluttede.length === 0 ? (
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted,
                  textAlign: 'center', padding: '16px 0' }}>Ingen afsluttede forløb endnu</div>
              ) : Object.entries(aarsagCount).sort((a,b)=>b[1]-a[1]).map(([k,v]) => {
                const maxA = Math.max(...Object.values(aarsagCount), 1);
                const isPositiv = k === 'maal-naaet' || k === 'borger-netvaerk';
                return (
                  <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                    <div style={{ width: 110, fontFamily: SoS.sans, fontSize: 11, color: SoS.ink,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      {AARSAG_LABEL[k] || k}
                    </div>
                    <div style={{ flex: 1, height: 6, background: SoS.lineSoft, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ width: `${(v/maxA)*100}%`, height: '100%',
                        background: isPositiv ? SoS.green : SoS.inkMuted, borderRadius: 3 }}/>
                    </div>
                    <div style={{ width: 20, textAlign: 'right', fontFamily: SoS.mono, fontSize: 11,
                      fontWeight: 600, color: SoS.inkMuted }}>{v}</div>
                  </div>
                );
              })}
            </DSCard>

            <DSCard title="Køn" subtitle={`${mns.length} registrerede mennesker`}>
              {Object.entries(koenCount).sort((a,b)=>b[1]-a[1]).map(([k,v]) => (
                <div key={k} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
                  <div style={{ width: 120, fontFamily: SoS.sans, fontSize: 11, color: SoS.ink }}>
                    {KOEN_LABEL[k] || k}
                  </div>
                  <div style={{ flex: 1, height: 6, background: SoS.lineSoft, borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${(v/kildeTotal)*100}%`, height: '100%',
                      background: SoS.sage, borderRadius: 3 }}/>
                  </div>
                  <div style={{ width: 32, textAlign: 'right', fontFamily: SoS.mono, fontSize: 11,
                    fontWeight: 600, color: SoS.inkMuted }}>{v}</div>
                </div>
              ))}
            </DSCard>
          </div>
        </div>
      );
    })()}

    {/* ── DEFINITIONER-FANE ── */}
    {rapTab === 'definitioner' && (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

        {/* Indsatsniveauer */}
        <DSCard title="Indsatsniveauer">
          <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
            marginBottom: 14, lineHeight: 1.6 }}>
            Indsatsniveauet beregnes <strong>automatisk</strong> fra registrerede kontakthændelser.
            Niveauet stiger, når betingelserne opfyldes — det kan ikke manuelt sættes.
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: `2px solid ${SoS.line}` }}>
                {['Niveau', 'Betingelse', 'SROI-relevans'].map(h => (
                  <th key={h} style={{ padding: '6px 10px', textAlign: 'left',
                    fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                    color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {
                  niveau: 'Ingen kontakt',
                  color: '#999',
                  betingelse: '0 registrerede hændelser',
                  sroi: 'Tæller ikke',
                },
                {
                  niveau: 'Kontakt etableret',
                  color: '#6B8CAE',
                  betingelse: '≥ 1 gennemført hændelse (enhver type)',
                  sroi: 'Grunddata — bruges til intensitetsanalyse',
                },
                {
                  niveau: 'Personligt møde',
                  color: '#7FA089',
                  betingelse: '≥ 1 gennemført "Møde med brobygger"',
                  sroi: 'Kvalificeret kontakt — tæller i volumen',
                },
                {
                  niveau: 'Følgeskab',
                  color: '#E87A3E',
                  betingelse: '≥ 1 gennemført følgeskab (primær eller sekundær)',
                  sroi: 'Kerneydelse — tæller direkte i SROI-beregning',
                },
                {
                  niveau: 'Fler-aftaleforløb',
                  color: '#D64545',
                  betingelse: '≥ 2 gennemførte følgeskaber',
                  sroi: 'Højeste SROI-værdi — bruges til intensitet 2–3 / 4+',
                },
              ].map((r, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${SoS.line}` }}>
                  <td style={{ padding: '10px 10px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 0,
                        background: r.color, flexShrink: 0 }}/>
                      <span style={{ fontFamily: SoS.sans, fontSize: 13,
                        fontWeight: 600, color: r.color }}>{r.niveau}</span>
                    </div>
                  </td>
                  <td style={{ padding: '10px 10px', fontFamily: SoS.sans,
                    fontSize: 13, color: SoS.ink }}>{r.betingelse}</td>
                  <td style={{ padding: '10px 10px', fontFamily: SoS.sans,
                    fontSize: 12, color: SoS.inkSoft, lineHeight: 1.4 }}>{r.sroi}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </DSCard>

        {/* Kontakttyper */}
        <DSCard title="Kontakttyper">
          <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
            marginBottom: 14, lineHeight: 1.6 }}>
            Hver kontakthændelse klassificeres med én af nedenstående typer.
            Typen afgør, om hændelsen tæller som følgeskab og i hvilken sektor.
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead>
              <tr style={{ borderBottom: `2px solid ${SoS.line}` }}>
                {['Type', 'Beskrivelse', 'Tæller som', 'Sektor'].map(h => (
                  <th key={h} style={{ padding: '6px 10px', textAlign: 'left',
                    fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                    color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {
                  type: 'Telefonisk kontakt',
                  color: '#6B8CAE',
                  desc: 'Opkald eller SMS-kontakt med mennesket',
                  taller: 'Kontakt',
                  sektor: '—',
                },
                {
                  type: 'Møde med brobygger',
                  color: '#7FA089',
                  desc: 'Fysisk eller digitalt møde — ikke følgeskab',
                  taller: 'Kontakt + Møde',
                  sektor: '—',
                },
                {
                  type: 'Følgeskab – primær sundhed',
                  color: '#E87A3E',
                  desc: 'Ledsagelse til praktiserende læge, tandlæge o.l.',
                  taller: 'Kontakt + Møde + Følgeskab',
                  sektor: 'Primær',
                },
                {
                  type: 'Følgeskab – sekundær sundhed',
                  color: '#D64545',
                  desc: 'Ledsagelse til sygehus, ambulatorium, speciallæge',
                  taller: 'Kontakt + Møde + Følgeskab',
                  sektor: 'Sekundær',
                },
                {
                  type: 'Andet',
                  color: '#999',
                  desc: 'Øvrige hændelser, der ikke passer i de andre kategorier',
                  taller: 'Kontakt',
                  sektor: '—',
                },
              ].map((r, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${SoS.line}` }}>
                  <td style={{ padding: '10px 10px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 8, height: 8, borderRadius: 0,
                        background: r.color, flexShrink: 0 }}/>
                      <span style={{ fontFamily: SoS.sans, fontSize: 13,
                        fontWeight: 600, color: r.color }}>{r.type}</span>
                    </div>

<script type="text/babel">
const { useState, useEffect } = React;

const AppWithTweaks = () => {
  const [tweaks, setTweak] = useTweaks({
    "role": "admin",
    "busyLevel": "busy",
    "experience": "experienced",
    "flow": "none"
  });

  // URL-demo mode: ?rolle=brobygger&navn=Maja (to-bruger demo)
  const demo = window.SoS_DEMO || {};
  const activeRole = demo.active ? demo.rolle : tweaks.role;

  // Auto-skalér enheden så den altid passer i vinduet
  const [scale, setScale] = useState(1);
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 500);
  useEffect(() => {
    const DEVICE_H = 844, DEVICE_W = 390, PAD = 32;
    const calc = () => {
      setIsMobile(window.innerWidth <= 500);
      setScale(Math.min(
        1,
        (window.innerHeight - PAD) / DEVICE_H,
        (window.innerWidth  - PAD) / DEVICE_W,
      ));
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, []);

  const [msgOpenId,   setMsgOpenId]   = useState(null);
  const [msgCompose,  setMsgCompose]  = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [viewingHq, setViewingHq] = useState("Aarhus");
  const [screen, setScreen] = useState("hjem");
  const [detailId, setDetailId] = useState(null);
  const [showPWA, setShowPWA] = useState(true);
  const [desktopMode, setDesktopMode] = useState(false);

  const isNew = tweaks.experience === "new";
  const isBusy = tweaks.busyLevel === "busy";
  const appts = (activeRole === "brobygger" && !isBusy) ? SoS_APPOINTMENTS_EMPTY : SoS_APPOINTMENTS_BUSY;

  // Brugerpersona: URL-params overskriver tweak-defaults
  const _demoNavn   = demo.active && demo.navn ? demo.navn : null;
  const _demoAvatar = _demoNavn ? _demoNavn.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() : null;
  const _defaultNavn = activeRole === 'raadgiver' ? 'Linda Thomsen'
                      : activeRole === 'admin'    ? 'Admin Bruger'
                      : isNew ? 'Sofie Lindahl' : 'Maja Holmberg';
  const _defaultAvatar = activeRole === 'raadgiver' ? 'LT'
                        : activeRole === 'admin'    ? 'AB'
                        : isNew ? 'SL' : 'MH';
  const user = { ...SoS_USER,
    name:      _demoNavn   || _defaultNavn,
    firstName: (_demoNavn  || _defaultNavn).split(' ')[0],
    avatar:    _demoAvatar || _defaultAvatar,
    avatarBg:  demo.active
      ? (activeRole === 'brobygger' ? SoS.orange : SoS.sky)
      : (isNew ? SoS.sky : SoS.orange),
  };

  useEffect(() => {
    setScreen("hjem");
    setDetailId(null);
    setSettingsOpen(false);
    if (activeRole === "brobygger") {
      setDesktopMode(false);
      // Nulstil til erfaren-tilstand (Maja) når man skifter til brobygger
      if (tweaks.experience === "new") setTweak("experience", "experienced");
    }
  }, [activeRole]);

  const openAppt = (id) => setDetailId(id);
  const backFromAppt = () => setDetailId(null);
  const navigate = (s) => { setDetailId(null); setScreen(s); };
  const unreadCount = SoS_NOTIFICATIONS.filter(n => n.unread).length
    + JSON.parse(localStorage.getItem('sos_notifikationer') || '[]').filter(n => !n.read && !n.status).length;

  let content;
  if (tweaks.flow === "mslogin") {
    content = <MSLogin
      onDone={(rolle) => { if (rolle) setTweak("role", rolle); setTweak("flow", "none"); }}
      onCancel={() => setTweak("flow", "none")}
    />;
  } else if (tweaks.flow === "export" && activeRole !== "brobygger") {
    content = <ExportReport onClose={() => setTweak("flow", "none")} />;
  } else if (tweaks.flow === "onboarding") {
    content = <OnboardingWizard onClose={() => setTweak("flow", "none")} />;
  } else if (tweaks.flow === "register" && activeRole === "brobygger") {
    content = <RegistrerEfterAftale appt={SoS_APPOINTMENTS_BUSY[0]} onClose={() => setTweak("flow", "none")} />;
  } else if (tweaks.flow === "matching" && activeRole !== "brobygger") {
    content = <MatchingFlow onClose={() => setTweak("flow", "none")} />;
  } else if (tweaks.flow === "intake" && activeRole !== "brobygger") {
    content = <IntakeFlow onClose={() => setTweak("flow", "none")} viewingHq={viewingHq}/>;
  } else if (activeRole === "admin" || activeRole === "raadgiver") {
    if (settingsOpen) {
      content = <AdminSettings
        currentHq={viewingHq}
        ownHq="Aarhus"
        isAdmin={activeRole === "admin"}
        onPick={(hq) => { setViewingHq(hq); setSettingsOpen(false); }}
        onClose={() => setSettingsOpen(false)} />;
    } else {
      content = <AdminMobile
        user={user}
        viewingHq={viewingHq}
        ownHq="Aarhus"
        isAdmin={activeRole === "admin"}
        onOpenSettings={() => setSettingsOpen(true)}
        onOpenIntake={() => setTweak("flow", "intake")}
        onOpenMatching={() => setTweak("flow", "matching")}
        onOpenMessages={(id) => setMsgOpenId(id)}
        onOpenDesktop={() => setDesktopMode(true)} />;
    }
  } else if (detailId) {
    const appt = [...SoS_APPOINTMENTS_BUSY, ...SoS_HISTORIK].find(a => a.id === detailId);
    content = appt ? (
      <div style={{ position: "absolute", inset: 0, background: SoS.cream, overflowY: "auto" }}>
        <AppointmentDetailScreen appt={appt} onBack={backFromAppt} onComplete={backFromAppt} />
      </div>
    ) : null;
  } else {
    content = (
      <div style={{ position: "absolute", inset: 0, background: SoS.cream, overflow: "hidden" }}>
        <Screen bg={SoS.cream}>
          {screen === "hjem" && <HomeScreen user={user} appointments={appts} onOpenAppt={openAppt} onNavigate={navigate} variant={isNew ? "new" : "busy"} />}
          {screen === "kalender" && <CalendarScreen appointments={appts} shifts={SoS_SHIFTS} onOpenAppt={openAppt} onAddShift={() => {}} />}
          {/* historik-tab fjernet — info vises under aftale-detaljer */}
          {screen === "notif" && (
            msgCompose
              ? <ComposeMessage
                  role={activeRole}
                  ownHq={viewingHq}
                  onClose={() => setMsgCompose(false)}
                />
              : msgOpenId
              ? <MessageThread
                  threadId={msgOpenId}
                  role={activeRole}
                  onBack={() => setMsgOpenId(null)}
                />
              : <MessagesList
                  onOpen={(id) => setMsgOpenId(id)}
                  onCompose={() => setMsgCompose(true)}
                  role={activeRole}
                  ownHq={viewingHq}
                  onNavigate={navigate}
                />
          )}
          {screen === "profil" && <ProfileScreen user={user} onSwitchRole={() => setTweak("role", "raadgiver")} />}
        </Screen>
        {screen === "hjem" && showPWA && <PWABanner onDismiss={() => setShowPWA(false)} />}
        <TabBar active={screen} onChange={navigate} notifCount={unreadCount} />
      </div>
    );
  }

  if (desktopMode && (tweaks.role === "admin" || tweaks.role === "raadgiver")) {
    return (
      <React.Fragment>
        <div style={{ position: "fixed", inset: 0, background: "#1A130D", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <DesktopView user={user} ownHq="Aarhus" isAdmin={tweaks.role === "admin"} onClose={() => setDesktopMode(false)} />
        </div>
        <TweaksPanel title="Tweaks">
          <TweakSection label="Visning">
            <TweakRadio label="Enhed" value="desktop"
              options={[{ value: "mobile", label: "Mobil" }, { value: "desktop", label: "Desktop" }]}
              onChange={(v) => { if (v === "mobile") setDesktopMode(false); }}/>
            <TweakRadio label="Rolle" value={tweaks.role}
              options={[
                { value: "brobygger", label: "Brobygger" },
                { value: "raadgiver", label: "Raadgiver" },
                { value: "admin", label: "Admin" },
              ]}
              onChange={(v) => setTweak("role", v)}/>
          </TweakSection>
        </TweaksPanel>
      </React.Fragment>
    );
  }

  if (isMobile) {
    return (
      <div style={{
        position: 'fixed', inset: 0, overflow: 'hidden',
        background: SoS.cream,
        paddingTop: 'env(safe-area-inset-top)',
        paddingBottom: 'env(safe-area-inset-bottom)',
      }}>
        {content}
        {/* Persona-badge: vises kun i URL-demo mode */}
        {demo.active && (
          <div style={{
            position: 'fixed', top: 'calc(env(safe-area-inset-top) + 10px)',
            right: 12, zIndex: 9998, pointerEvents: 'none',
            background: activeRole === 'brobygger' ? SoS.sage : SoS.sky,
            color: '#fff', borderRadius: 99, padding: '4px 11px',
            fontFamily: SoS.sans, fontSize: 11, fontWeight: 700,
            boxShadow: '0 2px 8px rgba(0,0,0,0.25)',
            display: 'flex', alignItems: 'center', gap: 5,
          }}>
            <div style={{ width: 6, height: 6, borderRadius: 3,
              background: 'rgba(255,255,255,0.7)' }}/>
            {demo.navn || (activeRole === 'brobygger' ? 'Brobygger' : 'Rådgiver')}
          </div>
        )}
      </div>
    );
  }

  return (
    <React.Fragment>
      <div style={{
        position: "fixed", inset: 0, overflow: "hidden",
        background: "radial-gradient(ellipse at top, #F3EADC 0%, #EFE3D1 60%, #FBF5EE 100%)",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <div style={{
          transform: `scale(${scale})`,
          transformOrigin: "center center",
          transition: "transform 0.15s ease",
        }}>
          <IOSDevice width={390} height={844}>
            {content}
          </IOSDevice>
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection label="Vis prototypen som">
          <TweakRadio label="Rolle" value={tweaks.role}
            options={[
              { value: "brobygger", label: "Brobygger (frivillig)" },
              { value: "raadgiver", label: "Raadgiver (eget hq)" },
              { value: "admin", label: "Admin (alle hq)" },
            ]}
            onChange={(v) => setTweak("role", v)}
          />
          {tweaks.role === "brobygger" && (
            <React.Fragment>
              <TweakRadio label="Kalender" value={tweaks.busyLevel}
                options={[{ value: "busy", label: "Travl uge" }, { value: "empty", label: "Ingen aftaler" }]}
                onChange={(v) => setTweak("busyLevel", v)}
              />
              <TweakRadio label="Bruger" value={tweaks.experience}
                options={[
                  { value: "experienced", label: "Erfaren (Maja, 14 mdr)" },
                  { value: "new", label: "Ny bruger (Sofie)" },
                ]}
                onChange={(v) => setTweak("experience", v)}
              />
            </React.Fragment>
          )}
        </TweakSection>
        <TweakSection label="Vis flow">
          <TweakRadio label="Aktivt flow" value={tweaks.flow}
            options={[
              { value: "none", label: "Ingen (normal visning)" },
              { value: "mslogin", label: "Microsoft-login" },
              { value: "onboarding", label: "Onboarding wizard" },
              ...(tweaks.role === "brobygger"
                ? [{ value: "register", label: "Registrer efter aftale" }]
                : [
                    { value: "intake",   label: "Registrer menneske" },
                    { value: "matching", label: "Matching-flow" },
                    { value: "export",   label: "SROI-rapport / eksport" },
                  ]),
            ]}
            onChange={(v) => setTweak("flow", v)}
          />
        </TweakSection>
        <TweakSection label="Testdata">
          <button onClick={() => {
            localStorage.removeItem('sos_live_chat');
            alert('Live-chat ryddet.');
          }} style={{
            width: '100%', padding: '8px 0', borderRadius: 8, border: 'none',
            background: '#E8F0FE', color: '#1A56DB',
            fontFamily: 'system-ui', fontSize: 12, fontWeight: 600, cursor: 'pointer',
            marginBottom: 6,
          }}>
            Ryd live-chat
          </button>
          <button onClick={() => {
            if (window.confirm('Nulstil al testdata og genindlæs prototypen?')) {
              window.SoS_STORE?.clear();
              window.location.reload();
            }
          }} style={{
            width: '100%', padding: '8px 0', borderRadius: 8, border: 'none',
            background: '#FFE8E0', color: '#C0392B',
            fontFamily: 'system-ui', fontSize: 12, fontWeight: 600, cursor: 'pointer',
          }}>
            Nulstil testdata
          </button>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<AppWithTweaks />);

</script>
