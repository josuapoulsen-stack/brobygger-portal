const TelefonSoegWidget = ({ onOpenMenneske }) => {
  const [open,   setOpen]   = React.useState(false);
  const [query,  setQuery]  = React.useState('');
  const [match,  setMatch]  = React.useState(null); // null | false | obj
  const inputRef = React.useRef(null);

  const norm = (s) => (s || '').replace(/\D/g,'').replace(/^45/,'');

  React.useEffect(() => {
    if (open) { setTimeout(() => inputRef.current?.focus(), 60); }
    else { setQuery(''); setMatch(null); }
  }, [open]);

  React.useEffect(() => {
    const q = norm(query);
    if (q.length < 2) { setMatch(null); return; }
    const alle = Object.values(window.SoS_MENNESKER || {});
    const found = alle.find(m => {
      const tel = norm(m.mobil || '');
      return tel.length >= 2 && tel.includes(q);
    });
    setMatch(found ?? false);
  }, [query]);

  const SoS_T = window.SoS_TYPER || {};

  return (
    <div style={{ position: 'fixed', bottom: 96, right: 18, zIndex: 60 }}>
      {/* Søgekort */}
      {open && (
        <div style={{
          position: 'fixed', bottom: 168, right: 18, width: 290,
          background: SoS.surface, borderRadius: 0,
          boxShadow: 'none', overflow: 'hidden',
          border: `1px solid ${SoS.line}`,
          zIndex: 60,
        }}>
          {/* Header */}
          <div style={{ padding: '10px 14px', borderBottom: `1px solid ${SoS.line}`, background: SoS.surfaceAlt }}>
            <span style={{ fontFamily: SoS.mono, fontSize: 10, fontWeight: 600, color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.8 }}>
              TELEFON
            </span>
          </div>
          {/* Input */}
          <div style={{ padding: '12px 14px 10px' }}>

              <Icon name="phone" size={15} color={SoS.inkMuted} />
              <input
                ref={inputRef}
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Tast nummer…  12 34 56 78"
                type="tel" inputMode="tel"
                style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontFamily: SoS.sans, fontSize: 15, color: SoS.ink, letterSpacing: 0.5 }}
              />
              {query && <button onClick={() => setQuery('')} style={{ background: 'none', border: 'none', cursor: 'pointer', color: SoS.inkMuted, fontSize: 18, padding: 0 }}>×</button>}
            </div>
          </div>
          {/* Resultat */}
          {match === false && (
            <div style={{ padding: '0 14px 14px' }}>
              <div style={{ background: SoS.creamDeep, borderRadius: 10, padding: '12px 14px', fontFamily: SoS.sans, fontSize: 13, color: SoS.inkMuted, textAlign: 'center' }}>
                Ingen menneske fundet med dette nummer
              </div>
            </div>
          )}
          {match && match !== false && (() => {
            const t = SoS_T[match.type] || SoS_T['social'] || { label: match.type, color: SoS.orange, soft: SoS.creamDeep, icon: 'heart' };
            return (
              <div style={{ padding: '0 14px 14px' }}>
                <div style={{ borderRadius: 0, border: `1px solid ${SoS.line}`, overflow: 'hidden' }}>
                  <div style={{ height: 3, background: t.color }} />
                  <div style={{ padding: '12px 14px 10px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                      <div style={{ width: 32, height: 32, borderRadius: 0, background: t.soft, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <Icon name={t.icon} size={18} color={t.color} />
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontFamily: SoS.sans, fontSize: 15, fontWeight: 700, color: SoS.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                          {match.firstName} {match.lastName}
                        </div>
                        <div style={{ fontFamily: SoS.sans, fontSize: 12, color: t.color, fontWeight: 600 }}>{t.label}</div>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10, alignItems: 'center' }}>
                      {match.status && <span style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600, color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.8 }}>{match.status}</span>}
                      {match.age    && <span style={{ fontFamily: SoS.mono, fontSize: 9, color: SoS.inkMuted }}>{match.age} ÅR</span>}
                    </div>
                    <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted, marginBottom: 10 }}>📞 {match.mobil}</div>
                    <button
                      onClick={() => { setOpen(false); onOpenMenneske?.(match.id); }}
                      style={{ width: '100%', padding: '10px 0', background: SoS.ink, color: '#fff', border: 'none', borderRadius: SoS.r.sm, fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
                    >
                      Åbn profil →
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}
          {!match && !query && (
            <div style={{ padding: '0 14px 14px' }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft, textAlign: 'center', lineHeight: 1.5 }}>
                Brug mens du er i et opkald —<br/>systemet slår op med det samme
              </div>
            </div>
          )}
        </div>
      )}
      {/* Knap */}
      <button
        onClick={() => setOpen(v => !v)}
        aria-label="Søg på telefonnummer"
        style={{ width: 54, height: 54, borderRadius: SoS.r.lg, background: open ? SoS.ink : SoS.accent,
          border: `1px solid ${open ? SoS.ink : SoS.accent}`, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          boxShadow: SoS.shadow.md, transition: 'background 0.15s' }}
      >
        <Icon name={open ? 'x' : 'phone'} size={22} color="#fff" />
      </button>
    </div>
  );
};

const AdminHome = ({ hovedsaede, tab, setTab, onSwitchRole, isAdmin = false, onOpenDesktop, onOpenMatching, onOpenIntake }) => {
  const [kontaktLog, setKontaktLog] = React.useState(false);
  const [showProfil, setShowProfil] = React.useState(false);
  const [showNotif, setShowNotif] = React.useState(false);
  const [matchVersion, forceMatchRefresh] = React.useReducer(n => n + 1, 0);
  const [matchTarget, setMatchTarget] = React.useState(null);

  const TITLES = {
    overview:    'God morgen, Linda',
    kalender:    'Kalender',
    brobyggere:  'Brobyggere',
    mennesker:   'Mennesker',
    matching:    'Matching',
  };
  const title = TITLES[tab] || 'Oversigt';

  return (
    <div style={{ position: 'absolute', inset: 0, background: SoS.paper, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, overflowY: 'auto', paddingBottom: 90 }}>
        <AdminTopBar
          title={title}
          hovedsaede={hovedsaede}
          isAdmin={isAdmin}
          initials="LS"
          onOpenProfil={() => setShowProfil(true)}
        />

        {tab === 'overview' && (
          <AdminOversigt
            hovedsaede={hovedsaede}
            onGoKalender={() => setTab('kalender')}
            onGoMatching={() => onOpenMatching ? onOpenMatching() : setTab('matching')}
          />
        )}
        {tab === 'kalender' && <AdminKalender hovedsaede={hovedsaede} onOpenMatching={onOpenMatching} />}
        {tab === 'brobyggere' && <AdminBrobyggereScreen hovedsaede={hovedsaede} onOpenMatching={onOpenMatching} />}
        {tab === 'mennesker' && <AdminMenneskerScreen />}
        {tab === 'matching' && (() => {
          const daysWaiting = (m) => {
            const reg = m.registeredAt || m.startedAt;
            if (!reg) return null;
            return Math.round((new Date() - new Date(reg)) / (1000*60*60*24));
          };
          const unmatched = Object.values(SoS_MENNESKER)
            .filter(m => (m.status === 'afventer' || m.status === 'venter') && matchVersion >= 0)
            .sort((a, b) => {
              const da = a.registeredAt || a.startedAt || '';
              const db = b.registeredAt || b.startedAt || '';
              return da.localeCompare(db); // ældste ventetid øverst
            });

          const handleMatch = (bb) => {
            if (SoS_MENNESKER[matchTarget.id]) {
              SoS_MENNESKER[matchTarget.id].status = 'aktiv';
            }
            const bbIdx = SoS_BROBYGGERE.findIndex(b => b.id === bb.id);
            if (bbIdx >= 0) {
              SoS_BROBYGGERE[bbIdx].active = (SoS_BROBYGGERE[bbIdx].active || 0) + 1;
              SoS_BROBYGGERE[bbIdx].pending = Math.max(0, (SoS_BROBYGGERE[bbIdx].pending || 0) - 1);
            }
            if (window.SoS_STORE) {
              window.SoS_STORE.save('mennesker', window.SoS_MENNESKER);
              window.SoS_STORE.save('brobyggere', window.SoS_BROBYGGERE);
            }
            setMatchTarget(null);
            forceMatchRefresh();
          };

          return (
            <div style={{ padding: '0 20px 90px' }}>
              {/* Header */}
              <div style={{ paddingTop: 4, marginBottom: 20 }}>
                <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                  color: SoS.accent, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>
                  AFVENTER MATCH
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 26, fontWeight: 700,
                  color: SoS.ink, letterSpacing: -0.5 }}>
                  {unmatched.length} {unmatched.length === 1 ? 'person' : 'personer'}
                </div>
              </div>

              {unmatched.length === 0 ? (
                <div style={{ padding: '36px 0', textAlign: 'center',
                  fontFamily: SoS.sans, fontSize: 14, color: SoS.inkMuted }}>
                  Ingen afventer match — godt arbejde ✓
                </div>
              ) : unmatched.map(m => {
                const t = SoS_TYPER[m.type] || {};
                return (
                  <div key={m.id} style={{ border: `1px solid ${SoS.line}`,
                    background: SoS.surface, marginBottom: 8, padding: '14px 16px' }}>
                    <div style={{ display: 'flex', alignItems: 'flex-start',
                      justifyContent: 'space-between', gap: 12 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                          <div style={{ fontFamily: SoS.sans, fontSize: 15, fontWeight: 700,
                            color: SoS.ink }}>
                            {m.firstName} {m.lastName}
                          </div>
                          <span style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600,
                            color: t.color || SoS.accent, textTransform: 'uppercase',
                            letterSpacing: 0.5 }}>{t.short || m.type}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                          <span style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted }}>
                            {m.age} år
                          </span>
                          {daysWaiting(m) !== null && (
                            <span style={{
                              padding: '1px 7px', borderRadius: SoS.r.sm,
                              background: daysWaiting(m) > 14 ? SoS.red + '15' : daysWaiting(m) > 7 ? SoS.amber + '20' : SoS.green + '15',
                              color: daysWaiting(m) > 14 ? SoS.red : daysWaiting(m) > 7 ? '#8A5A00' : SoS.green,
                              fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 700,
                            }}>
                              {daysWaiting(m) === 0 ? 'I dag' : `${daysWaiting(m)}d ventet`}
                            </span>
                          )}
                        </div>
                      </div>
                      <button onClick={() => setMatchTarget(m)} style={{
                        padding: '8px 14px', background: SoS.ink, color: '#fff',
                        border: 'none', borderRadius: SoS.r.sm,
                        fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
                        cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0 }}>
                        Match nu
                      </button>
                    </div>
                  </div>
                );
              })}

              {matchTarget && (
                <MatchModal
                  menneske={matchTarget}
                  onClose={() => setMatchTarget(null)}
                  onMatch={handleMatch}
                />
              )}
            </div>
          );
        })()}

        {/* Profil slide-up */}
        {showProfil && (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)',
            zIndex: 200, display: 'flex', alignItems: 'flex-end' }}
            onClick={() => setShowProfil(false)}>
            <div style={{ width: '100%', background: SoS.paper,
              borderTop: `1px solid ${SoS.line}`, padding: 22 }}
              onClick={e => e.stopPropagation()}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 20 }}>
                <div style={{ width: 48, height: 48, background: SoS.ink,
                  display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span style={{ fontFamily: SoS.mono, fontSize: 14, fontWeight: 700, color: '#fff' }}>LS</span>
                </div>
                <div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 16, fontWeight: 700, color: SoS.ink }}>
                    Linda Sorensen
                  </div>
                  <div style={{ fontFamily: SoS.mono, fontSize: 9.5, color: SoS.inkMuted,
                    textTransform: 'uppercase', letterSpacing: 0.8, marginTop: 2 }}>
                    RAADGIVER · {(hovedsaede || '').toUpperCase()}
                  </div>
                </div>
              </div>
              <button onClick={() => { setShowProfil(false); onSwitchRole?.(); }}
                style={{ width: '100%', padding: '13px 0', background: SoS.surface,
                  border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                  fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink,
                  cursor: 'pointer', marginBottom: 8 }}>
                Skift til brobygger-visning
              </button>
              {onOpenDesktop && (
                <button onClick={() => { setShowProfil(false); onOpenDesktop(); }}
                  style={{ width: '100%', padding: '13px 0', background: SoS.surface,
                    border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                    fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink,
                    cursor: 'pointer', marginBottom: 8 }}>
                  Åbn fuld portal (kun computer)
                </button>
              )}
              <button onClick={() => setShowProfil(false)}
                style={{ width: '100%', padding: '13px 0', background: 'none',
                  border: 'none', fontFamily: SoS.mono, fontSize: 10, color: SoS.inkMuted,
                  textTransform: 'uppercase', letterSpacing: 0.8, cursor: 'pointer' }}>
                LUK
              </button>
            </div>
          </div>
        )}
      </div>
      {kontaktLog && (
        <KontaktLogFlow
          onClose={() => setKontaktLog(false)}
          onSave={() => setKontaktLog(false)}
        />
      )}
      {/* ── Flydende telefon-søg ─────────────────────────────────────────── */}
      <TelefonSoegWidget onOpenMenneske={(id) => { setTab('mennesker'); window._openMenneskeId = id; }} />

      <AdminTabBar active={tab} onChange={setTab} />
    </div>
  );
};

window.AdminHome = AdminHome;
</script>

<!-- admin-mobile -->
<script type="text/babel">
// Simple MOBILE view for rådgivere/admins
// Mobile = kun det daglige arbejde. Data, statistik & rapporter kræver desktop.

// AdminMobileBeskeder: proper component to avoid hooks-in-IIFE violation
// ─── RaadgiverKalender ───────────────────────────────────────────────────────
const RaadgiverKalender = ({ viewingHq, typeFilter: tfProp, setTypeFilter: setTfProp }) => {
  const [selDay, setSelDay] = React.useState(2); // onsdag = i dag (mock)
  const [selectedAppt, setSelectedAppt] = React.useState(null);
  const [_localTf, _setLocalTf] = React.useState('alle');
  const typeFilter = tfProp !== undefined ? tfProp : _localTf;
  const setTypeFilter = setTfProp || _setLocalTf;
  const weekDays = ['Man','Tir','Ons','Tor','Fre','L\u00f8r','S\u00f8n'];
  const weekDates = [21,22,23,24,25,26,27];

  // Group all appointments by day-of-week index (0=Mon..6=Sun)
  const byDay = Array.from({length: 7}, () => []);
  SoS_APPOINTMENTS_BUSY.forEach(a => {
    const d = new Date(a.date);
    const dow = (d.getDay() + 6) % 7; // Mon=0
    if (dow < 7) byDay[dow].push(a);
  });

  const dayAppts = byDay[selDay] || [];
  const apptCounts = byDay.map(arr => arr.length);

  return (
    <>
    <div>
      {/* Header */}
      <div style={{ background: '#fff', borderBottom: '1px solid ' + SoS.lineSoft, padding: '54px 20px 14px' }}>
        <div style={{ fontFamily: SoS.font, fontSize: 24, fontWeight: 500, color: SoS.ink, marginBottom: 4 }}>
          Kalender
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 700, color: SoS.inkMuted,
          letterSpacing: 1, textTransform: 'uppercase', marginBottom: 14 }}>
          Uge 17 · {viewingHq}
        </div>

        {/* Week strip */}
        <div style={{ display: 'flex', gap: 4 }}>
          {weekDays.map((d, i) => {
            const count = apptCounts[i];
            const active = selDay === i;
            const isToday = i === 2;
            return (
              <button key={i} onClick={() => setSelDay(i)} style={{
                flex: 1, padding: '8px 2px 10px', borderRadius: SoS.r.md, border: 'none',
                cursor: 'pointer', textAlign: 'center',
                background: active ? SoS.ink : isToday ? SoS.orange + '12' : 'transparent',
              }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 700,
                  color: active ? 'rgba(255,255,255,0.7)' : SoS.inkMuted, marginBottom: 4 }}>{d}</div>
                <div style={{
                  width: 26, height: 26, borderRadius: 13, margin: '0 auto',
                  background: active ? 'rgba(255,255,255,0.15)' : isToday ? SoS.orange : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <span style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                    color: active ? '#fff' : isToday ? '#fff' : SoS.ink }}>{weekDates[i]}</span>
                </div>
                {count > 0 && (
                  <div style={{ marginTop: 4, display: 'flex', justifyContent: 'center', gap: 2 }}>
                    {Array.from({length: Math.min(count, 3)}).map((_, j) => (
                      <div key={j} style={{ width: 4, height: 4, borderRadius: 2,
                        background: active ? 'rgba(255,255,255,0.6)' : SoS.orange }}/>
                    ))}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      {/* Appointments list */}
      <div style={{ padding: '12px 20px 16px' }}>
        {dayAppts.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '48px 20px' }}>
            <div style={{ width: 52, height: 52, borderRadius: 26, background: SoS.creamDeep,
              display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px' }}>
              <Icon name="calendar" size={26} color={SoS.inkMuted}/>
            </div>
            <div style={{ fontFamily: SoS.font, fontSize: 18, fontWeight: 500,
              color: SoS.ink, marginBottom: 6 }}>Ingen brobygninger</div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft }}>
              Fri dag for {weekDays[selDay]}en
            </div>
          </div>
        ) : (
          <>
            <div style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 700,
              color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase',
              marginBottom: 10 }}>
              {dayAppts.length} brobygning{dayAppts.length !== 1 ? 'er' : ''}
            </div>
            {dayAppts.map(a => {
              const m = SoS_MENNESKER[a.menneskeId];
              const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
              const type = SoS_TYPER[m ? m.type : ''] || {};
              return (
                <div key={a.id} onClick={() => setSelectedAppt(a)} style={{
                  background: '#fff', borderRadius: SoS.r.lg,
                  border: '1px solid ' + SoS.lineSoft,
                  marginBottom: 10, overflow: 'hidden', cursor: 'pointer',
                }}>
                  {/* Color bar + time */}
                  <div style={{ display: 'flex', alignItems: 'stretch' }}>
                    <div style={{ width: 4, background: type.color || SoS.orange, flexShrink: 0 }}/>
                    <div style={{ flex: 1, padding: '12px 14px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                        <div>
                          <div style={{ fontFamily: SoS.font, fontSize: 18, fontWeight: 500,
                            color: SoS.ink, lineHeight: 1 }}>{a.start}</div>
                          <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft, marginTop: 2 }}>
                            {a.activity}
                          </div>
                        </div>
                        <span style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 700,
                          color: a.status === 'confirmed' ? SoS.sage : SoS.sun,
                          background: a.status === 'confirmed' ? SoS.sageSoft : SoS.sun + '22',
                          padding: '3px 8px', borderRadius: 999 }}>
                          {a.status === 'confirmed' ? 'Bekr\u00e6ftet' : 'Afventer'}
                        </span>
                      </div>
                      {/* Menneske + Brobygger row */}
                      <div style={{ display: 'flex', gap: 8 }}>
                        <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8,
                          background: (type.color || SoS.orange) + '10',
                          borderRadius: SoS.r.sm, padding: '6px 10px' }}>
                          <div style={{ width: 24, height: 24, borderRadius: 12,
                            background: type.color || SoS.orange,
                            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                            <span style={{ fontFamily: SoS.sans, fontSize: 8,
                              fontWeight: 700, color: '#fff' }}>{m ? m.initials : '?'}</span>
                          </div>
                          <div>
                            <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: SoS.ink }}>
                              {m ? m.firstName : 'Ukendt'}
                            </div>
                            <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkSoft }}>
                              {type.short || ''} · {m ? m.age : ''}
                            </div>
                          </div>
                        </div>
                        {bb && (
                          <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8,
                            background: SoS.creamDeep, borderRadius: SoS.r.sm, padding: '6px 10px' }}>
                            <div style={{ width: 24, height: 24, borderRadius: 12,
                              background: bb.bg,
                              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                              <span style={{ fontFamily: SoS.sans, fontSize: 8,
                                fontWeight: 700, color: '#fff' }}>{bb.avatar}</span>
                            </div>
                            <div>
                              <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: SoS.ink }}>
                                {bb.name.split(' ')[0]}
                              </div>
                              <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkSoft }}>Brobygger</div>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
    {selectedAppt && (
      <StaffApptDetail appt={selectedAppt} onClose={() => setSelectedAppt(null)}/>
    )}
    </>
  );
};

const AdminMobileBeskeder = ({ isAdmin, viewingHq }) => {
  const [composeOpen, setComposeOpen] = React.useState(false);
  const [threadId, setThreadId] = React.useState(null);
  const role = isAdmin ? 'admin' : 'raadgiver';
  return (
    <div style={{ position: 'relative', minHeight: 500 }}>
      {composeOpen && <ComposeMessage role={role} ownHq={viewingHq} onClose={() => setComposeOpen(false)}/>}
      {threadId
        ? <MessageThread threadId={threadId} onBack={() => setThreadId(null)} role={role}/>
        : <MessagesList onOpen={(id) => setThreadId(id)} role={role} ownHq={viewingHq} onCompose={() => setComposeOpen(true)}/>
      }
    </div>
  );
};

// AdminMenneskeListe: mennesker list with search + filter
const AdminMenneskeListe = ({ viewingHq, onOpenMatching, typeFilter: typeFProp }) => {
  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState('alle');
  const alle = Object.values(SoS_MENNESKER);
  const filtered = alle.filter(m => {
    const matchSearch = !search || (m.firstName + ' ' + (m.lastName || '')).toLowerCase().includes(search.toLowerCase());
    const matchFilter = filter === 'alle' || (filter === 'matchet' ? m.matchedWith : !m.matchedWith);
    const matchType = !typeFProp || typeFProp === 'alle' || m.type === typeFProp;
    return matchSearch && matchFilter && matchType;
  });
  return (
    <div>
      <div style={{ background: '#fff', borderBottom: '1px solid ' + SoS.lineSoft, padding: '54px 20px 14px' }}>
        <div style={{ fontFamily: SoS.font, fontSize: 24, fontWeight: 500, color: SoS.ink, marginBottom: 14 }}>
          Mennesker
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10,
          background: SoS.creamDeep, borderRadius: 999, padding: '10px 16px', marginBottom: 10 }}>
          <Icon name="search" size={18} color={SoS.inkMuted}/>
          <input placeholder="Sog menneske..." value={search} onChange={e => setSearch(e.target.value)}
            style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent',
              fontFamily: SoS.sans, fontSize: 14, color: SoS.ink }}/>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {[{id:'alle',label:'Alle (' + alle.length + ')'},{id:'matchet',label:'Matchet'},{id:'venter',label:'Venter'}].map(f => (
            <button key={f.id} onClick={() => setFilter(f.id)} style={{
              padding: '7px 14px', borderRadius: 999, flexShrink: 0,
              background: filter === f.id ? SoS.ink : '#fff',
              color: filter === f.id ? '#fff' : SoS.ink,
              border: filter === f.id ? 'none' : '1.5px solid ' + SoS.line,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, cursor: 'pointer',
            }}>{f.label}</button>
          ))}
        </div>
      </div>
      <div style={{ padding: '12px 20px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {filtered.length === 0 && (
          <div style={{ textAlign: 'center', padding: '40px 0', fontFamily: SoS.sans,
            fontSize: 14, color: SoS.inkSoft }}>Ingen mennesker matcher</div>
        )}
        {filtered.map(m => {
          const type = SoS_TYPER[m.type] || {};
          return (
            <div key={m.id} style={{
              display: 'flex', gap: 14, padding: 14, background: '#fff',
              borderRadius: SoS.r.md, border: '1px solid ' + SoS.lineSoft, cursor: 'pointer',
            }} onClick={onOpenMatching ? () => onOpenMatching() : undefined}>
              <div style={{ width: 46, height: 46, borderRadius: 23, background: (type.color || SoS.orange) + '22',
                flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name={type.icon || 'heart'} size={22} color={type.color || SoS.orange}/>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 600, color: SoS.ink }}>
                    {m.firstName}{m.lastName ? ' ' + m.lastName[0] + '.' : ''}
                  </div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted }}>{m.age} år</div>
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft, marginTop: 2 }}>
                  {type.label || m.type}
                </div>
                <div style={{ marginTop: 6 }}>
                  {m.matchedWith
                    ? <span style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 600,
                        color: SoS.sage, background: SoS.sageSoft, padding: '3px 10px', borderRadius: 999 }}>Matchet</span>
                    : <span style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 600,
                        color: SoS.orange, background: SoS.orange + '15', padding: '3px 10px', borderRadius: 999 }}>Venter pa match</span>
                  }
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// AdminMobileKalender: weekly calendar for admin/raadgiver
const AdminMobileKalender = ({ viewingHq }) => {
  const [selDay, setSelDay] = React.useState(2);
  const [selectedAppt, setSelectedAppt] = React.useState(null);
  const weekDays = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
  const weekDates = [21,22,23,24,25,26,27];

  // Group appointments by day-of-week index (0=Mon..6=Sun) — same logic as RaadgiverKalender
  const byDay = Array.from({length: 7}, () => []);
  SoS_APPOINTMENTS_BUSY.forEach(a => {
    const d = new Date(a.date);
    const dow = (d.getDay() + 6) % 7;
    if (dow < 7) byDay[dow].push(a);
  });
  const dayAppts = byDay[selDay] || [];
  const apptCounts = byDay.map(arr => arr.length);
  return (
    <>
    <div>
      <div style={{ background: '#fff', borderBottom: '1px solid ' + SoS.lineSoft, padding: '54px 20px 14px' }}>
        <div style={{ fontFamily: SoS.font, fontSize: 24, fontWeight: 500, color: SoS.ink, marginBottom: 6 }}>
          Kalender
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 700, color: SoS.inkMuted,
          letterSpacing: 1, textTransform: 'uppercase', marginBottom: 12 }}>Uge 17 · {viewingHq}</div>
        <div style={{ display: 'flex', gap: 4 }}>
          {weekDays.map((d, i) => {
            const count = apptCounts[i];
            const active = selDay === i;
            const isToday = i === 2;
            return (
              <button key={i} onClick={() => setSelDay(i)} style={{
                flex: 1, padding: '8px 2px 10px', borderRadius: SoS.r.sm, border: 'none', cursor: 'pointer',
                background: active ? SoS.ink : isToday ? SoS.orange + '12' : 'transparent',
                textAlign: 'center',
              }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 700,
                  color: active ? 'rgba(255,255,255,0.7)' : SoS.inkMuted, marginBottom: 4 }}>{d}</div>
                <div style={{ width: 26, height: 26, borderRadius: 13, margin: '0 auto',
                  background: active ? 'rgba(255,255,255,0.15)' : isToday ? SoS.orange : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <span style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                    color: active ? '#fff' : isToday ? '#fff' : SoS.ink }}>{weekDates[i]}</span>
                </div>
                {count > 0 && (
                  <div style={{ marginTop: 4, display: 'flex', justifyContent: 'center', gap: 2 }}>
                    {Array.from({length: Math.min(count, 3)}).map((_, j) => (
                      <div key={j} style={{ width: 4, height: 4, borderRadius: 2,
                        background: active ? 'rgba(255,255,255,0.6)' : SoS.orange }}/>
                    ))}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{ padding: '12px 20px 16px' }}>
        {dayAppts.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '48px 20px' }}>
            <div style={{ width: 52, height: 52, borderRadius: 26, background: SoS.creamDeep,
              display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px' }}>
              <Icon name="calendar" size={26} color={SoS.inkMuted}/>
            </div>
            <div style={{ fontFamily: SoS.font, fontSize: 18, fontWeight: 500, color: SoS.ink, marginBottom: 6 }}>
              Ingen brobygninger</div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft }}>
              Fri dag for {weekDays[selDay]}en</div>
          </div>
        ) : dayAppts.map(a => {
          const m = SoS_MENNESKER[a.menneskeId];
          const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
          const type = SoS_TYPER[m ? m.type : ''] || {};
          return (
            <div key={a.id} onClick={() => setSelectedAppt(a)} style={{ display: 'flex', gap: 12, alignItems: 'center', padding: 14,
              background: '#fff', borderRadius: SoS.r.md, border: '1px solid ' + SoS.lineSoft, marginBottom: 8, cursor: 'pointer' }}>
              <div style={{ width: 4, height: 44, borderRadius: 2, background: type.color || SoS.orange, flexShrink: 0 }}/>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'baseline' }}>
                  <span style={{ fontFamily: SoS.font, fontSize: 16, fontWeight: 500, color: SoS.ink }}>{a.start}</span>
                  <span style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>· {a.activity}</span>
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft, marginTop: 2 }}>
                  {m ? m.firstName : 'Ukendt'}{bb ? ' · ' + bb.name.split(' ')[0] : ''}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
    {selectedAppt && (
      <StaffApptDetail appt={selectedAppt} onClose={() => setSelectedAppt(null)}/>
    )}
    </>
  );
};


const MatchModal = ({ menneske, onClose, onMatch }) => {
  const [selected, setSelected] = React.useState(null);
  const t = SoS_TYPER[menneske.type] || {};
  const available = SoS_BROBYGGERE
    .filter(b => b.status === 'aktiv' || b.status === 'ny')
    .sort((a, b) => (a.active || 0) - (b.active || 0));
  const selBb = available.find(b => b.id === selected);
  return (
    <div onClick={e => e.target === e.currentTarget && onClose()}
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)',
        zIndex: 300, display: 'flex', alignItems: 'flex-end' }}>
      <div onClick={e => e.stopPropagation()} style={{ width: '100%', background: SoS.paper,
        borderTop: `2px solid ${SoS.accent}`, maxHeight: '82vh', overflowY: 'auto',
        padding: '20px 20px 36px' }}>
        {/* Header */}
        <div style={{ display: 'flex', justifyContent: 'space-between',
          alignItems: 'flex-start', marginBottom: 18 }}>
          <div>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.accent, textTransform: 'uppercase', letterSpacing: 1 }}>MATCH MENNESKE</div>
            <div style={{ fontFamily: SoS.sans, fontSize: 22, fontWeight: 700,
              color: SoS.ink, letterSpacing: -0.5, marginTop: 3 }}>
              {menneske.firstName} {menneske.lastName}
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted, marginTop: 2 }}>
              {menneske.age} år ·{' '}
              <span style={{ color: t.color, fontWeight: 600 }}>{t.short || menneske.type}</span>
            </div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none',
            cursor: 'pointer', fontSize: 22, color: SoS.inkMuted, lineHeight: 1 }}>×</button>
        </div>

        {/* Brobyggere */}
        <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600, color: SoS.inkMuted,
          textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 10 }}>
          VÆLG BROBYGGER — {available.length} tilgængelige
        </div>
        {available.map(bb => (
          <div key={bb.id} onClick={() => setSelected(bb.id)} style={{
            border: `1px solid ${selected === bb.id ? SoS.accent : SoS.line}`,
            borderLeft: `3px solid ${selected === bb.id ? SoS.accent : SoS.line}`,
            background: selected === bb.id ? SoS.accent + '08' : SoS.surface,
            padding: '10px 12px', marginBottom: 6, cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: 12,
            transition: 'border-color 0.1s',
          }}>
            <div style={{ width: 32, height: 32, borderRadius: 0, background: bb.bg, flexShrink: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: SoS.mono, fontSize: 11, fontWeight: 700, color: '#fff' }}>
              {bb.avatar}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink }}>
                {bb.name}
              </div>
              <div style={{ fontFamily: SoS.mono, fontSize: 9, color: SoS.inkMuted, marginTop: 2 }}>
                {bb.active || 0} AKTIVE · {bb.thisWeek || 0} DENNE UGE
                {bb.pauseUntil ? ' · PÅ PAUSE' : ''}
              </div>
            </div>
            {selected === bb.id && (
              <div style={{ width: 20, height: 20, background: SoS.accent, flexShrink: 0,
                display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="check" size={11} color="#fff" weight={2.5}/>
              </div>
            )}
          </div>
        ))}

        {/* Confirm */}
        <button disabled={!selected} onClick={() => selBb && onMatch(selBb)}
          style={{ width: '100%', padding: '14px 0', marginTop: 18,
            background: selected ? SoS.ink : SoS.line, color: '#fff',
            border: 'none', borderRadius: SoS.r.sm, fontFamily: SoS.sans,
            fontSize: 14, fontWeight: 700, cursor: selected ? 'pointer' : 'default',
            transition: 'background 0.15s' }}>
          {selBb ? `Match med ${selBb.name.split(' ')[0]}` : 'Vælg en brobygger'}
        </button>
      </div>
    </div>
  );
};

const AdminMobile = ({ user, viewingHq, ownHq, isAdmin, onOpenSettings, onOpenIntake, onOpenMatching, onOpenMessages, onOpenDesktop }) => {
  const [tab, setTab] = React.useState('oversigt');
  const [selectedBb, setSelectedBb] = React.useState(null);
  const [selectedAppt, setSelectedAppt] = React.useState(null);
  const [showProfil, setShowProfil] = React.useState(false);
  const [showNotif, setShowNotif] = React.useState(false);
  const [matchVersion, forceMatchRefresh] = React.useReducer(n => n + 1, 0);
  const [matchTarget, setMatchTarget] = React.useState(null);
  const [typeFilter, setTypeFilter] = React.useState('alle');
  const pendingMatches = SoS_BROBYGGERE.filter(b => b.pending > 0).length;
  const isTemporary = viewingHq !== ownHq;

  const byDay = Array.from({length: 7}, () => []);
  SoS_APPOINTMENTS_BUSY.forEach(a => {
    const d = new Date(a.date);
    const dow = (d.getDay() + 6) % 7;
    if (dow < 7) byDay[dow].push(a);
  });
  const todayAppts = byDay[2] || [];
  const nesteAftale = todayAppts[0] || null;
  const afventerCount = todayAppts.filter(
    a => a.status !== 'confirmed' && a.status !== 'bekraeftet').length;
  const TYPE_C = { sundhed: SoS.sundhed, forening: SoS.forening, social: SoS.social };

  const now = new Date('2026-05-29');
  const weekNum = (() => {
    const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - ys) / 86400000) + 1) / 7);
  })();
  const dayStr = now.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
  const initials = ((user.avatar || '') || (user.firstName[0] + (user.lastName ? user.lastName[0] : ''))).toUpperCase().slice(0,2);
  const TAB_TITLES = {
    oversigt:   'God morgen, ' + user.firstName,
    kalender:   'Kalender',
    mennesker:  'Mennesker',
    brobyggere: 'Brobyggere',
    matching:   'Matching',
  };
  const title = TAB_TITLES[tab] || 'Oversigt';

  return (
    <div style={{ position: 'absolute', inset: 0, background: SoS.paper, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, overflowY: 'auto', paddingBottom: 90 }}>

        {/* v2 Header */}
        <div style={{
          position: 'sticky', top: 0, background: SoS.paper, zIndex: 20,
          padding: '52px 22px 14px', borderBottom: `1px solid ${SoS.line}`,
        }}>
          {/* top row: eyebrow + icons */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.accent, textTransform: 'uppercase', letterSpacing: 1 }}>
              {isAdmin ? 'ADMIN — SOCIAL SUNDHED' : `RAADGIVER — ${viewingHq.toUpperCase()}`}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <button style={{ width: 34, height: 34, borderRadius: SoS.r.sm,
                background: SoS.surface, border: `1px solid ${SoS.line}`,
                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
                position: 'relative' }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke={SoS.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <div style={{ position: 'absolute', top: 5, right: 5,
                  width: 7, height: 7, background: SoS.accent, borderRadius: 0,
                  border: `1px solid ${SoS.paper}` }}/>
              </button>
              <button onClick={() => setShowProfil(true)} style={{
                width: 34, height: 34, borderRadius: SoS.r.sm,
                background: SoS.ink, border: 'none',
                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ fontFamily: SoS.mono, fontSize: 10, fontWeight: 700,
                  color: '#fff', letterSpacing: 0.5 }}>{initials}</span>
              </button>
            </div>
          </div>
          {/* title + week */}
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
            <div style={{ fontFamily: SoS.sans, fontSize: 26, fontWeight: 700,
              color: SoS.ink, letterSpacing: -1, lineHeight: 1, maxWidth: '68%' }}>
              {title}
            </div>
            <div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: SoS.mono, fontSize: 11, fontWeight: 700, color: SoS.ink }}>UGE {weekNum}</div>
              <div style={{ fontFamily: SoS.mono, fontSize: 10, color: SoS.inkMuted }}>{dayStr.toUpperCase()}</div>
            </div>
          </div>
        </div>

        {/* ── Notification panel ─────────────────────────────────────────── */}
        {showNotif && (
          <>
            <div onClick={() => setShowNotif(false)}
              style={{ position: 'fixed', inset: 0, zIndex: 18 }}/>
            <div style={{ position: 'sticky', top: 80, zIndex: 19,
              background: SoS.surface, borderBottom: `2px solid ${SoS.accent}`,
              padding: '14px 20px 6px', boxShadow: '0 4px 20px rgba(0,0,0,0.09)' }}>
              <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                color: SoS.accent, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
                NOTIFIKATIONER
              </div>
              {SoS_APPOINTMENTS_BUSY.filter(a => a.status === 'pending').length === 0 &&
               Object.values(SoS_MENNESKER).filter(m => m.status === 'afventer' || m.status === 'venter').length === 0 && (
                <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkMuted, paddingBottom: 14 }}>
                  Alt er ajour — ingen afventende ting ✓
                </div>
              )}
              {SoS_APPOINTMENTS_BUSY.filter(a => a.status === 'pending').slice(0, 5).map(a => {
                const m  = SoS_MENNESKER[a.menneskeId];
                const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
                return (
                  <div key={a.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10,
                    padding: '9px 0', borderBottom: `1px solid ${SoS.line}` }}>
                    <div style={{ width: 26, height: 26, background: SoS.amber + '18', flexShrink: 0,
                      border: `1px solid ${SoS.amber}33`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Icon name="calendar" size={13} color={SoS.amber}/>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink }}>
                        Aftale afventer bekræftelse
                      </div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, marginTop: 1 }}>
                        {a.activity} · {a.date} {a.start}
                        {m  ? ` · ${m.firstName} ${m.lastName}` : ''}
                        {bb ? ` · ${bb.name.split(' ')[0]}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
              {Object.values(SoS_MENNESKER)
                .filter(m => m.status === 'afventer' || m.status === 'venter')
                .slice(0, 5).map(m => {
                const t = SoS_TYPER[m.type] || {};
                return (
                  <div key={m.id}
                    onClick={() => { setMatchTarget(m); setShowNotif(false); setTab('matching'); }}
                    style={{ display: 'flex', alignItems: 'flex-start', gap: 10,
                      padding: '9px 0', borderBottom: `1px solid ${SoS.line}`, cursor: 'pointer' }}>
                    <div style={{ width: 26, height: 26, background: SoS.accent + '15', flexShrink: 0,
                      border: `1px solid ${SoS.accent}30`,
                      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Icon name="heart" size={13} color={SoS.accent}/>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink }}>
                        {m.firstName} {m.lastName} venter på match
                      </div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, marginTop: 1 }}>
                        {m.age} år · {t.short || m.type}
                      </div>
                    </div>
                    <div style={{ fontFamily: SoS.mono, fontSize: 9, color: SoS.accent,
                      textTransform: 'uppercase', letterSpacing: 0.5, alignSelf: 'center' }}>
                      Match →
                    </div>
                  </div>
                );
              })}
              <div style={{ height: 10 }}/>
            </div>
          </>
        )}


        {tab === 'oversigt' && (
          <>
            {/* I dag-kort */}
            <button onClick={() => setTab('kalender')} style={{
              margin: '16px 22px 0', width: 'calc(100% - 44px)',
              border: `1px solid ${SoS.line}`, background: SoS.surface,
              textAlign: 'left', cursor: 'pointer', padding: 0,
            }}>
              <div style={{ padding: '10px 14px', borderBottom: `1px solid ${SoS.line}`,
                display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 6, height: 6, background: SoS.accent }}/>
                  <span style={{ fontFamily: SoS.mono, fontSize: 10, fontWeight: 600,
                    color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.8 }}>I DAG</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontFamily: SoS.mono, fontSize: 10, color: SoS.ink, fontWeight: 700 }}>
