<!-- persistence -->
<script>
// ── SoS_STORE — localStorage persistence ────────────────────────────────────
// PROTOTYPE ONLY — skal fjernes og erstattes af API-kald inden go-live.
// Nøgler: sos_mennesker · sos_brobyggere · sos_appointments
//         sos_medarbejdere · sos_settings
(function () {
  const P = 'sos_';
  const save = (key, data) => {
    try { localStorage.setItem(P + key, JSON.stringify(data)); } catch(e) {}
  };
  const load = (key) => {
    try { const r = localStorage.getItem(P + key); return r ? JSON.parse(r) : null; }
    catch(e) { return null; }
  };
  const clear = () => {
    Object.keys(localStorage).filter(k => k.startsWith(P)).forEach(k => localStorage.removeItem(k));
  };

  // Overskriver in-memory globals med persisterede data ved opstart
  const hydrate = () => {
    const m  = load('mennesker');    if (m)  window.SoS_MENNESKER       = m;
    const b  = load('brobyggere');   if (b)  window.SoS_BROBYGGERE       = b;
    const a  = load('appointments'); if (a)  window.SoS_APPOINTMENTS_BUSY = a;
    const me = load('medarbejdere'); if (me) window.SoS_MEDARBEJDERE      = me;
    const s  = load('settings');
    if (s) {
      if (s.sroi)        window.SROI_SETTINGS     = s.sroi;
      if (s.matchFrist)  window.MATCH_FRIST_TIMER = s.matchFrist;
      if (s.activeTypes) window.HQ_ACTIVE_TYPES   = s.activeTypes;
    }
  };

  window.SoS_STORE = { save, load, clear, hydrate };
  hydrate();
})();

// ── SoS_DEMO — URL-parameter persona (multi-user demo) ──────────────────────
// Brug: ?rolle=brobygger&navn=Maja  eller  ?rolle=raadgiver&navn=Linda
// Cross-device chat: tilføj &gist=GIST_ID&token=GITHUB_PAT
(function () {
  const p = new URLSearchParams(window.location.search);
  const rolle  = p.get('rolle');   // 'brobygger' | 'raadgiver'
  const navn   = p.get('navn');    // visningsnavn, fx 'Maja'
  const gistId = p.get('gist');    // GitHub Gist ID (valgfri)
  const token  = p.get('token');   // GitHub PAT (valgfri, kræves for Gist-skrivning)
  window.SoS_DEMO = { rolle, navn, gistId, token, active: !!rolle };
  // Anmod om notifikations-tilladelse når der er en URL-rolle
  if (rolle && 'Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
})();
</script>

<!-- charts -->
<script type="text/babel">
// Admin — ansat mobile view with rich data

// Small bar chart component
const MiniBars = ({ data, color = SoS.orange, height = 60, labels = true }) => {
  const max = Math.max(...data.map(d => d.v));
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column',
          alignItems: 'center', gap: 4 }}>
          <div style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 600, color: SoS.ink }}>
            {d.v}
          </div>
          <div style={{
            width: '100%', borderRadius: 4,
            background: color, opacity: 0.4 + (d.v / max) * 0.6,
            height: `${(d.v / max) * (height - 20)}px`,
            minHeight: 2,
          }} />
          {labels && <div style={{ fontFamily: SoS.sans, fontSize: 9,
            color: SoS.inkMuted }}>{d.l}</div>}
        </div>
      ))}
    </div>
  );
};

// Donut — distribution across 3 types
const TypeDonut = ({ sundhed, forening, social, size = 140 }) => {
  const total = sundhed + forening + social;
  const r = size / 2 - 14;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const segs = [
    { v: sundhed, color: SoS_TYPER.sundhed.color },
    { v: forening, color: SoS_TYPER.forening.color },
    { v: social, color: SoS_TYPER.social.color },
  ];
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        {segs.map((s, i) => {
          const len = (s.v / total) * c;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
              stroke={s.color} strokeWidth={14}
              strokeDasharray={`${len} ${c - len}`}
              strokeDashoffset={-offset}
              strokeLinecap="butt" />
          );
          offset += len;
          return el;
        })}
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex',
        flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ fontFamily: SoS.font, fontSize: 28, fontWeight: 500, color: SoS.ink, lineHeight: 1 }}>
          {total}
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft,
          marginTop: 4, textAlign: 'center' }}>mennesker<br/>i alt</div>
      </div>
    </div>
  );
};

// Area chart (simple sparkline)
const AreaChart = ({ data, color = SoS.orange, height = 80, fill = true }) => {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const w = 300;
  const pts = data.map((v, i) => [i / (data.length - 1) * w, height - ((v - min) / range) * (height - 10) - 5]);
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');
  const area = path + ` L${w},${height} L0,${height} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} style={{ width: '100%', height, display: 'block' }} preserveAspectRatio="none">
      {fill && <path d={area} fill={color} fillOpacity="0.12" />}
      <path d={path} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p, i) => i === pts.length - 1 && (
        <circle key={i} cx={p[0]} cy={p[1]} r="4" fill={color} stroke="#fff" strokeWidth="2" />
      ))}
    </svg>
  );
};

// Stacked horizontal bar
const StackedBar = ({ segments, height = 10 }) => {
  const total = segments.reduce((s, x) => s + x.v, 0);
  return (
    <div style={{ display: 'flex', width: '100%', height, borderRadius: height/2, overflow: 'hidden' }}>
      {segments.map((s, i) => (
        <div key={i} style={{ width: `${(s.v/total)*100}%`, background: s.color }} />
      ))}
    </div>
  );
};

// Big KPI card
const KPI = ({ label, value, delta, color = SoS.orange, sparkData, subtitle }) => (
  <div style={{
    background: '#fff', borderRadius: SoS.r.lg, padding: 16,
    border: `1px solid ${SoS.lineSoft}`,
  }}>
    <div style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 600,
      color: SoS.inkSoft, letterSpacing: 0.5, textTransform: 'uppercase',
      marginBottom: 6 }}>{label}</div>
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: subtitle || sparkData ? 4 : 0 }}>
      <div style={{ fontFamily: SoS.font, fontSize: 30, fontWeight: 500, color: SoS.ink, lineHeight: 1 }}>
        {value}
      </div>
      {delta && (
        <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
          color: delta.startsWith('+') ? SoS.sage : SoS.rose }}>
          {delta}
        </div>
      )}
    </div>
    {subtitle && <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>{subtitle}</div>}
    {sparkData && <div style={{ marginTop: 8 }}><AreaChart data={sparkData} color={color} height={40}/></div>}
  </div>
);

Object.assign(window, { MiniBars, TypeDonut, AreaChart, StackedBar, KPI });
</script>

<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',

      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>

          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{

          </svg>

        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>

    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',

        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,

      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>

      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>

}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});
</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

<script type="text/babel">
// Hjem / dashboard — brobygger view

const formatDate = (iso, opts = {}) => {
  const d = new Date(iso);
  const days = ['søn','man','tirs','ons','tors','fre','lør'];
  const months = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  if (opts.long) return `${days[d.getDay()]}dag ${d.getDate()}. ${months[d.getMonth()]}`;
  if (opts.short) return `${d.getDate()}. ${months[d.getMonth()]}`;
  return `${days[d.getDay()]}. ${d.getDate()}. ${months[d.getMonth()]}`;
};

const isToday = (iso) => {
  const d = new Date(iso); const t = new Date('2026-04-24');
  return d.toDateString() === t.toDateString();
};
const isTomorrow = (iso) => {
  const d = new Date(iso); const t = new Date('2026-04-25');
  return d.toDateString() === t.toDateString();
};

// Next-up hero card — the most prominent element on the home screen
const BrobyggerLogModal = ({ aftale, onClose, onSave }) => {
  const [step,    setStep]    = React.useState(0); // 0=udfald, 1=detaljer
  const [udfald,  setUdfald]  = React.useState(null);
  const [varighed, setVarighed] = React.useState(null);
  const [note,    setNote]    = React.useState('');
  const menneske = SoS_MENNESKER[aftale.menneskeId];

  const UDFALD = [
    { id: 'gennemfoert', label: 'Gennemfaert',   emoji: '✓', color: SoS.green,
      desc: 'Vi mødtes og gennemfaerte aftalen' },
    { id: 'afbud',       label: 'Afbud',          emoji: '~', color: SoS.amber,
      desc: 'Afbud i tide — ny aftale planlagt' },
    { id: 'ikke-modt',  label: 'Mødte ikke op',  emoji: '✗', color: SoS.red,
      desc: 'Ingen kontakt, mødte ikke op' },
  ];

  const VARIGHEDER = [
    { v: 30,  label: '30 min' },
    { v: 60,  label: '1 time' },
    { v: 90,  label: '1½ time' },
    { v: 120, label: '2 timer' },
    { v: 150, label: '2½ time' },
  ];

  const save = () => {
    const log = { udfald, varighed: udfald === 'gennemfoert' ? varighed : 0,
      note: note.trim(), loggedAt: new Date().toISOString() };
    // Gem på aftalen
    const newList = (window.SoS_APPOINTMENTS_BUSY || []).map(a =>
      a.id === aftale.id
        ? { ...a, brobyggerLog: log, raadgiverOpfoelgning: null }
        : a
    );
    window.SoS_APPOINTMENTS_BUSY = newList;
    if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
    // Gem i kontaktlog
    const kontaktType = udfald === 'gennemfoert' ? 'folge-primaer' : 'notat';
    const k = {
      id: 'k-' + Date.now(),
      menneskeId: aftale.menneskeId,
      type: kontaktType,
      dato: aftale.date,
      status: udfald === 'gennemfoert' ? 'gennemfoert'
              : udfald === 'afbud' ? 'aflyst' : 'udeblev',
      note: note.trim() || UDFALD.find(u => u.id === udfald)?.desc || '',
      varighed: udfald === 'gennemfoert' ? varighed : null,
      registreretDen: new Date().toISOString(),
    };
    window.SoS_KONTAKTER = [...(window.SoS_KONTAKTER || []), k];
    if (window.SoS_STORE) window.SoS_STORE.save('kontakter', window.SoS_KONTAKTER);
    onSave(newList);
    onClose();
  };

  const canSave = udfald && (udfald !== 'gennemfoert' || varighed);

  return (
    <div style={{ position: 'fixed', inset: 0, background: SoS.paper,
      zIndex: 500, display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ padding: '54px 20px 16px', background: SoS.surface,
        borderBottom: `1px solid ${SoS.line}`, flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: 18,
            background: SoS.surfaceAlt, border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Icon name="chevronL" size={18} color={SoS.ink} weight={2.2}/>
          </button>
          <div>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 1 }}>
              Registrér aftale
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 18, fontWeight: 700,
              color: SoS.ink, marginTop: 2 }}>
              {aftale.activity}
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted, marginTop: 1 }}>
              {aftale.date} · {aftale.start}–{aftale.end}
              {menneske ? ` · ${menneske.firstName}` : ''}
            </div>
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '24px 20px 120px' }}>

        {/* Udfald */}
        <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
          color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>
          Hvad skete der?
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 28 }}>
          {UDFALD.map(u => (
            <button key={u.id} onClick={() => { setUdfald(u.id); if (u.id !== 'gennemfoert') setVarighed(null); }}
              style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '16px 18px',
                background: udfald === u.id ? u.color + '12' : SoS.surface,
                border: `2px solid ${udfald === u.id ? u.color : SoS.line}`,
                borderRadius: SoS.r.sm, cursor: 'pointer', textAlign: 'left', width: '100%' }}>
              <div style={{ width: 40, height: 40, borderRadius: SoS.r.sm,
                background: udfald === u.id ? u.color : SoS.surfaceAlt,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                flexShrink: 0, fontFamily: SoS.mono, fontSize: 16,
                color: udfald === u.id ? '#fff' : SoS.inkMuted }}>
                {u.emoji}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 15, fontWeight: 700,
                  color: udfald === u.id ? u.color : SoS.ink }}>{u.label}</div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12,
                  color: SoS.inkMuted, marginTop: 2 }}>{u.desc}</div>
              </div>
              {udfald === u.id && <Icon name="check" size={18} color={u.color}/>}
            </button>
          ))}
        </div>

        {/* Varighed — kun ved gennemfaert */}
        {udfald === 'gennemfoert' && (
          <>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>
              Omtrentlig varighed
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 28 }}>
              {VARIGHEDER.map(v => (
                <button key={v.v} onClick={() => setVarighed(v.v)} style={{
                  padding: '10px 18px', borderRadius: SoS.r.sm, cursor: 'pointer',
                  background: varighed === v.v ? SoS.ink : SoS.surface,
                  color: varighed === v.v ? '#fff' : SoS.ink,
                  border: `2px solid ${varighed === v.v ? SoS.ink : SoS.line}`,
                  fontFamily: SoS.sans, fontSize: 14, fontWeight: 600 }}>
                  {v.label}
                </button>
              ))}
            </div>
          </>
        )}

        {/* Note — valgfrit, én linje */}
        {udfald && (
          <>
            <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
              color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>
              Kort note <span style={{ fontWeight: 400, textTransform: 'none',
                letterSpacing: 0 }}>(valgfrit)</span>
            </div>
            <input
              value={note} onChange={e => setNote(e.target.value)}
              maxLength={120}
              placeholder={
                udfald === 'gennemfoert' ? 'Fx: Gik godt, kortere tur end planlagt' :
                udfald === 'afbud' ? 'Fx: Ny aftale aftalt til næste uge' :
                'Fx: Forsøgte at ringe — intet svar'
              }
              style={{ width: '100%', padding: '13px 14px',
                border: `1.5px solid ${SoS.line}`, background: SoS.surface,
                fontFamily: SoS.sans, fontSize: 14, color: SoS.ink,
                outline: 'none', boxSizing: 'border-box', borderRadius: SoS.r.sm }}/>
            <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkMuted,
              textAlign: 'right', marginTop: 4 }}>{note.length}/120</div>
          </>
        )}
      </div>

      {/* Footer */}
      <div style={{ padding: '16px 20px 36px', borderTop: `1px solid ${SoS.line}`,
        background: SoS.surface, flexShrink: 0 }}>
        <button onClick={save} disabled={!canSave} style={{
          width: '100%', padding: '16px 0',
          background: canSave ? SoS.ink : SoS.line,
          color: '#fff', border: 'none', borderRadius: SoS.r.sm,
          fontFamily: SoS.sans, fontSize: 15, fontWeight: 700,
          cursor: canSave ? 'pointer' : 'not-allowed' }}>
          Gem registrering
        </button>
      </div>
    </div>
  );
};


const NextAppointment = ({ appt, onOpen }) => {
  if (!appt) return null;
  const menneske = SoS_MENNESKER[appt.menneskeId];
  const type = SoS_TYPER[menneske.type];
  const when = isToday(appt.date) ? 'I dag' : isTomorrow(appt.date) ? 'I morgen' : formatDate(appt.date, { long: true });

  return (
    <div onClick={onOpen} style={{

        <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>

};

// Empty state for next appointment
