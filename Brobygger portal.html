      address:      '', meetPoint: '', language: 'Dansk',
      notes:        [],
      hq:           viewingHq || 'Aarhus',
      registeredAt: new Date().toISOString(),
      createdAt:    new Date().toISOString().split('T')[0],
      initials:     (form.firstName.trim()[0] || '') + (form.lastName.trim()[0] || ''),
      praeferencer:  { tidspunkt: tidspraef, frekvens },
      koen:          koen || null,
      postnummer:    postnummer.trim() || null,
      contact:       { name: '', role: 'Koordinator', phone: '' },
      kontaktperson: kpType ? { type: kpType, navn: kpNavn.trim(), tlf: kpTlf.trim() } : null,
      mobilOptOut:   false,
      email:         null,
      consentAt:     new Date().toISOString(),
      brobyggerId:   null,
      behovUrgency:  behovUrgency || null,
    };
    const updated = { ...(window.SoS_MENNESKER || {}), [id]: newPerson };
    window.SoS_MENNESKER = updated;
    window.SoS_STORE.save('mennesker', updated);
    setDone(true);
  };

  const inputStyle = {
    width: '100%', padding: '12px 14px',
    fontFamily: SoS.sans, fontSize: 15, color: SoS.ink,
    background: '#fff', border: `1.5px solid ${SoS.line}`,
    borderRadius: SoS.r.md, outline: 'none',
    boxSizing: 'border-box',
  };

  if (done) {
    return (
      <div style={{
        position: 'fixed', inset: 0, background: SoS.paper,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        padding: 32, zIndex: 300,
      }}>
        <div style={{
          width: 72, height: 72, borderRadius: 36,
          background: SoS.sage, display: 'flex',
          alignItems: 'center', justifyContent: 'center', marginBottom: 24,
        }}>
          <Icon name="check" size={32} color="#fff" weight={2.5}/>
        </div>
        <div style={{ fontFamily: SoS.font, fontSize: 28, fontWeight: 500,
          color: SoS.ink, textAlign: 'center', letterSpacing: -0.3, marginBottom: 8 }}>
          {form.firstName} er registreret
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 14, color: SoS.inkSoft,
          textAlign: 'center', lineHeight: 1.6, maxWidth: 280, marginBottom: 32 }}>
          Oplysningerne er gemt. Du kan nu starte et match, eller vende tilbage til oversigten.
        </div>
        <button onClick={onClose} style={{
          width: '100%', maxWidth: 280, padding: '15px 0',
          background: SoS.ink, color: '#fff', border: 'none',
          borderRadius: SoS.r.md, fontFamily: SoS.sans, fontSize: 15,
          fontWeight: 600, cursor: 'pointer', marginBottom: 12,
        }}>
          Start matching
        </button>
        <button onClick={onClose} style={{
          width: '100%', maxWidth: 280, padding: '13px 0',
          background: 'transparent', color: SoS.inkSoft,
          border: `1px solid ${SoS.line}`, borderRadius: SoS.r.md,
          fontFamily: SoS.sans, fontSize: 14, cursor: 'pointer',
        }}>
          Tilbage til oversigt
        </button>
      </div>
    );
  }

  return (
    <div style={{
      position: 'fixed', inset: 0, background: SoS.paper,
      display: 'flex', flexDirection: 'column', zIndex: 300,
    }}>
      {/* Header */}
      <div style={{
        background: '#fff', padding: '54px 20px 16px',
        borderBottom: `1px solid ${SoS.line}`, flexShrink: 0,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <button onClick={onClose} style={{
            width: 36, height: 36, borderRadius: 18, border: 'none',
            background: SoS.surface, cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name="close" size={16} color={SoS.ink}/>
          </button>
          <div style={{ fontFamily: SoS.font, fontSize: 20, fontWeight: 500,
            color: SoS.ink, letterSpacing: -0.2 }}>
            Registrer menneske
          </div>
          <button onClick={onClose} style={{
            marginLeft: 'auto', background: 'none', border: 'none',
            fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
            color: SoS.inkSoft, cursor: 'pointer', padding: '6px 4px',
          }}>Annuller</button>
        </div>
        {/* Step bar */}
        <div style={{ display: 'flex', gap: 6 }}>
          {STEPS.map((s, i) => (
            <div key={s} style={{
              flex: i === step ? 2 : 1, height: 4, borderRadius: 2,
              background: i < step ? SoS.sage : i === step ? SoS.orange : SoS.line,
              transition: 'all 0.3s',
            }}/>
          ))}
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted,
          marginTop: 6, letterSpacing: 0.3 }}>
          Trin {step + 1} af {STEPS.length} — {STEPS[step]}
        </div>
      </div>

      {/* Body */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '20px 20px 120px' }}>

        {/* ── STEP 0: Kilde ── */}
        {step === 0 && (
          <>
            <div style={{ fontFamily: SoS.font, fontSize: 22, fontWeight: 500,
              color: SoS.ink, marginBottom: 6, letterSpacing: -0.2 }}>
              Hvordan kom personen i kontakt?
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft,
              marginBottom: 20, lineHeight: 1.5 }}>
              Vi bruger dette til at forstå hvilke kanaler der virker bedst.
            </div>
            {INTAKE_KILDER.map(k => {
              const sel = kilde === k.id;
              return (
                <div key={k.id} style={{ marginBottom: 8 }}>
                  {/* Hoved-knap */}
                  <button onClick={() => { setKilde(k.id); setKildeDetalje(null); }} style={{
                    display: 'flex', alignItems: 'center', gap: 14, width: '100%',
                    padding: '14px 16px', textAlign: 'left',
                    background: sel ? SoS.orange + '12' : '#fff',
                    border: `2px solid ${sel ? SoS.orange : SoS.line}`,
                    borderRadius: sel && k.sub ? `${SoS.r.md}px ${SoS.r.md}px 0 0` : SoS.r.md,
                    cursor: 'pointer',
                  }}>
                    <div style={{
                      width: 40, height: 40, borderRadius: SoS.r.sm, flexShrink: 0,
                      background: sel ? SoS.orange : SoS.creamDeep,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      <Icon name={k.icon} size={18} color={sel ? '#fff' : SoS.inkSoft}/>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 600,
                        color: SoS.ink }}>{k.label}</div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
                        marginTop: 2 }}>
                        {sel && kildeDetalje
                          ? (k.sub || []).find(s => s.id === kildeDetalje)?.label
                          : k.desc}
                      </div>
                    </div>
                    {sel && kildeDetalje
                      ? <Icon name="check" size={16} color={SoS.orange}/>
                      : sel && k.sub
                        ? <Icon name="chevronD" size={14} color={SoS.orange}/>
                        : sel
                          ? <Icon name="check" size={16} color={SoS.orange}/>
                          : null}
                  </button>

                  {/* Underkategorier — vises kun når hoved er valgt og der er sub */}
                  {sel && k.sub && (
                    <div style={{
                      background: SoS.orange + '08',
                      border: `2px solid ${SoS.orange}`,
                      borderTop: 'none',
                      borderRadius: `0 0 ${SoS.r.md}px ${SoS.r.md}px`,
                      padding: '12px 14px 14px',
                    }}>
                      <div style={{ fontFamily: SoS.sans, fontSize: 10, fontWeight: 700,
                        color: SoS.orange, letterSpacing: 0.8, textTransform: 'uppercase',
                        marginBottom: 10 }}>
                        Præcisér — hvem konkret?
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7 }}>
                        {k.sub.map(s => {
                          const subSel = kildeDetalje === s.id;
                          return (
                            <button key={s.id} onClick={() => setKildeDetalje(subSel ? null : s.id)} style={{
                              padding: '7px 13px', borderRadius: SoS.r.sm, cursor: 'pointer',
                              fontFamily: SoS.sans, fontSize: 13, fontWeight: subSel ? 600 : 400,
                              background: subSel ? SoS.orange : '#fff',
                              color: subSel ? '#fff' : SoS.ink,
                              border: `1.5px solid ${subSel ? SoS.orange : SoS.line}`,
                            }}>{s.label}</button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        {/* ── STEP 1: Basisinfo ── */}
        {step === 1 && (
          <>
            <div style={{ fontFamily: SoS.font, fontSize: 22, fontWeight: 500,
              color: SoS.ink, marginBottom: 6, letterSpacing: -0.2 }}>
              Basisoplysninger
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft,
              marginBottom: 20, lineHeight: 1.5 }}>
              Fornavn, alder og telefon er påkrævet. Øvrige oplysninger er frivillige.
            </div>
            {[
              { key: 'firstName', label: 'Fornavn',   placeholder: 'f.eks. Erik',  required: true },
              { key: 'lastName',  label: 'Efternavn', placeholder: 'Valgfrit' },
              { key: 'age',       label: 'Alder',     placeholder: 'f.eks. 72',    required: true, type: 'number' },
              { key: 'phone',     label: 'Telefon',   type: 'tel', placeholder: '12 34 56 78', required: true },
            ].map(field => (
              <div key={field.key} style={{ marginBottom: 14 }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                  color: SoS.ink, marginBottom: 6 }}>
                  {field.label}
                  {field.required && <span style={{ color: SoS.orange }}> *</span>}
                </div>
                <input
                  type={field.type || 'text'}
                  inputMode={field.key === 'phone' ? 'tel' : 'text'}
                  placeholder={field.placeholder}
                  value={form[field.key]}
                  onChange={e => setForm(f => ({ ...f, [field.key]: e.target.value }))}
                  style={{...inputStyle,
                    borderColor: field.key === 'phone' && form.phone.length > 0 && !phoneOk
                      ? '#E05252' : inputStyle.borderColor }}
                />
                {field.key === 'phone' && form.phone.length > 0 && !phoneOk && (
                  <div style={{ fontFamily: SoS.sans, fontSize: 11, color: '#E05252',
                    marginTop: 4 }}>Mobilnummer skal være præcis 8 cifre</div>
                )}
              </div>
            ))}

            {/* Køn */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: SoS.ink, marginBottom: 6 }}>
                Køn <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, fontWeight: 400 }}>— valgfri</span>
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[
                  { id: 'mand',            label: 'Mand' },
                  { id: 'kvinde',          label: 'Kvinde' },
                  { id: 'non-binaer',      label: 'Non-binær' },
                  { id: 'vil-ikke-oplyse', label: 'Ønsker ikke at oplyse' },
                ].map(k => (
                  <button key={k.id} onClick={() => setKoen(koen === k.id ? null : k.id)}
                    style={{ padding: '8px 14px', borderRadius: SoS.r.md, cursor: 'pointer',
                      fontFamily: SoS.sans, fontSize: 13,
                      background: koen === k.id ? SoS.accent + '15' : '#fff',
                      border: `2px solid ${koen === k.id ? SoS.accent : SoS.line}`,
                      color: koen === k.id ? SoS.accent : SoS.ink,
                      fontWeight: koen === k.id ? 600 : 400 }}>
                    {k.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Postnummer */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: SoS.ink, marginBottom: 6 }}>
                Postnummer <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, fontWeight: 400 }}>— valgfri</span>
              </div>
              <input type="text" inputMode="numeric" maxLength={4} value={postnummer}
                onChange={e => setPostnummer(e.target.value.replace(/\D/g,''))}
                placeholder="f.eks. 8000"
                style={{ ...inputStyle, width: 120 }}
              />
            </div>

            {/* Kontaktperson */}
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: SoS.ink, marginBottom: 6 }}>
                Tilknyttet kontaktperson <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, fontWeight: 400 }}>— valgfri</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {[
                    { id: 'plejepersonale', label: 'Plejepersonale' },
                    { id: 'kommunal',       label: 'Kommunal socialrådgiver' },
                    { id: 'paaroerende',    label: 'Pårørende' },
                    { id: 'ven',            label: 'Ven / bekendt' },
                    { id: 'laege',          label: 'Læge / sygeplejerske' },
                    { id: 'frivillig',      label: 'Frivilligkoordinator' },
                    { id: 'anden',          label: 'Anden' },
                  ].map(t => (
                    <button key={t.id} onClick={() => setKpType(kpType === t.id ? null : t.id)}
                      style={{ padding: '6px 12px', borderRadius: SoS.r.sm, cursor: 'pointer',
                        fontFamily: SoS.sans, fontSize: 12,
                        background: kpType === t.id ? SoS.sky + '20' : '#fff',
                        border: `1.5px solid ${kpType === t.id ? SoS.sky : SoS.line}`,
                        color: kpType === t.id ? SoS.sky : SoS.inkSoft,
                        fontWeight: kpType === t.id ? 600 : 400 }}>
                      {t.label}
                    </button>
                  ))}
                </div>
                {kpType && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <input type="text" value={kpNavn} onChange={e => setKpNavn(e.target.value)}
                      placeholder="Navn" style={{ ...inputStyle, flex: 2 }} />
                    <input type="tel" value={kpTlf} onChange={e => setKpTlf(e.target.value)}
                      placeholder="Telefon" style={{ ...inputStyle, flex: 1 }} />
                  </div>
                )}
              </div>
            </div>

            {/* ── Hvornår er der brug for hjælp ── */}
            <div style={{ background: '#fff', borderRadius: SoS.r.md, padding: '14px 16px',
              border: `1px solid ${SoS.lineSoft}` }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
                color: SoS.ink, marginBottom: 10 }}>
                Hvornår er der brug for hjælp?{' '}
                <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, fontWeight: 400 }}>
                  — valgfri
                </span>
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[
                  { id: 'snarest',    label: 'Snarest muligt', sub: '2–3 dage',  clr: SoS.rose },
                  { id: 'uge',        label: 'Inden for en uge', sub: '7 dage',   clr: SoS.amber },
                  { id: 'fleksibelt', label: 'Fleksibelt',     sub: 'Ingen hast', clr: SoS.green },
                ].map(u => (
                  <button key={u.id}
                    onClick={() => setBehovUrgency(behovUrgency === u.id ? '' : u.id)}
                    style={{ padding: '6px 14px', borderRadius: SoS.r.sm, cursor: 'pointer',
                      fontFamily: SoS.sans, fontSize: 12,
                      background: behovUrgency === u.id ? u.clr + '20' : '#fff',
                      border: `1.5px solid ${behovUrgency === u.id ? u.clr : SoS.line}`,
                      color: behovUrgency === u.id ? u.clr : SoS.inkSoft,
                      fontWeight: behovUrgency === u.id ? 600 : 400,
                      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                    <span>{u.label}</span>
                    <span style={{ fontSize: 10, opacity: 0.7 }}>{u.sub}</span>
                  </button>
                ))}
              </div>
            </div>
          </>
        )}

                {/* ── STEP 2: Behov ── */}
        {step === 2 && (
          <>
            <div style={{ fontFamily: SoS.font, fontSize: 22, fontWeight: 500,
              color: SoS.ink, marginBottom: 6, letterSpacing: -0.2 }}>
              Hvad har personen brug for?
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft,
              marginBottom: 18, lineHeight: 1.5 }}>
              Vælg den type brobygning der passer bedst, og marker de behov du kender til.
            </div>

            {/* Brobygningstype */}
            <FieldLabel>Brobygningstype</FieldLabel>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 22 }}>
              {Object.values(SoS_TYPER).map(t => {
                const sel = type === t.id;
                return (
                  <button key={t.id} onClick={() => { setType(t.id); setSelectedBehov([]); }} style={{
                    display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px',
                    background: sel ? t.soft : SoS.surface,
                    border: `2px solid ${sel ? t.color : SoS.line}`,
                    borderRadius: SoS.r.sm, cursor: 'pointer', textAlign: 'left',
                  }}>
                    <div style={{ width: 34, height: 34, borderRadius: SoS.r.sm, flexShrink: 0,
                      background: sel ? t.color : SoS.surfaceAlt,
                      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Icon name={t.icon} size={16} color={sel ? '#fff' : SoS.inkSoft}/>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
                        color: SoS.ink }}>{t.label}</div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft,
                        marginTop: 2 }}>{t.desc}</div>
                    </div>
                    {sel && <Icon name="check" size={14} color={t.color}/>}
                  </button>
                );
              })}
            </div>

            {/* Specifikke behov */}
            <FieldLabel note={type ? 'vælg alle der passer' : 'valgfrit'}>Specifikke behov</FieldLabel>
            {type && (
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 22 }}>
                {(INTAKE_BEHOV_BY_TYPE[type] || []).map(b => {
                  const sel = selectedBehov.includes(b);
                  return (
                    <button key={b} onClick={() => toggleBehov(b)} style={{
                      padding: '8px 14px', borderRadius: SoS.r.sm, cursor: 'pointer',
                      background: sel ? SoS.ink : SoS.surface,
                      color: sel ? '#fff' : SoS.ink,
                      border: `1.5px solid ${sel ? SoS.ink : SoS.line}`,
                      fontFamily: SoS.sans, fontSize: 13, fontWeight: sel ? 600 : 400,
                    }}>{b}</button>
                  );
                })}
              </div>
            )}
            {!type && (
              <div style={{ marginBottom: 22, padding: '12px 14px', background: SoS.surfaceAlt,
                border: `1px solid ${SoS.line}`, fontFamily: SoS.sans, fontSize: 13, color: SoS.inkMuted }}>
                Vælg en brobygningstype ovenfor for at se relevante behov.
              </div>
            )}

            {/* Tidspræference */}
            <FieldLabel note="valgfrit">Hvornår passer det bedst?</FieldLabel>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 22 }}>
              {[
                { id: 'morgen',       label: 'Morgen',       sub: '8–10' },
                { id: 'formiddag',    label: 'Formiddag',    sub: '10–12' },
                { id: 'eftermiddag',  label: 'Eftermiddag',  sub: '12–16' },
                { id: 'aften',        label: 'Aften',        sub: '16–19' },
                { id: 'fleksibel',    label: 'Fleksibelt',   sub: 'Når det passer' },
              ].map(t => (
                <button key={t.id} onClick={() => setTidspraef(tidspraef === t.id ? null : t.id)} style={{
                  padding: '9px 14px', borderRadius: SoS.r.sm, cursor: 'pointer',
                  background: tidspraef === t.id ? SoS.ink : SoS.surface,
                  color: tidspraef === t.id ? '#fff' : SoS.ink,
                  border: `1px solid ${tidspraef === t.id ? SoS.ink : SoS.line}`,
                  fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, textAlign: 'center' }}>
                  <div>{t.label}</div>
                  <div style={{ fontSize: 10, opacity: 0.7, fontWeight: 400 }}>{t.sub}</div>
                </button>
              ))}
            </div>

            {/* Frekvens */}
            <FieldLabel note="valgfrit">Hvor ofte?</FieldLabel>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 8 }}>
              {[
                { id: 'ugentlig',   label: 'Ugentligt' },
                { id: 'hver14',     label: 'Hver 14. dag' },
                { id: 'maanedlig',  label: 'Månedligt' },
                { id: 'variabel',   label: 'Variabelt' },
              ].map(f => (
                <button key={f.id} onClick={() => setFrekvens(frekvens === f.id ? null : f.id)} style={{
                  padding: '8px 16px', borderRadius: SoS.r.sm, cursor: 'pointer',
                  background: frekvens === f.id ? SoS.ink : SoS.surface,
                  color: frekvens === f.id ? '#fff' : SoS.ink,
                  border: `1px solid ${frekvens === f.id ? SoS.ink : SoS.line}`,
                  fontFamily: SoS.sans, fontSize: 13 }}>
                  {f.label}
                </button>
              ))}
            </div>
          </>
        )}

                {/* ── STEP 3: Samtykke ── */}
        {step === 3 && (
          <>
            <div style={{ fontFamily: SoS.font, fontSize: 22, fontWeight: 500,
              color: SoS.ink, marginBottom: 6, letterSpacing: -0.2 }}>
              Bekræft og gem
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft,
              marginBottom: 16, lineHeight: 1.5 }}>
              Gennemgå oplysningerne inden du gemmer.
            </div>

            {/* Summary card */}
            <div style={{
              background: '#fff', borderRadius: SoS.r.lg,
              border: `1px solid ${SoS.line}`, marginBottom: 16, overflow: 'hidden',
            }}>
              {/* Person header */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12,
                padding: '14px 16px', borderBottom: `1px solid ${SoS.line}` }}>
                <div style={{
                  width: 48, height: 48, borderRadius: 24, background: SoS.orange,
                  display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                }}>
                  <span style={{ fontFamily: SoS.sans, fontSize: 16,
                    fontWeight: 700, color: '#fff' }}>
                    {(form.firstName[0] || '?').toUpperCase()}{(form.lastName[0] || '').toUpperCase()}
                  </span>
                </div>
                <div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 16,
                    fontWeight: 600, color: SoS.ink }}>
                    {form.firstName} {form.lastName}
                  </div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.inkSoft }}>
                    {form.age} år{form.phone ? ` · ${form.phone}` : ''}
                  </div>
                </div>
              </div>
              {/* Summary rows */}
              {[
                { label: 'Kilde', value: (() => {
                    const ko = INTAKE_KILDER.find(k => k.id === kilde);
                    if (!ko) return '—';
                    const sub = kildeDetalje ? (ko.sub || []).find(s => s.id === kildeDetalje) : null;
                    return sub ? `${ko.label} · ${sub.label}` : ko.label;
                  })() },
                { label: 'Type', value: SoS_TYPER[type]?.label },
                { label: 'Behov', value: selectedBehov.join(', ') || '—' },
                ...(udfordringer ? [{ label: 'Udfordringer', value: udfordringer, sensitive: true }] : []),
                ...(note ? [{ label: 'Note', value: note }] : []),
              ].map(row => (
                <div key={row.label} style={{
                  display: 'flex', gap: 10,
                  padding: '10px 16px',
                  borderBottom: `1px solid ${SoS.line}`,
                  background: row.sensitive ? '#FFF8F0' : 'transparent',
                }}>
                  <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                    color: row.sensitive ? SoS.orange : SoS.inkMuted,
                    minWidth: 100, paddingTop: 1 }}>
                    {row.label}
                    {row.sensitive && ' 🔒'}
                  </div>
                  <div style={{ fontFamily: SoS.sans, fontSize: 13, color: SoS.ink,
                    lineHeight: 1.5, flex: 1 }}>{row.value}</div>
                </div>
              ))}
              <div style={{ padding: '10px 16px' }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted }}>
                  Registreret af dig · {new Date().toLocaleDateString('da-DK', { day: 'numeric', month: 'long', year: 'numeric' })}
                </div>
              </div>
            </div>

            {/* GDPR consent — særligt vigtigt ved følsomme data */}
            {false && (
              <div style={{
                background: '#FFF8F0', border: `1.5px solid ${SoS.orange}40`,
                borderRadius: SoS.r.md, padding: '12px 14px', marginBottom: 12,
              }}>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 700,
                  color: SoS.orange, marginBottom: 4 }}>
                  OBS: Du har registreret følsomme helbredsoplysninger
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
                  lineHeight: 1.5 }}>
                  GDPR art. 9 kræver eksplicit samtykke til behandling af helbredsoplysninger.
                  Sørg for at dette er dokumenteret — f.eks. via underskrevet samtykkeerklæring
                  eller journalnotat — inden du gemmer.
                </div>
              </div>
            )}

            <button
              onClick={() => setConsent(c => !c)}
              style={{
                display: 'flex', gap: 14, alignItems: 'flex-start', width: '100%',
                padding: '14px 16px',
                background: consent ? SoS.sage + '15' : '#fff',
                border: `2px solid ${consent ? SoS.sage : SoS.line}`,
                borderRadius: SoS.r.md, cursor: 'pointer', textAlign: 'left',
              }}>
              <div style={{
                width: 22, height: 22, borderRadius: 6, flexShrink: 0, marginTop: 1,
                background: consent ? SoS.sage : '#fff',
                border: `2px solid ${consent ? SoS.sage : SoS.line}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                {consent && <Icon name="check" size={12} color="#fff" weight={3}/>}
              </div>
              <div>
                <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
                  color: SoS.ink, marginBottom: 4 }}>
                  Samtykke er indhentet og dokumenteret
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
                  lineHeight: 1.5 }}>
                  Personen er informeret om formålet med registreringen, hvem der
                  har adgang til oplysningerne, og at de til enhver tid kan
                  trække samtykket tilbage.
                  {false && ' Særskilt samtykke til helbredsoplysninger er dokumenteret.'}
                </div>
              </div>
            </button>
          </>
        )}
      </div>

      {/* Footer */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '12px 20px 34px',
        background: 'linear-gradient(to top, #fff 60%, transparent)',
        flexShrink: 0,
      }}>
        <div style={{ display: 'flex', gap: 10 }}>
          {step > 0 && (
            <button onClick={() => setStep(s => s - 1)} style={{
              flex: 1, padding: '14px 0',
              background: '#fff', color: SoS.ink,
              border: `1.5px solid ${SoS.line}`, borderRadius: SoS.r.md,
              fontFamily: SoS.sans, fontSize: 15, cursor: 'pointer',
            }}>
              Tilbage
            </button>
          )}
          {step < 3 ? (
            <button
              disabled={step === 0 ? !canNext0 : step === 1 ? !canNext1 : !canNext2}
              onClick={() => setStep(s => s + 1)}
              style={{
                flex: 2, padding: '14px 0',
                background: (step === 0 ? canNext0 : step === 1 ? canNext1 : canNext2)
                  ? SoS.orange : SoS.line,
                color: (step === 0 ? canNext0 : step === 1 ? canNext1 : step === 2 ? canNext2 : canNext3)
                  ? '#fff' : SoS.inkMuted,
                border: 'none', borderRadius: SoS.r.md,
                fontFamily: SoS.sans, fontSize: 15, fontWeight: 600,
                cursor: 'pointer', transition: 'background 0.2s',
              }}>
              Næste
            </button>
          ) : (
            <button
              disabled={!canFinish}
              onClick={handleFinish}
              style={{
                flex: 2, padding: '14px 0',
                background: canFinish ? SoS.sage : SoS.line,
                color: canFinish ? '#fff' : SoS.inkMuted,
                border: 'none', borderRadius: SoS.r.md,
                fontFamily: SoS.sans, fontSize: 15, fontWeight: 600,
                cursor: 'pointer', transition: 'background 0.2s',
              }}>
              Gem og opret
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

window.IntakeFlow = IntakeFlow;
</script>

</body>
</html>
