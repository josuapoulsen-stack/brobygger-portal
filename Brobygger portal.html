const DSCard = ({ children, title, subtitle, style = {}, action }) => (
  <div style={{ background: SoS.surface, borderRadius: 0,
    border: `1px solid ${SoS.line}`, padding: 18, ...style }}>
    {title && (
      <div style={{ display: 'flex', justifyContent: 'space-between',
        alignItems: 'baseline', marginBottom: 14 }}>
        <div>
          <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
            color: SoS.inkMuted, letterSpacing: 1, textTransform: 'uppercase' }}>{title}</div>
          {subtitle && <div style={{ fontFamily: SoS.sans, fontSize: 18,
            fontWeight: 700, color: SoS.ink, marginTop: 4 }}>{subtitle}</div>}
        </div>
        {action}
      </div>
    )}
    {children}
  </div>
);

const DesktopDashboard = ({ viewingHq, isAdmin }) => (
  <>
    {/* KPI row */}
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)',
      gap: 10, marginBottom: 14 }}>
      {(() => {
        const aktive = SoS_BROBYGGERE ? SoS_BROBYGGERE.filter(b => b.status === 'aktiv').length : 0;
        const afventer = Object.values(SoS_MENNESKER || {}).filter(m => m.status === 'afventer' || m.status === 'venter').length;
        const konfirmerede = (SoS_APPOINTMENTS_BUSY || []).filter(a => a.status === 'confirmed').length;
        const pendende = (SoS_APPOINTMENTS_BUSY || []).filter(a => a.status === 'pending').length;
        return [
          { l: 'Aktive brobyggere', v: String(aktive), d: aktive > 0 ? 'aktive' : '—', c: SoS.accent },
          { l: 'Afventer match', v: String(afventer), d: afventer > 0 ? 'ikke matchet' : 'alle matchet', c: SoS.amber },
          { l: 'Bekræftede aftaler', v: String(konfirmerede), d: 'registrerede', c: SoS.green },
          { l: 'Afventer bekræftelse', v: String(pendende), d: 'pending', c: SoS.inkMuted },
          { l: 'Registrerede mennesker', v: String(Object.keys(SoS_MENNESKER || {}).length), d: 'i alt', c: SoS.sky },
        ];
      })().map((k, i) => (
        <DSCard key={i}>
          <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
            color: SoS.inkMuted, letterSpacing: 1, textTransform: 'uppercase' }}>{k.l}</div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 6 }}>
            <span style={{ fontFamily: SoS.mono, fontSize: 28, fontWeight: 700,
              color: k.c || SoS.ink, letterSpacing: -1 }}>{k.v}</span>
            <span style={{ fontFamily: SoS.sans, fontSize: 11, fontWeight: 600,
              color: k.tc || SoS.sage }}>{k.d}</span>
          </div>
          <div style={{ height: 3, marginTop: 10, borderRadius: 2, background: SoS.lineSoft }}>
            <div style={{ width: '65%', height: '100%', background: k.c, borderRadius: 2 }}/>
          </div>
        </DSCard>
      ))}
    </div>

    {/* Opfølgning afventer */}
    {(() => {
      const TODAY_S = new Date().toISOString().slice(0, 10);
      const pending = (window.SoS_APPOINTMENTS_BUSY || [])
        .filter(a => a.date < TODAY_S && a.brobyggerLog && !a.raadgiverOpfoelgning)
        .sort((a, b) => a.date.localeCompare(b.date));

      const [expanded, setExpanded] = React.useState(false);
      const [version,  setVersion]  = React.useState(0);

      const setOpfoelgning = (apptId, val, trivsel) => {
        const newList = (window.SoS_APPOINTMENTS_BUSY || []).map(a =>
          a.id === apptId ? { ...a, raadgiverOpfoelgning: val,
            brobyggerTrivsel: trivsel || a.brobyggerTrivsel || null } : a
        );
        window.SoS_APPOINTMENTS_BUSY = newList;
        if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
        setVersion(v => v + 1);
      };

      if (pending.length === 0) return null;

      return (
        <DSCard style={{ marginBottom: 14, padding: 0, overflow: 'hidden' }}>
          {/* Header — klikbar */}
          <button onClick={() => setExpanded(v => !v)} style={{
            display: 'flex', alignItems: 'center', gap: 12,
            width: '100%', padding: '14px 18px', background: 'none',
            border: 'none', cursor: 'pointer', textAlign: 'left' }}>
            <div style={{ width: 32, height: 32, borderRadius: 0,
              background: SoS.amber + '20', display: 'flex',
              alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <Icon name="bell" size={15} color={SoS.amber}/>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 700,
                color: SoS.ink }}>
                {pending.length} {pending.length === 1 ? 'aftale afventer' : 'aftaler afventer'} din opfølgning
              </div>
              <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted, marginTop: 1 }}>
                Brobyggerne har registreret — ring og tilføj din vurdering
              </div>
            </div>
            <Icon name={expanded ? 'chevronD' : 'chevron'} size={14} color={SoS.inkMuted}/>
          </button>

          {expanded && (
            <div style={{ borderTop: `1px solid ${SoS.line}` }}>
              {pending.map((a, i) => {
                const m  = SoS_MENNESKER[a.menneskeId];
                const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
                const log = a.brobyggerLog || {};
                const UDFALD_COLOR = {
                  gennemfoert: SoS.green, afbud: SoS.amber, 'ikke-modt': SoS.red };
                const UDFALD_LABEL = {
                  gennemfoert: 'Gennemfaert', afbud: 'Afbud', 'ikke-modt': 'Mødte ikke op' };
                return (
                  <div key={a.id} style={{
                    padding: '14px 18px',
                    borderBottom: i < pending.length - 1 ? `1px solid ${SoS.lineSoft}` : 'none',
                    display: 'grid', gridTemplateColumns: '1fr auto', gap: 12, alignItems: 'start' }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                        <span style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 700,
                          color: SoS.ink }}>
                          {m ? m.firstName + ' ' + m.lastName : '—'}
                        </span>
                        <span style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 700,
                          color: UDFALD_COLOR[log.udfald] || SoS.inkMuted,
                          textTransform: 'uppercase', letterSpacing: 0.5 }}>
                          {UDFALD_LABEL[log.udfald] || log.udfald}
                          {log.varighed ? ` · ${log.varighed >= 60 ? Math.round(log.varighed/60*10)/10 + 't' : log.varighed + 'm'}` : ''}
                        </span>
                      </div>
                      <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted }}>
                        {a.date} · {bb ? bb.name.split(' ')[0] : '—'}
                        {log.note ? ` · "${log.note}"` : ''}
                      </div>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flexShrink: 0, alignItems: 'flex-end' }}>
                      {/* Trivsel-signal */}
                      <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                        <span style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkMuted, marginRight: 2 }}>BB:</span>
                        {[
                          { id: 'engageret',   emoji: '💪', label: 'Engageret' },
                          { id: 'neutral',     emoji: '😐', label: 'Neutral' },
                          { id: 'overbelastet',emoji: '😔', label: 'Overbelastet' },
                        ].map(t => (
                          <button key={t.id}
                            onClick={() => setOpfoelgning(a.id, 'fulgt-op', t.id)}
                            title={`Ring & notér · Brobygger virker ${t.label}`}
                            style={{ padding: '4px 8px', background: SoS.surface,
                              border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                              cursor: 'pointer', fontSize: 14 }}>
                            {t.emoji}
                          </button>
                        ))}
                      </div>
                      <div style={{ display: 'flex', gap: 6 }}>
                      <button onClick={() => setOpfoelgning(a.id, 'fulgt-op')} style={{
                        padding: '6px 12px', background: SoS.ink, color: '#fff',
                        border: 'none', borderRadius: SoS.r.sm, cursor: 'pointer',
                        fontFamily: SoS.sans, fontSize: 11, fontWeight: 700,
                        whiteSpace: 'nowrap' }}>
                        Ring &amp; notér
                      </button>
                      <button onClick={() => setOpfoelgning(a.id, 'ikke-noedvendigt')} style={{
                        padding: '6px 10px', background: SoS.surfaceAlt, color: SoS.inkMuted,
                        border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                        cursor: 'pointer', fontFamily: SoS.sans, fontSize: 11,
                        whiteSpace: 'nowrap' }}>
                        Ikke nødvendigt
                      </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </DSCard>
      );
    })()}

    {/* Row 2 */}
    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr',
      gap: 10, marginBottom: 14 }}>
      <DSCard title="Gennemførte aftaler" subtitle="12 måneder">
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 5, height: 140 }}>
          {(() => {
            const now = new Date();
            const months = Array.from({ length: 12 }, (_, i) => {
              const d = new Date(now.getFullYear(), now.getMonth() - 11 + i, 1);
              return { y: d.getFullYear(), m: d.getMonth() + 1,
                lbl: ['J','F','M','A','M','J','J','A','S','O','N','D'][d.getMonth()] };
            });
            const appts = window.SoS_APPOINTMENTS_BUSY || [];
            const counts = months.map(({ y, m }) =>
              appts.filter(a => {
                const [ay, am] = a.date.split('-').map(Number);
                return ay === y && am === m && a.brobyggerLog && a.brobyggerLog.udfald === 'gennemfoert';
              }).length
            );
            const max = Math.max(...counts, 1);
            return counts.map((v, i) => (
              <div key={i} style={{ flex: 1, display: 'flex',
                flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ flex: 1, display: 'flex', alignItems: 'flex-end', width: '100%' }}>
                  <div style={{ width: '100%', height: `${Math.max((v/max) * 100, 4)}%`,
                    background: i >= 9 ? SoS.accent : SoS.accent + '40',
                    borderRadius: '3px 3px 0 0' }}/>
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 9, color: SoS.inkMuted }}>
                  {months[i].lbl}
                </div>
              </div>
            ));
          })()}
        </div>
      </DSCard>

      <DSCard title="Type-fordeling" subtitle="Aktive forløb">
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          {(() => {
            const alle = Object.values(window.SoS_MENNESKER || {}).filter(m => m.status === 'aktiv');
            const social   = alle.filter(m => m.type === 'social').length;
            const forening = alle.filter(m => m.type === 'forening').length;
            const sundhed  = alle.filter(m => m.type === 'sundhed').length;
            return <>
              <TypeDonut sundhed={sundhed} forening={forening} social={social} size={90}/>
              <div style={{ flex: 1 }}>
                {[
                  { k: 'social', v: social },
                  { k: 'forening', v: forening },
                  { k: 'sundhed', v: sundhed },
                ].map(x => {
              const t = SoS_TYPER[x.k];
              return (
                <div key={x.k} style={{ display: 'flex', alignItems: 'center',
                  gap: 8, marginBottom: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: 4, background: t.color }}/>
                  <span style={{ flex: 1, fontFamily: SoS.sans, fontSize: 11,
                    color: SoS.ink }}>{t.short}</span>
                  <span style={{ fontFamily: SoS.sans, fontSize: 12,
                    fontWeight: 600, color: SoS.ink }}>{x.v}</span>
                </div>
              );
            })}
              </div>
            </>;
          })()}
        </div>
      </DSCard>
    </div>

    {/* Row 3 */}
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr',
      gap: 10, marginBottom: 14 }}>
      <DSCard title="Per hovedsæde" subtitle="Aktive forløb">
        {[
          { hq: 'Hovedstaden', v: 142 }, { hq: 'Aarhus', v: 94 },
          { hq: 'Fyn', v: 71 }, { hq: 'Sjælland', v: 58 },
          { hq: 'Midt', v: 44 }, { hq: 'Nord', v: 38 },
          { hq: 'Syd', v: 32 }, { hq: 'Kronjylland', v: 21 }, { hq: 'Sydvest', v: 18 },
        ].map((h, i, arr) => {
          const max = arr[0].v;
          return (
            <div key={i} style={{ display: 'flex', alignItems: 'center',
              gap: 10, marginBottom: i < arr.length-1 ? 6 : 0 }}>
              <div style={{ width: 80, fontFamily: SoS.sans, fontSize: 11,
                color: SoS.ink }}>{h.hq}</div>
              <div style={{ flex: 1, height: 6, background: SoS.lineSoft,
                borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ width: `${(h.v/max)*100}%`, height: '100%',
                  background: SoS.hq[h.hq] || SoS.orange, borderRadius: 3 }}/>
              </div>
              <div style={{ width: 30, textAlign: 'right', fontFamily: SoS.sans,
                fontSize: 11, fontWeight: 600, color: SoS.ink }}>{h.v}</div>
            </div>
          );
        })}
      </DSCard>

      <DSCard title="Effekt · UCLA-3" subtitle="Selv-rapporteret ensomhed">
        <div style={{ fontFamily: SoS.mono, fontSize: 30, fontWeight: 700,
          color: SoS.ink, letterSpacing: -1 }}>
          −3.3 <span style={{ fontSize: 14, color: SoS.inkSoft }}>point gnsn.</span>
        </div>
        <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft, marginTop: 4 }}>
          Baseret på 62 besvarelser · 3 mdr efter start
        </div>
        <div style={{ display: 'flex', gap: 14, marginTop: 16, alignItems: 'center' }}>
          <div style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ fontFamily: SoS.font, fontSize: 24, color: SoS.rose }}>6.4</div>
            <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkMuted }}>Før start</div>
          </div>
          <svg width="40" height="20" viewBox="0 0 40 20">
            <path d="M4 16 Q20 2 36 10" stroke={SoS.sage} strokeWidth="2" fill="none" strokeLinecap="round"/>
            <path d="M32 7 L36 10 L32 13" stroke={SoS.sage} strokeWidth="2" fill="none" strokeLinecap="round"/>
          </svg>
          <div style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ fontFamily: SoS.font, fontSize: 24, color: SoS.sage }}>3.1</div>
            <div style={{ fontFamily: SoS.sans, fontSize: 10, color: SoS.inkMuted }}>Efter 3 mdr</div>
          </div>
        </div>
        <div style={{ marginTop: 14, padding: 10, background: SoS.green + '10',
          borderRadius: 0, borderLeft: `2px solid ${SoS.green}`,
          fontFamily: SoS.sans, fontSize: 11,
          color: SoS.green, lineHeight: 1.5 }}>
          87% af menneskerne rapporterer mindre ensomhed efter 3 måneder.
        </div>
      </DSCard>
    </div>

    {/* Row 4 — recent activity */}
    <DSCard title="Seneste registreringer">
      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ borderBottom: `1px solid ${SoS.line}` }}>
            {['Tidspunkt', 'Brobygger', 'Menneske', 'Type', 'Status', 'Varighed'].map(h => (
              <th key={h} style={{ textAlign: 'left', padding: '8px 4px',
                fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                color: SoS.inkMuted, letterSpacing: 0.8,
                textTransform: 'uppercase' }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {(() => {
            const myAppts = (window.SoS_APPOINTMENTS_BUSY || [])
              .filter(a => a.brobyggerId === b.id)
              .sort((x, y) => (y.date + y.start).localeCompare(x.date + x.start))
              .slice(0, 8);
            if (myAppts.length === 0) return (
              <tr><td colSpan={5} style={{ padding: '20px 4px', textAlign: 'center',
                fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted }}>
                Ingen registrerede aftaler endnu
              </td></tr>
            );
            return myAppts.map((a, i) => {
              const mn = (window.SoS_MENNESKER || {})[a.menneskeId];
              const mnLabel = mn ? `${mn.firstName} ${mn.lastName[0]}. (${mn.age})` : a.menneskeId;
              const ty = mn ? SoS_TYPER[mn.type] : null;
              const log = a.brobyggerLog;
              const udfalds = { gennemfoert: 'Gennemført', afbud: 'Afbud', 'ikke-modt': 'Udeblev' };
              const udfaldsColor = { gennemfoert: SoS.green, afbud: SoS.amber, 'ikke-modt': SoS.rose };
              const udfaldsLabel = log ? (udfalds[log.udfald] || log.udfald) : (a.status === 'confirmed' ? 'Afventer' : 'Pending');
              const udfaldsC = log ? (udfaldsColor[log.udfald] || SoS.inkMuted) : SoS.inkMuted;
              const varLabel = log && log.varighed ? `${log.varighed >= 60 ? Math.floor(log.varighed/60)+'t' : ''} ${log.varighed % 60 ? (log.varighed%60)+'m' : ''}`.trim() : '—';
              return (
                <tr key={i} style={{ borderBottom: `1px solid ${SoS.lineSoft}` }}>
                  <td style={{ padding: '10px 4px', fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>{a.date} {a.start}</td>
                  <td style={{ padding: '10px 4px', fontFamily: SoS.sans, fontSize: 12, color: SoS.ink }}>{mnLabel}</td>
                  {ty && <td style={{ padding: '10px 4px' }}><Pill bg={ty.soft} color={ty.color}>{ty.short}</Pill></td>}
                  {!ty && <td style={{ padding: '10px 4px', fontFamily: SoS.sans, fontSize: 12, color: SoS.inkMuted }}>—</td>}
                  <td style={{ padding: '10px 4px' }}>
                    <Pill bg={log ? (udfaldsC + '22') : SoS.creamDeep} color={udfaldsC}>{udfaldsLabel}</Pill>
                  </td>
                  <td style={{ padding: '10px 4px', fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>{varLabel}</td>
                </tr>
              );
            });
          })()}
        </tbody>
      </table>
    </DSCard>
  </>
);

const DesktopBrobyggere = ({ initialTarget, onTargetConsumed }) => {
  const [filter, setFilter] = React.useState('alle');
  const [search,  setSearch]  = React.useState('');
  const [selectedBb, setSelectedBb] = React.useState(null);

  const TODAY = new Date().toISOString().slice(0, 10);
  const fmtLast = (d) => {
    if (!d) return '—';
    const days = Math.round((new Date(TODAY) - new Date(d)) / (1000 * 60 * 60 * 24));
    if (days === 0) return 'i dag';
    if (days === 1) return 'i går';
    if (days <= 7)  return days + 'd siden';
    if (days <= 30) return Math.round(days / 7) + 'u siden';
    return Math.round(days / 30) + 'mdr siden';
  };

  const FILTERS = [
    { id: 'alle',     label: 'Alle' },
    { id: 'aktiv',    label: 'Aktive' },
    { id: 'pause',    label: 'På pause' },
    { id: 'ny',       label: 'Nye' },
    { id: 'afventer', label: 'Afventer' },
  ];

  const SoS_STYLE = {
    aktiv:    { bg: SoS.sageSoft,       color: SoS.sage,      label: 'Aktiv' },
    pause:    { bg: SoS.sun + '33',    color: '#8A6D1E',   label: 'Pause' },
    ny:       { bg: SoS.skySoft,        color: SoS.sky,       label: 'Ny' },
    afventer: { bg: SoS.orange + '18', color: SoS.orange,    label: 'Afventer' },
    afsluttet:{ bg: '#F0F0F0',        color: SoS.inkMuted,  label: 'Afsluttet' },
  };

  const rows = SoS_BROBYGGERE
    .filter(b => filter === 'alle' || b.status === filter)
    .filter(b => !search || b.name.toLowerCase().includes(search.toLowerCase()));

  return (
    <>
    <DSCard>
      {/* Toolbar */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ flex: 1, minWidth: 180, display: 'flex', alignItems: 'center',
          gap: 8, background: SoS.surfaceAlt, borderRadius: 0, padding: '8px 14px',
          border: `1px solid ${SoS.line}` }}>
          <Icon name="search" size={14} color={SoS.inkMuted}/>
          <input placeholder={`Søg i ${SoS_BROBYGGERE.length} brobygger...`}
            value={search} onChange={e => setSearch(e.target.value)}
            style={{ flex: 1, background: 'transparent', border: 'none',
              outline: 'none', fontFamily: SoS.sans, fontSize: 13 }}/>
          {search && (
            <button onClick={() => setSearch('')} style={{ background: 'none', border: 'none',
              cursor: 'pointer', color: SoS.inkMuted, fontSize: 16, lineHeight: 1, padding: 0 }}>x</button>
          )}
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {FILTERS.map(f => (
            <button key={f.id} onClick={() => setFilter(f.id)} style={{
              padding: '7px 12px', borderRadius: SoS.r.sm, cursor: 'pointer',
              background: filter === f.id ? SoS.ink : SoS.surface,
              color: filter === f.id ? '#fff' : SoS.ink,
              border: `1px solid ${filter === f.id ? SoS.ink : SoS.line}`,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: 600 }}>{f.label}</button>
          ))}
        </div>
      </div>

      {/* Tabel */}
      <table style={{ width: '100%', borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ borderBottom: `1px solid ${SoS.line}` }}>
            {['Navn', 'Status', 'Aktive', 'Denne uge', 'Sidst aktiv', 'Planlagt pause'].map(h => (
              <th key={h} style={{ textAlign: 'left', padding: '10px 8px',
                fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase' }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.length === 0 ? (
            <tr><td colSpan={6} style={{ padding: '28px 8px', textAlign: 'center',
              fontFamily: SoS.sans, fontSize: 13, color: SoS.inkMuted }}>
              Ingen brobyggere matcher filteret
            </td></tr>
          ) : rows.map(b => {
            const ss = SoS_STYLE[b.status] || SoS_STYLE.aktiv;
            const hasPause = b.pauseUntil && b.pauseUntil >= TODAY;
            return (
              <tr key={b.id}
                onClick={() => setSelectedBb(b)}
                style={{ borderBottom: `1px solid ${SoS.lineSoft}`, cursor: 'pointer' }}
                onMouseEnter={e => e.currentTarget.style.background = SoS.surfaceAlt}
                onMouseLeave={e => e.currentTarget.style.background = ''}
              >
                <td style={{ padding: '12px 8px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <Avatar initials={b.avatar} bg={b.bg} size={28}/>
                    <span style={{ fontFamily: SoS.sans, fontSize: 13,
                      fontWeight: 500, color: SoS.ink }}>{b.name}</span>
                  </div>
                </td>
                <td style={{ padding: '12px 8px' }}>
                  <Pill bg={ss.bg} color={ss.color}>{ss.label}</Pill>
                </td>
                <td style={{ padding: '12px 8px', fontFamily: SoS.sans,
                  fontSize: 13, fontWeight: 600, color: SoS.ink }}>{b.active}</td>
                <td style={{ padding: '12px 8px', fontFamily: SoS.sans,
                  fontSize: 12, color: SoS.inkSoft }}>
                  {b.thisWeek > 0 ? b.thisWeek + ' afd.' : '—'}
                </td>
                <td style={{ padding: '12px 8px', fontFamily: SoS.sans,
                  fontSize: 12, color: SoS.inkMuted }}>{fmtLast(b.lastActive)}</td>
                <td style={{ padding: '12px 8px' }}>
                  {hasPause ? (
                    <Pill bg={SoS.sun + '22'} color={SoS.orangeDeep}>
                      {b.pauseNote || 'Pause'}
                      {' – til '}
                      {new Date(b.pauseUntil).toLocaleDateString('da-DK', { day: 'numeric', month: 'short' })}
                    </Pill>
                  ) : (
                    <span style={{ color: SoS.lineSoft, fontFamily: SoS.sans, fontSize: 12 }}>—</span>
                  )}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>

      {/* Footer */}
      <div style={{ marginTop: 12, fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted,
        textAlign: 'right' }}>
        {rows.length} af {SoS_BROBYGGERE.length} brobyggere
      </div>
    </DSCard>

    {/* Brobygger profil overlay */}
    {selectedBb && (
      <div style={{ position: 'fixed', inset: 0, zIndex: 200,
        background: 'rgba(0,0,0,0.35)', display: 'flex',
        alignItems: 'stretch', justifyContent: 'flex-end' }}
        onClick={e => { if (e.target === e.currentTarget) setSelectedBb(null); }}>
        <div style={{ width: 420, overflowY: 'auto', background: SoS.paper,
          borderLeft: `1px solid ${SoS.line}`, boxShadow: '-8px 0 32px rgba(0,0,0,0.15)' }}>
          {/* Desktop panel header */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '14px 16px', borderBottom: `1px solid ${SoS.line}`,
            background: SoS.surface, position: 'sticky', top: 0, zIndex: 10 }}>
            <span style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 700, color: SoS.ink }}>
              {selectedBb.name}
            </span>
            <button onClick={() => setSelectedBb(null)} style={{
              width: 28, height: 28, borderRadius: 0, background: SoS.surfaceAlt,
              border: `1px solid ${SoS.line}`, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <Icon name="x" size={14} color={SoS.inkMuted}/>
            </button>
          </div>
          <BrobyggerProfilePanel brobygger={selectedBb} onClose={() => setSelectedBb(null)}/>
        </div>
      </div>
    )}
    </>
  );
};

const DesktopBrobygninger = () => {
  const [statusFilter, setStatusFilter] = React.useState('alle');
  const [typeFilter,   setTypeFilter]   = React.useState('alle');

  const handleExportCSV = (filtered) => {
    const nl = String.fromCharCode(10);
    const rows = [['Dato','Start','Slut','Menneske','Alder','Type','Aktivitet','Sted','Status','Udfald','Varighed (min)']];
    filtered.forEach(a => {
      const mn = (window.SoS_MENNESKER || {})[a.menneskeId];
      const log = a.brobyggerLog;
      rows.push([
        a.date, a.start, a.end,
        mn ? `${mn.firstName} ${mn.lastName}` : a.menneskeId,
        mn ? mn.age : '',
        mn ? (SoS_TYPER[mn.type]?.label || mn.type) : '',
        a.activity, a.location,
        a.status, log ? log.udfald : '',
        log && log.varighed ? log.varighed : '',
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a'); a.href = url;
    a.download = `brobygninger-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
  };

  const appts = SoS_APPOINTMENTS_BUSY || [];
  const filtered = appts.filter(a => {
    const m = SoS_MENNESKER[a.menneskeId];
    if (!m) return false;
    if (typeFilter !== 'alle' && m.type !== typeFilter) return false;
    if (statusFilter === 'confirmed' && a.status !== 'confirmed') return false;
    if (statusFilter === 'pending'   && a.status !== 'pending')   return false;
    return true;
  });

  const STATUS_LABEL = { confirmed: 'Bekræftet', pending: 'Afventer' };
  const STATUS_COLOR = { confirmed: '#388E3C', pending: '#E87A3E' };
  const STATUS_BG    = { confirmed: '#E8F5E9', pending: '#FFF3E0' };

  const typeCount = (tid) =>
    Object.values(SoS_MENNESKER).filter(m => m.type === tid && m.status === 'aktiv').length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

      {/* Type-statistik */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
        {Object.values(SoS_TYPER).map(t => (
          <DSCard key={t.id} style={{ padding: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
              <div style={{ width: 32, height: 32, borderRadius: 0, background: t.soft,
                display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name={t.icon} size={18} color={t.color}/>
              </div>
              <span style={{ fontFamily: SoS.sans, fontSize: 12, fontWeight: 700,
                color: t.color, textTransform: 'uppercase', letterSpacing: 0.5 }}>{t.label}</span>
            </div>
            <div style={{ fontFamily: SoS.font, fontSize: 36, fontWeight: 500,
              color: t.color, letterSpacing: -1, lineHeight: 1 }}>
              {Object.values(SoS_MENNESKER || {}).filter(m => m.type === t.id).length}
            </div>
            <div style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft, marginTop: 6 }}>
              {t.id === 'sundhed' ? '521' : t.id === 'forening' ? '702' : '911'} gennemførte aftaler
            </div>
            <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${SoS.lineSoft}`,
              fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft }}>
              {typeCount(t.id)} aktive mennesker
            </div>
          </DSCard>
        ))}
      </div>

      {/* Filterlinje */}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted,
          letterSpacing: 0.5, textTransform: 'uppercase', fontWeight: 700 }}>Type:</span>
        {['alle', 'sundhed', 'forening', 'social'].map(f => {
          const t = SoS_TYPER[f];
          const sel = typeFilter === f;
          return (
            <button key={f} onClick={() => setTypeFilter(f)} style={{
              padding: '5px 10px', borderRadius: SoS.r.sm,
              background: sel ? (t ? t.color : SoS.ink) : SoS.surface,
              color: sel ? '#fff' : SoS.inkSoft,
              border: `1px solid ${sel ? (t ? t.color : SoS.ink) : SoS.line}`,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 700 : 400, cursor: 'pointer',
            }}>{f === 'alle' ? 'Alle' : t.short}</button>
          );
        })}
        <div style={{ width: 1, background: SoS.lineSoft, margin: '0 4px', height: 18 }}/>
        <span style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkMuted,
          letterSpacing: 0.5, textTransform: 'uppercase', fontWeight: 700 }}>Status:</span>
        {['alle', 'confirmed', 'pending'].map(s => {
          const sel = statusFilter === s;
          return (
            <button key={s} onClick={() => setStatusFilter(s)} style={{
              padding: '5px 10px', borderRadius: SoS.r.sm,
              background: sel ? (STATUS_COLOR[s] || SoS.ink) : SoS.surface,
              color: sel ? '#fff' : SoS.inkSoft,
              border: `1px solid ${sel ? (STATUS_COLOR[s] || SoS.ink) : SoS.line}`,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 700 : 400, cursor: 'pointer',
            }}>{s === 'alle' ? 'Alle' : STATUS_LABEL[s]}</button>
          );
        })}
        <button onClick={() => handleExportCSV(filtered)}
          style={{ marginLeft: 'auto', padding: '5px 12px', borderRadius: SoS.r.sm,
            background: 'none', border: `1px solid ${SoS.line}`, cursor: 'pointer',
            fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft,
            display: 'flex', alignItems: 'center', gap: 5 }}>
          <Icon name="download" size={13} color={SoS.inkSoft} weight={2}/> CSV
        </button>
      </div>

      {/* Aftaletabel */}
      <DSCard style={{ padding: 0, overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: SoS.surface, borderBottom: `1px solid ${SoS.line}` }}>
              {['Dato', 'Menneske', 'Brobygger', 'Aktivitet', 'Sted', 'Status'].map(h => (
                <th key={h} style={{ padding: '10px 14px', textAlign: 'left',
                  fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                  color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={6} style={{ padding: 24, textAlign: 'center',
                fontFamily: SoS.sans, fontSize: 13, color: SoS.inkMuted }}>
                Ingen aftaler matcher filteret
              </td></tr>
            )}
            {filtered.map((a, i) => {
              const m  = SoS_MENNESKER[a.menneskeId];
              const t  = m ? SoS_TYPER[m.type] : null;
              const bb = (SoS_BROBYGGERE || []).find(b => b.id === a.brobyggerId);
              const dato = new Date(a.date).toLocaleDateString('da-DK',
                { weekday: 'short', day: 'numeric', month: 'short' });
              return (
                <tr key={a.id} style={{
                  borderBottom: `1px solid ${SoS.lineSoft}`,
                  background: 'transparent',
                }}>
                  <td style={{ padding: '11px 14px', fontFamily: SoS.sans, fontSize: 12,
                    color: SoS.inkSoft, whiteSpace: 'nowrap' }}>
                    {dato}<br/>
                    <span style={{ color: SoS.inkMuted }}>{a.start}–{a.end}</span>
                  </td>
                  <td style={{ padding: '11px 14px' }}>
                    {m ? (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <Avatar initials={m.initials} bg={t ? t.color : SoS.inkSoft} size={28}/>
                        <div>
                          <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600,
                            color: SoS.ink }}>{m.firstName} {m.lastName[0]}.</div>
                          {t && <Pill bg={t.soft} color={t.color} style={{ fontSize: 10 }}>{t.short}</Pill>}
                        </div>
                      </div>
                    ) : '—'}
                  </td>
                  <td style={{ padding: '11px 14px' }}>
                    {bb ? (
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>

                          {bb.name.split(' ')[0]}
                        </span>
                      </div>
                    ) : '—'}
                  </td>
                  <td style={{ padding: '11px 14px', fontFamily: SoS.sans, fontSize: 13,
                    color: SoS.ink }}>{a.activity}</td>
                  <td style={{ padding: '11px 14px', fontFamily: SoS.sans, fontSize: 12,
                    color: SoS.inkSoft }}>{a.location}</td>
                  <td style={{ padding: '11px 14px' }}>
                    <Pill bg={STATUS_BG[a.status] || SoS.creamDeep}

                    </Pill>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{ padding: '10px 14px', background: SoS.surface,
          fontFamily: SoS.mono, fontSize: 9.5, color: SoS.inkMuted,
          borderTop: `1px solid ${SoS.line}` }}>
          Viser {filtered.length} af {appts.length} aftaler
        </div>
      </DSCard>
    </div>
  );
};

const DesktopMenneskeStatus = ({ menneske: m, onStatusChange }) => {
  const [open, setOpen] = React.useState(false);
  const [note, setNote] = React.useState('');
  const [pendingStatus, setPendingStatus] = React.useState(null);

  const STATUSES = [
    { id: 'afventer', label: 'Afventer',  color: SoS.amber, desc: 'Venter på match med brobygger' },
    { id: 'aktiv',    label: 'Aktiv',     color: SoS.green, desc: 'Aktivt forløb i gang' },
    { id: 'pause',    label: 'Pause',     color: SoS.inkMuted, desc: 'Midlertidigt på pause' },
    { id: 'venter',   label: 'Venter',    color: SoS.amber, desc: 'Afventer næste aftale' },
    { id: 'afsluttet', label: 'Afsluttet', color: SoS.red,  desc: 'Forløbet er afsluttet' },
  ];

  const current = STATUSES.find(s => s.id === m.status) || STATUSES[0];

  const [aarsag, setAarsag] = React.useState('');
  const [opfoelgning, setOpfoelgning] = React.useState(false);

  const AARSAGER = [
    { id: 'naturlig',  label: 'Naturlig afslutning',  desc: 'Forløbet er fuldført som planlagt' },
    { id: 'frafald',   label: 'Frafald',               desc: 'Personen ønsker ikke at fortsætte' },
    { id: 'flytning',  label: 'Flytning',               desc: 'Personen er flyttet fra området' },
    { id: 'doedfald',  label: 'Dødsfald',               desc: 'Personen er afgået ved døden' },
    { id: 'andet',     label: 'Andet',                  desc: 'Anden årsag — beskriv i noten' },
  ];

  const confirm = () => {
    if (!pendingStatus) return;
    if (pendingStatus === 'afsluttet' && !aarsag) return; // kræv årsag
    const aarsagLabel = AARSAGER.find(a => a.id === aarsag)?.label || '';
    const noteText = pendingStatus === 'afsluttet'
      ? `Forløb afsluttet — ${aarsagLabel}${note ? ': ' + note : ''}${opfoelgning ? ' · Opfølgning om 3 måneder planlagt' : ''}`
      : `Status ændret til "${STATUSES.find(s=>s.id===pendingStatus)?.label}" ${note ? '— ' + note : ''}`;
    const entry = {
      id: 'k-' + Date.now(),
      menneskeId: m.id,
      type: 'notat',
      dato: new Date().toISOString().slice(0, 10),
      status: 'gennemfoert',
      note: noteText.trim(),
    };
    if (window.SoS_KONTAKTER) window.SoS_KONTAKTER.push(entry);
    if (window.SoS_STORE) window.SoS_STORE.save('kontakter', window.SoS_KONTAKTER);
    onStatusChange(pendingStatus);
    setPendingStatus(null);
    setNote('');
    setAarsag('');
    setOpfoelgning(false);
    setOpen(false);
  };

  return (
    <div style={{ padding: '10px 16px', borderBottom: `1px solid ${SoS.line}`,
      background: SoS.surfaceAlt }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600,
          color: SoS.inkMuted, letterSpacing: 1, textTransform: 'uppercase' }}>STATUS</span>
        <button onClick={() => setOpen(v => !v)} style={{
          display: 'flex', alignItems: 'center', gap: 6,
          padding: '4px 10px', borderRadius: SoS.r.sm, cursor: 'pointer',
          background: current.color + '18', border: `1px solid ${current.color}44`,
          fontFamily: SoS.sans, fontSize: 12, fontWeight: 600, color: current.color }}>
          {current.label}
          <Icon name="chevronD" size={10} color={current.color}/>
        </button>
      </div>

      {open && (
        <div style={{ marginTop: 10, background: SoS.surface,
          border: `1px solid ${SoS.line}`, padding: 14 }}>
          <div style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600,
            color: SoS.inkMuted, letterSpacing: 1, textTransform: 'uppercase', marginBottom: 10 }}>
            Skift status
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 12 }}>
            {STATUSES.filter(s => s.id !== m.status).map(s => (
              <button key={s.id} onClick={() => setPendingStatus(s.id)} style={{
                padding: '5px 12px', borderRadius: SoS.r.sm, cursor: 'pointer',
                background: pendingStatus === s.id ? s.color : SoS.surfaceAlt,
                color: pendingStatus === s.id ? '#fff' : SoS.ink,
                border: `1px solid ${pendingStatus === s.id ? s.color : SoS.line}`,
                fontFamily: SoS.sans, fontSize: 12, fontWeight: 500 }}>
                {s.label}
              </button>
            ))}
          </div>
          {pendingStatus && (
            <>
              {/* Årsagskode ved afslutning */}
              {pendingStatus === 'afsluttet' && (
                <div style={{ marginBottom: 12 }}>
                  <div style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600,
                    color: SoS.inkMuted, letterSpacing: 1, textTransform: 'uppercase', marginBottom: 8 }}>
                    Årsag til afslutning *
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {[
                      { id: 'naturlig',  label: 'Naturlig afslutning' },
                      { id: 'frafald',   label: 'Frafald' },
                      { id: 'flytning',  label: 'Flytning' },
                      { id: 'doedfald',  label: 'Dødsfald' },
                      { id: 'andet',     label: 'Andet' },
                    ].map(a => (
                      <label key={a.id} style={{ display: 'flex', alignItems: 'center', gap: 8,
                        cursor: 'pointer', fontFamily: SoS.sans, fontSize: 12, color: SoS.ink }}>
                        <input type="radio" name="aarsag" value={a.id}
                          checked={aarsag === a.id}
                          onChange={() => setAarsag(a.id)}
                          style={{ accentColor: SoS.red }}/>
                        {a.label}
                      </label>
                    ))}
                  </div>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 10,
                    cursor: 'pointer', fontFamily: SoS.sans, fontSize: 12, color: SoS.ink }}>
                    <input type="checkbox" checked={opfoelgning}
                      onChange={e => setOpfoelgning(e.target.checked)}
                      style={{ accentColor: SoS.accent }}/>
                    Planlæg opfølgning om 3 måneder
                  </label>
                </div>
              )}
              <textarea
                placeholder={pendingStatus === 'afsluttet' ? 'Evt. uddybende noter…' : 'Tilføj note (valgfrit)…'}
                value={note} onChange={e => setNote(e.target.value)}
                style={{ width: '100%', minHeight: 60, padding: '8px 10px',
                  border: `1px solid ${SoS.line}`, background: SoS.surface,
                  fontFamily: SoS.sans, fontSize: 13, color: SoS.ink,
                  resize: 'vertical', outline: 'none', boxSizing: 'border-box',
                  marginBottom: 10 }}/>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={confirm}
                  disabled={pendingStatus === 'afsluttet' && !aarsag}
                  style={{
                    padding: '7px 16px',
                    background: (pendingStatus === 'afsluttet' && !aarsag) ? SoS.line : (pendingStatus === 'afsluttet' ? SoS.red : SoS.ink),
                    color: '#fff', border: 'none', borderRadius: SoS.r.sm,
                    fontFamily: SoS.sans, fontSize: 12, fontWeight: 600,
                    cursor: (pendingStatus === 'afsluttet' && !aarsag) ? 'not-allowed' : 'pointer' }}>
                  {pendingStatus === 'afsluttet' ? 'Afslut forløb' : 'Bekræft ændring'}
                </button>
                <button onClick={() => { setPendingStatus(null); setAarsag(''); setOpen(false); }} style={{
                  padding: '7px 16px', background: SoS.surfaceAlt, color: SoS.ink,
                  border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                  fontFamily: SoS.sans, fontSize: 12, cursor: 'pointer' }}>
                  Annuller
                </button>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
};


const DesktopMennesker = ({ initialTarget, onTargetConsumed }) => {
  const [search,       setSearch]       = React.useState('');
  const [typeFilter,   setTypeFilter]   = React.useState('alle');
  const [statusFilter, setStatusFilter] = React.useState('alle');
  const [selected,     setSelected]     = React.useState(null);
  const [showIntake,   setShowIntake]   = React.useState(false);
  const [refreshKey,   setRefreshKey]   = React.useState(0);

  // Consume initialTarget from global search
  React.useEffect(() => {
    if (initialTarget && initialTarget.type === 'menneske') {
      setSelected(SoS_MENNESKER[initialTarget.id] || null);
      if (onTargetConsumed) onTargetConsumed();
    }
  }, [initialTarget]);

  // Live-opdatering når brobygger accepterer/afviser via mobil
  React.useEffect(() => {
    const refresh = () => {
      setRefreshKey(k => k + 1);
      setSelected(prev => prev ? (window.SoS_MENNESKER?.[prev.id] || prev) : null);
    };
    window.addEventListener('sos-mennesker-updated', refresh);
    return () => window.removeEventListener('sos-mennesker-updated', refresh);
  }, []);

  const alle = Object.values(window.SoS_MENNESKER || SoS_MENNESKER);
  const filtered = alle.filter(m => {
    const navn = (m.firstName + ' ' + m.lastName).toLowerCase();
    if (search && !navn.includes(search.toLowerCase())) return false;
    if (typeFilter !== 'alle' && m.type !== typeFilter) return false;
    if (statusFilter !== 'alle' && m.status !== statusFilter) return false;
    return true;
  });

  const STATUS_FARVER = {
    aktiv:  { bg: '#E8F5E9', color: '#388E3C' },
    venter: { bg: '#FFF3E0', color: '#E87A3E' },
    pause:  { bg: '#F5F5F5', color: '#9E9E9E' },
    afsluttet: { bg: '#FCE4EC', color: '#C62828' },
    afventer: { bg: '#FFF3E0', color: '#E87A3E' },
  };

  if (showIntake) return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 300, overflowY: 'auto' }}>
      <IntakeFlow onClose={() => setShowIntake(false)} onDone={() => setShowIntake(false)}/>
    </div>
  );

  const tablePanel = (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, minWidth: 0, flex: 1 }}>
      {/* Toolbar */}
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8,
          background: SoS.surfaceAlt, borderRadius: 0, padding: '9px 16px',
          border: `1px solid ${SoS.line}` }}>
          <Icon name="search" size={16} color={SoS.inkMuted}/>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Søg på navn…"
            style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent',
              fontFamily: SoS.sans, fontSize: 14, color: SoS.ink }}/>
          {search && (
            <button onClick={() => setSearch('')} style={{ background: 'none', border: 'none',
              cursor: 'pointer', color: SoS.inkMuted, fontSize: 18, padding: 0 }}>×</button>
          )}
        </div>
        <button onClick={() => setShowIntake(true)} style={{
          padding: '9px 18px', background: SoS.ink, color: '#fff',
          border: 'none', borderRadius: SoS.r.sm, fontFamily: SoS.sans,
          fontSize: 13, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap',
        }}>+ Opret menneske</button>
      </div>

      {/* Filtre */}
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {['alle', 'sundhed', 'forening', 'social'].map(f => {
          const t = SoS_TYPER[f];
          const sel = typeFilter === f;
          return (
            <button key={f} onClick={() => setTypeFilter(f)} style={{
              padding: '5px 12px', borderRadius: SoS.r.sm,
              background: sel ? (t ? t.color : SoS.ink) : SoS.surface,
              color: sel ? '#fff' : SoS.inkSoft,
              border: `1px solid ${sel ? (t ? t.color : SoS.ink) : SoS.line}`,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 700 : 400,
              cursor: 'pointer',
            }}>{f === 'alle' ? 'Alle typer' : t.label}</button>
          );
        })}
        <div style={{ width: 1, background: SoS.line, margin: '0 4px' }}/>
        {['alle', 'aktiv', 'venter', 'afventer', 'pause'].map(s => {
          const sel = statusFilter === s;
          const fc = STATUS_FARVER[s] || {};
          return (
            <button key={s} onClick={() => setStatusFilter(s)} style={{
              padding: '5px 12px', borderRadius: SoS.r.sm,
              background: sel ? (fc.color || SoS.ink) : SoS.surface,
              color: sel ? '#fff' : SoS.inkSoft,
              border: `1px solid ${sel ? (fc.color || SoS.ink) : SoS.line}`,
              fontFamily: SoS.sans, fontSize: 12, fontWeight: sel ? 700 : 400,
              cursor: 'pointer',
            }}>{s === 'alle' ? 'Alle statusser' : s.charAt(0).toUpperCase() + s.slice(1)}</button>
          );

      </div>

      <DSCard style={{ padding: 0, overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: SoS.surface, borderBottom: `1px solid ${SoS.line}` }}>
              {['Menneske', 'Type', 'Status', 'Indsatsniveau', 'Kontakter', 'Registreret'].map(h => (
                <th key={h} style={{ padding: '10px 14px', textAlign: 'left',
                  fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                  color: SoS.inkMuted, letterSpacing: 0.8, textTransform: 'uppercase' }}>{h}</th>

                <td colSpan={6}>
                  <div style={{ padding: '40px 24px', textAlign: 'center' }}>
                    <div style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 600,
                      color: SoS.ink, marginBottom: 6 }}>

                    </div>

                      {search ? 'Prøv et andet søgeord' : 'Juster filtrene eller opret et nyt menneske'}
                    </div>
                    {!search && (
                      <button onClick={() => { setTypeFilter('alle'); setStatusFilter('alle'); }}
                        style={{ padding: '7px 16px', background: SoS.surfaceAlt,
                          border: `1px solid ${SoS.line}`, borderRadius: SoS.r.sm,
                          fontFamily: SoS.sans, fontSize: 12, cursor: 'pointer', color: SoS.ink }}>
                        Nulstil filtre
                      </button>
                    )}
                  </div>
                </td>
              </tr>
            )}
            {filtered.map((m, i) => {
              const t = SoS_TYPER[m.type];
              const stats = calcMenneskeStats(m.id);
              const nMeta = INDSATS_META[stats.indsatsniveau];
              const sf = STATUS_FARVER[m.status] || {};
              const dato = m.startedAt || m.registeredAt || '';
              const isSelected = selected && selected.id === m.id;
              return (
                <tr key={m.id}
                  onClick={() => setSelected(isSelected ? null : m)}
                  style={{ borderBottom: `1px solid ${SoS.line}`,
                    cursor: 'pointer',
                    background: isSelected ? SoS.accent + '0D' : 'transparent',
                    borderLeft: isSelected ? `3px solid ${SoS.accent}` : '3px solid transparent',
                    transition: 'background 0.1s' }}
                  onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = SoS.surfaceAlt; }}
                  onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = 'transparent'; }}
                >
                  <td style={{ padding: '12px 14px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <Avatar initials={m.initials} bg={t ? t.soft : SoS.surfaceAlt} size={28}/>
                      <span style={{ fontFamily: SoS.sans, fontSize: 13,
                        fontWeight: 600, color: SoS.ink }}>{m.firstName} {m.lastName}</span>

                  </td>
                  <td style={{ padding: '12px 14px' }}>
                    {t && <Pill bg={t.soft} color={t.color}>{t.short || t.label}</Pill>}
                  </td>
                  <td style={{ padding: '12px 14px' }}>
                    <Pill bg={sf.bg || SoS.surfaceAlt} color={sf.color || SoS.inkMuted}>
                      {m.status ? m.status.charAt(0).toUpperCase() + m.status.slice(1) : '—'}
                    </Pill>
                  </td>
                  <td style={{ padding: '12px 14px' }}>
                    {nMeta && <Pill bg={nMeta.color + '22'} color={nMeta.color}>{nMeta.label}</Pill>}
                  </td>
                  <td style={{ padding: '12px 14px', fontFamily: SoS.sans,
                    fontSize: 13, color: SoS.ink }}>{stats.antalKontakter}</td>
                  <td style={{ padding: '12px 14px', fontFamily: SoS.sans,
                    fontSize: 12, color: SoS.inkMuted }}>
                    {dato ? new Date(dato).toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}

            })}

          {filtered.length} af {alle.length} mennesker
        </div>
      </DSCard>
    </div>
  );

  if (!selected) return tablePanel;

  // Split-pane layout
  return (
    <div style={{ display: 'flex', gap: 16, height: '100%', minHeight: 0, alignItems: 'flex-start' }}>

        {/* Desktop status bar */}
        <DesktopMenneskeStatus
          menneske={selected}
          onStatusChange={(newStatus) => {
            if (window.SoS_MENNESKER && window.SoS_MENNESKER[selected.id]) {
              window.SoS_MENNESKER[selected.id].status = newStatus;
              if (window.SoS_STORE) window.SoS_STORE.save('mennesker', window.SoS_MENNESKER);
            }
            setSelected({ ...selected, status: newStatus });
            setRefreshKey(k => k + 1);

        />

        {(() => {
          const bb = selected.brobyggerId ? (window.SoS_BROBYGGERE || []).find(b => b.id === selected.brobyggerId) : null;

            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 16px',
              background: SoS.sageSoft, borderBottom: `1px solid ${SoS.line}` }}>

          const anm = selected.matchAnmodning;
          if (anm?.status === 'afventer') {
            const anmBb = (window.SoS_BROBYGGERE || []).find(b => b.id === anm.brobyggerId);
            return (
              <div style={{ padding: '8px 16px', background: '#EEF2FF',

            <div style={{ padding: '8px 16px', background: SoS.amberSoft || '#FFF8E1',
              borderBottom: `1px solid ${SoS.line}`, fontFamily: SoS.sans, fontSize: 12,
              color: SoS.amber, display: 'flex', alignItems: 'center', gap: 6 }}>
              ⏳ Afventer match med brobygger

          return null;
        })()}

        {/* The mobile-style panel (reused as-is) */}
        <div style={{ fontSize: '0.9em' }}>
          <MenneskeDetailPanel
            menneske={selected}
            onClose={() => setSelected(null)}
          />
        </div>
      </div>
    </div>
  );
};


const DesktopSROI = () => {
  const rates = window.SROI_SETTINGS || { sundhed: 1840, forening: 1420, social: 1260, investment: 8400000 };
  const snap = window.calcSROISnapshot ? window.calcSROISnapshot() : { byType: {} };
  const sundhedCount  = snap.byType.sundhed  || 0;
  const foreningCount = snap.byType.forening || 0;
  const socialCount   = snap.byType.social   || 0;
  const sroi = sundhedCount * rates.sundhed + foreningCount * rates.forening + socialCount * rates.social;
  const investment = rates.investment;
  return (
    <>
      <DSCard style={{ marginBottom: 14,
        background: SoS.ink,
        color: '#fff', border: 'none', borderRadius: 0 }}>
        <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
          opacity: 0.7, letterSpacing: 1, textTransform: 'uppercase' }}>
          Effekt & dokumentation · Jan–apr 2026
        </div>
        <div style={{ display: 'flex', gap: 40, marginTop: 10 }}>
          <div>
            <div style={{ fontSize: 10, opacity: 0.85 }}>Samlet værdi</div>
            <div style={{ fontFamily: SoS.mono, fontSize: 40, fontWeight: 700, letterSpacing: -1 }}>
              {(sroi / 1_000_000).toFixed(1).replace('.', ',')} mio. kr
            </div>
          </div>
          <div>
            <div style={{ fontSize: 10, opacity: 0.85 }}>Investering</div>
            <div style={{ fontFamily: SoS.mono, fontSize: 40, fontWeight: 700, letterSpacing: -1 }}>
              {(investment / 1_000_000).toFixed(1).replace('.', ',')} mio. kr
            </div>
          </div>
          <div>
            <div style={{ fontSize: 10, opacity: 0.85 }}>Ratio</div>
            <div style={{ fontFamily: SoS.mono, fontSize: 40, fontWeight: 700, letterSpacing: -1 }}>
              1 : {(sroi / investment).toFixed(2)}
            </div>
          </div>
        </div>
      </DSCard>

      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr',
        gap: 10, marginBottom: 14 }}>
        <DSCard title="Beregning pr. type">
          {[
            { k: 'sundhed',  count: sundhedCount,  rate: rates.sundhed  },
            { k: 'forening', count: foreningCount, rate: rates.forening },
            { k: 'social',   count: socialCount,   rate: rates.social   },
          ].map(r => {
            const t = SoS_TYPER[r.k];
            const v = r.count * r.rate;
            return (
              <div key={r.k} style={{ padding: '12px 0',
                borderBottom: `1px solid ${SoS.lineSoft}`,
                display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr',
                alignItems: 'center', gap: 12 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 8, height: 8, borderRadius: 4, background: t.color }}/>
                  <span style={{ fontFamily: SoS.sans, fontSize: 13,
                    fontWeight: 600, color: SoS.ink }}>{t.label}</span>
                </div>
                <span style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>
                  {r.count} mennesker
                </span>
                <span style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>
                  × {r.rate.toLocaleString('da-DK')} kr
                </span>
                <span style={{ fontFamily: SoS.font, fontSize: 16, fontWeight: 500,
                  color: SoS.ink, textAlign: 'right' }}>
                  {(v / 1_000_000).toFixed(2).replace('.', ',')} mio. kr
                </span>
              </div>
            );
          })}
        </DSCard>
        <DSCard title="Kilde & antagelser">
          <ul style={{ fontFamily: SoS.sans, fontSize: 11, color: SoS.inkSoft,
            lineHeight: 1.6, paddingLeft: 16, margin: 0 }}>
            <li>VIVE (2023) — "Ensomhed og samfundsøkonomi"</li>
            <li>Rambøll SROI-guide for civilsamfund</li>
            <li>Deadweight: −18%</li>
            <li>Attribution: −10%</li>
            <li>Sensitivity ±15%</li>
          </ul>
        </DSCard>
      </div>


      <DSCard title="Indgang · hvem henviser" style={{ marginTop: 10 }}>
        {(() => {
          const kildeStat = {};
          Object.values(SoS_MENNESKER).forEach(m => {
            const k = m.kilde || 'ukendt';
            kildeStat[k] = (kildeStat[k] || 0) + 1;
          });
          const total = Object.values(kildeStat).reduce((a, b) => a + b, 0);
          const KILDE_META = {
            selv:       { label: 'Egen henvendelse',    color: SoS.sage },
            kommune:    { label: 'Kommunal henvisning', color: SoS.sky },
            hospital:   { label: 'Hospitalsudslusning', color: SoS.orange },
            paarørende: { label: 'Familie / pårørende', color: '#8C6BAE' },
            org:        { label: 'Anden organisation',  color: '#7FA089' },
            ukendt:     { label: 'Ikke registreret',    color: SoS.inkMuted },
          };
          const sorted = Object.entries(kildeStat).sort((a, b) => b[1] - a[1]);
          return (
            <div>
              {sorted.map(([k, n]) => {
                const meta = KILDE_META[k] || KILDE_META.ukendt;
                const pct = Math.round(n / total * 100);
                return (
                  <div key={k} style={{ marginBottom: 10 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between',
                      alignItems: 'center', marginBottom: 4 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                        <div style={{ width: 8, height: 8, borderRadius: 4, background: meta.color }}/>
                        <span style={{ fontFamily: SoS.sans, fontSize: 13,
                          color: SoS.ink, fontWeight: 500 }}>{meta.label}</span>
                      </div>
                      <span style={{ fontFamily: SoS.sans, fontSize: 12,
                        color: SoS.inkSoft }}>{n} pers. · {pct}%</span>
                    </div>
                    <div style={{ height: 6, borderRadius: 3, background: SoS.lineSoft }}>
                      <div style={{ height: '100%', borderRadius: 3,
                        background: meta.color, width: `${pct}%`,
                        transition: 'width 0.4s' }}/>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </DSCard>
      <DSCard title="Effekt · UCLA-3 over tid">
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 4, height: 160 }}>
          {[6.4, 6.1, 5.6, 5.1, 4.6, 4.2, 3.8, 3.5, 3.3, 3.2, 3.1, 3.1].map((v, i) => (
            <div key={i} style={{ flex: 1, display: 'flex',
              flexDirection: 'column', alignItems: 'center', gap: 6 }}>
              <div style={{ flex: 1, display: 'flex', alignItems: 'flex-end', width: '100%' }}>
                <div style={{ width: '100%', height: `${(v/7) * 100}%`,
                  background: `linear-gradient(180deg, ${SoS.sage}, ${SoS.sageSoft})`,
                  borderRadius: '3px 3px 0 0' }}/>
              </div>
              <div style={{ fontFamily: SoS.sans, fontSize: 9, color: SoS.inkMuted }}>{i}m</div>
            </div>
          ))}
        </div>
      </DSCard>
    </>
  );
};

const DesktopApptModal = ({ initial = {}, onClose, onSave, onDelete }) => {
  const [form, setForm] = React.useState({
    date:        initial.date        || new Date().toISOString().slice(0,10),
    start:       initial.start       || '10:00',
    end:         initial.end         || '11:00',
    brobyggerId: initial.brobyggerId || '',
    menneskeId:  initial.menneskeId  || '',
    activity:    initial.activity    || '',
    location:    initial.location    || '',
    status:        initial.status        || 'pending',
    kategori:      initial.kategori      || '',
    underkategori: initial.underkategori || '',
    brobyggerNote:  initial.brobyggerNote  || '',
    aftaleForm:    initial.aftaleForm    || 'enkelt',
    gentagelse:    initial.gentagelse    || '',
    fremmoedeType: initial.fremmoedeType || '',
    aktivitetsTid: initial.aktivitetsTid || '',
  });
  const upd = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
  const selKat = form.kategori ? AKTIVITET_KATEGORIER[form.kategori] : null;
  const aktiveBb = SoS_BROBYGGERE.filter(b => b.status === 'aktiv' || b.status === 'ny');
  const alleMennesker = Object.values(SoS_MENNESKER)
    .sort((a, b) => (a.firstName + a.lastName).localeCompare(b.firstName + b.lastName));
  const isEdit  = !!initial.id;

  const timeToMin = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };
  const conflict = React.useMemo(() => {
    if (!form.brobyggerId || !form.date || !form.start || !form.end) return null;
    const s = timeToMin(form.start), e = timeToMin(form.end);
    return (window.SoS_APPOINTMENTS_BUSY || []).find(a =>
      a.id !== initial.id &&
      a.brobyggerId === form.brobyggerId &&
      a.date === form.date &&
      timeToMin(a.start) < e && timeToMin(a.end) > s
    ) || null;
  }, [form.brobyggerId, form.date, form.start, form.end]);

  const mennConflict = React.useMemo(() => {
    if (!form.menneskeId || !form.date || !form.start || !form.end) return null;
    const s = timeToMin(form.start), e = timeToMin(form.end);
    return (window.SoS_APPOINTMENTS_BUSY || []).find(a =>
      a.id !== initial.id &&
      a.menneskeId === form.menneskeId &&
      a.date === form.date &&
      timeToMin(a.start) < e && timeToMin(a.end) > s
    ) || null;
  }, [form.menneskeId, form.date, form.start, form.end]);
  const canSave = form.brobyggerId && form.menneskeId && form.activity;

  const inputStyle = { width: '100%', padding: '8px 10px', border: `1px solid ${SoS.line}`,
    background: SoS.surface, fontFamily: SoS.sans, fontSize: 13, color: SoS.ink,
    outline: 'none', boxSizing: 'border-box', borderRadius: 0 };
  const labelStyle = { fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
    color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 4 };

  return (
    <div onClick={e => e.target === e.currentTarget && onClose()}
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.42)', zIndex: 300,
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: SoS.paper,
        width: '100%', maxWidth: 480, border: `1px solid ${SoS.line}`,
        maxHeight: '92vh', overflowY: 'auto' }}>

        {/* Header */}
        <div style={{ padding: '14px 20px', borderBottom: `1px solid ${SoS.line}`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={labelStyle}>{isEdit ? 'REDIGER AFTALE' : 'NY AFTALE'}</div>
          <button onClick={onClose} style={{ background: 'none', border: 'none',
            cursor: 'pointer', fontSize: 20, color: SoS.inkMuted, lineHeight: 1 }}>×</button>
        </div>

        {/* Form */}
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {/* Dato + tid */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
            <div>

const DesktopKalender = () => {
  const [weekOffset,   setWeekOffset]   = React.useState(0);
  const [bbFilter,     setBbFilter]     = React.useState('alle');
  const [typeFilter,   setTypeFilter]   = React.useState('alle');
  const [statusFilter, setStatusFilter] = React.useState('alle');
  const [view,         setView]         = React.useState('uge');
  const [selectedDay,  setSelectedDay]  = React.useState(null);
  const [selectedAppt, setSelectedAppt] = React.useState(null);
  const [appointments, setAppts]        = React.useState(() => [...(SoS_APPOINTMENTS_BUSY || [])]);
  const [apptModal,    setApptModal]    = React.useState(null);
  const [udfaldsModal, setUdfaldsModal] = React.useState(null);

  const saveAppt = (data) => {
    let newItems = [];
    if (data.id) {
      // Opdatering af eksisterende aftale (ingen serie)
      const newList = appointments.map(a => a.id === data.id ? data : a);
      window.SoS_APPOINTMENTS_BUSY = newList;
      if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
      setAppts(newList);
      setApptModal(null);
      return;
    }
    const base = { ...data, id: 'a-' + Date.now() };
    newItems = [base];
    if (data.aftaleForm === 'gentagende' && data.gentagelse && data.gentagelse !== 'variabelt') {
      const shiftDate = (iso, days, months) => {
        const d = new Date(iso);
        if (days)   d.setDate(d.getDate() + days);
        if (months) d.setMonth(d.getMonth() + months);
        return d.toISOString().slice(0, 10);
      };
      const steps = data.gentagelse === 'ugentligt'  ? { days: 7,  count: 7 } :
                    data.gentagelse === 'hver14dag'  ? { days: 14, count: 7 } :
                    /* maanedligt */                   { months: 1, count: 5 };
      for (let i = 1; i <= steps.count; i++) {
        newItems.push({ ...base,
          id:   'a-' + (Date.now() + i),
          date: shiftDate(base.date, steps.days ? steps.days * i : 0, steps.months ? steps.months * i : 0),
        });
      }
    }
    const newList = [...appointments, ...newItems];
    window.SoS_APPOINTMENTS_BUSY = newList;
    if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
    setAppts(newList);
    setApptModal(null);
  };
  const deleteAppt = (id) => {
    const newList = appointments.filter(a => a.id !== id);
    window.SoS_APPOINTMENTS_BUSY = newList;
    if (window.SoS_STORE) window.SoS_STORE.save('appointments', newList);
    setAppts(newList);
    setSelectedAppt(null);
    setApptModal(null);
  };

  const TODAY  = '2026-04-26';
  const DNAMES = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
  const MDR    = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
  const pad    = n => String(n).padStart(2, '0');
  const fmt    = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());

  const baseDate = new Date(TODAY);
  const dow = baseDate.getDay();
  const monday = new Date(baseDate);
  monday.setDate(baseDate.getDate() + (dow === 0 ? -6 : 1 - dow) + weekOffset * 7);

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
  });

  const weekLabel = (() => {
    const m1 = days[0], m2 = days[6];
    const s = `${m1.getDate()}. ${MDR[m1.getMonth()]}`;
    const e = `${m2.getDate()}. ${MDR[m2.getMonth()]} ${m2.getFullYear()}`;
    const d = new Date(Date.UTC(m1.getFullYear(), m1.getMonth(), m1.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const wn = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return `Uge ${wn}  ·  ${s} – ${e}`;
  })();

  const aktiveBb = SoS_BROBYGGERE.filter(b => b.status === 'aktiv' || b.status === 'ny');
  const weekDates = new Set(days.map(fmt));

  const applyFilters = (appts) => appts.filter(a => {
    if (bbFilter !== 'alle' && a.brobyggerId !== bbFilter) return false;
    if (statusFilter === 'confirmed' && a.status !== 'confirmed') return false;
    if (statusFilter === 'pending'   && a.status !== 'pending')   return false;
    if (typeFilter !== 'alle') {
      const m = SoS_MENNESKER[a.menneskeId];
      if (!m || m.type !== typeFilter) return false;
    }
    return true;
  });

  const weekAppts         = appointments.filter(a => weekDates.has(a.date));
  const filteredWeekAppts = applyFilters(weekAppts);
  const nOK   = filteredWeekAppts.filter(a => a.status === 'confirmed').length;
  const nPend = filteredWeekAppts.filter(a => a.status === 'pending').length;

  const getAppts = ds => applyFilters(
    appointments.filter(a => a.date === ds)
  ).sort((a, b) => a.start.localeCompare(b.start));

  const selDs     = selectedDay || TODAY;
  const selAppts  = getAppts(selDs);
  const listeGroups = days.filter(d => getAppts(fmt(d)).length > 0);

  const B = (extra) => Object.assign({
    padding: '6px 12px', borderRadius: SoS.r.sm,
    border: `1px solid ${SoS.line}`,
    fontFamily: SoS.sans, fontSize: 12, fontWeight: 500,
    cursor: 'pointer', background: 'transparent', color: SoS.inkSoft,
  }, extra || {});

  const MAX = 3;

  const renderRow = a => {
    const m  = SoS_MENNESKER[a.menneskeId];
    const bb = SoS_BROBYGGERE.find(b => b.id === a.brobyggerId);
    const t  = m ? SoS_TYPER[m.type] : null;
    const ok = a.status === 'confirmed';
    return (
      <div key={a.id} style={{
        background: SoS.surface, borderRadius: 0, marginBottom: 8,
        border: `1px solid ${SoS.line}`, padding: '12px 14px',
        borderLeft: '3px solid ' + (ok ? SoS.green : SoS.amber),
        display: 'grid', gridTemplateColumns: 'auto 1fr auto auto auto', gap: 12,
        alignItems: 'center',
      }}>
        <div style={{ textAlign: 'center', minWidth: 40 }}>
          <div style={{ fontFamily: SoS.mono, fontSize: 14, fontWeight: 700, color: SoS.ink }}>{a.start}</div>
          <div style={{ fontFamily: SoS.mono, fontSize: 10, color: SoS.inkMuted }}>{a.end}</div>

        <div>
          <div style={{ fontFamily: SoS.sans, fontSize: 13, fontWeight: 600, color: SoS.ink,

              <span title="Gentagende aftale" style={{ fontSize: 11, color: SoS.orange,
                fontFamily: SoS.mono, fontWeight: 700 }}>↻</span>
            )}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 3 }}>
            {m && <span style={{ fontFamily: SoS.sans, fontSize: 12, color: SoS.inkSoft }}>{m.firstName} {m.lastName}</span>}
            {t  && <span style={{ fontFamily: SoS.mono, fontSize: 9, fontWeight: 600,
              color: t.color, textTransform: 'uppercase', letterSpacing: 0.5 }}>{t.short}</span>}

              fontWeight: 700, color: '#fff' }}>{bb.avatar}</div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'center' }}>
          <button onClick={() => setSelectedAppt(a)}
            style={{ background: 'none', border: 'none', cursor: 'pointer',
              padding: '4px 6px', color: SoS.inkMuted }}>
            <Icon name="eye" size={14} color={SoS.inkMuted}/>
          </button>
          <button onClick={() => setApptModal(a)}
            style={{ background: 'none', border: 'none', cursor: 'pointer',
              padding: '4px 6px', color: SoS.inkMuted }}>
            <Icon name="edit" size={14} color={SoS.inkMuted}/>
          </button>
          {a.date < TODAY && !a.udfald && (
            <button onClick={() => setUdfaldsModal(a)}

                fontFamily: SoS.mono, fontSize: 8.5, fontWeight: 700,
                color: SoS.accent, textTransform: 'uppercase', letterSpacing: 0.5,
                whiteSpace: 'nowrap' }}>

            </button>

          {a.brobyggerLog && (
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontFamily: SoS.mono, fontSize: 8.5, fontWeight: 700,
                color: a.brobyggerLog.udfald === 'gennemfoert' ? SoS.green
                     : a.brobyggerLog.udfald === 'ikke-modt'  ? SoS.red : SoS.amber,
                textTransform: 'uppercase', letterSpacing: 0.5 }}>
                {a.brobyggerLog.udfald === 'gennemfoert' ? '✓ OK'
                : a.brobyggerLog.udfald === 'ikke-modt'  ? '✗ Udeblev' : '~ Afbud'}
              </div>
              {a.brobyggerLog.varighed > 0 && (
                <div style={{ fontFamily: SoS.mono, fontSize: 8, color: SoS.inkMuted, marginTop: 1 }}>
                  {a.brobyggerLog.varighed >= 60
                    ? Math.round(a.brobyggerLog.varighed/60*10)/10 + 't'
                    : a.brobyggerLog.varighed + 'm'}
                </div>
              )}
              {!a.raadgiverOpfoelgning && (
                <div style={{ fontFamily: SoS.mono, fontSize: 7.5, fontWeight: 600,
                  color: SoS.amber, marginTop: 2 }}>AFVENT</div>
              )}
              {a.raadgiverOpfoelgning === 'fulgt-op' && (
                <div style={{ fontFamily: SoS.mono, fontSize: 7.5, color: SoS.green }}>FULGT OP</div>
              )}
            </div>
          )}
          {!a.brobyggerLog && a.udfald && (
            <div style={{ fontFamily: SoS.mono, fontSize: 8.5, fontWeight: 700,
              color: a.udfald === 'gennemfoert' ? SoS.green : a.udfald === 'ikke-modt' ? SoS.red : SoS.amber,
              textTransform: 'uppercase', letterSpacing: 0.5, textAlign: 'center' }}>
              {a.udfald === 'gennemfoert' ? '✓ OK' : a.udfald === 'ikke-modt' ? '✗ Udeblev' : '~ Afbud'}
            </div>
          )}
        </div>
      </div>
    );
  };

  // ── Vagtplan ──────────────────────────────────────────────────────────────
  const renderVagtplan = () => (
    <div>
      <div style={{ background: SoS.surface, border: `1px solid ${SoS.line}`, overflow: 'hidden', marginBottom: 14 }}>

        <div style={{ display: 'grid', gridTemplateColumns: '170px repeat(7, 1fr)',
          borderBottom: `1px solid ${SoS.line}`, background: SoS.surfaceAlt }}>
          <div style={{ padding: '10px 14px', fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
            color: SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.8 }}>Brobygger</div>
          {days.map((d, i) => {
            const ds = fmt(d), isT = ds === TODAY;
            return (
              <div key={i} style={{ padding: '10px 6px', textAlign: 'center',
                borderLeft: `1px solid ${SoS.line}`,
                background: isT ? SoS.accent + '08' : 'transparent' }}>
                <div style={{ fontFamily: SoS.mono, fontSize: 9.5, fontWeight: 600,
                  color: isT ? SoS.accent : SoS.inkMuted, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  {DNAMES[i]}
                </div>
                <div style={{ fontFamily: SoS.sans, fontSize: 14, fontWeight: 700,
                  color: isT ? SoS.accent : SoS.ink, marginTop: 2 }}>
                  {d.getDate()}.
                </div>
                <div style={{ fontFamily: SoS.mono, fontSize: 9, color: SoS.inkMuted, marginTop: 1 }}>
                  {appointments.filter(a => a.date === ds).length || '—'}

              </div>
            );
          })}
